<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VinaSpends - Web App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    :root {
      --primary: #8ED1FC;
      --background: #09121A;
      --surface: #121E2A;
      --text-primary: #F0F5FA;
      --text-secondary: #8CA1B3;
      --variant: #1A2A38;
      --border: #2E4456;
      --expense: #D32F2F;
      --expense-light: #FFAEAE;
      --income: #2E7D32;
      --income-light: #69F0AE;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              primary: 'var(--primary)',
              background: 'var(--background)',
              surface: 'var(--surface)',
              textPrimary: 'var(--text-primary)',
              textSecondary: 'var(--text-secondary)',
              variant: 'var(--variant)',
              border: 'var(--border)'
            },
            expense: 'var(--expense)',
            expenseLight: 'var(--expense-light)',
            income: 'var(--income)',
            incomeLight: 'var(--income-light)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-theme-background text-theme-textPrimary min-h-screen overscroll-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const THEMES = {
      ocean: { name: "Đại dương Cổ điển", colors: { primary: "#8ED1FC", background: "#09121A", surface: "#121E2A", textPrimary: "#F0F5FA", textSecondary: "#8CA1B3", variant: "#1A2A38", border: "#2E4456" } },
      emerald: { name: "Lục bảo Ngọc", colors: { primary: "#69F0AE", background: "#051206", surface: "#0C240E", textPrimary: "#E8F5E9", textSecondary: "#81C784", variant: "#143B17", border: "#1B5E20" } },
      terracotta: { name: "Đất nung Ấm áp", colors: { primary: "#FFAB91", background: "#140D09", surface: "#221611", textPrimary: "#FFEBE3", textSecondary: "#BCAAA4", variant: "#332019", border: "#5C382C" } },
      purple: { name: "Thạch anh Hoàng gia", colors: { primary: "#E040FB", background: "#12091A", surface: "#1F122A", textPrimary: "#FBE9FF", textSecondary: "#CE93D8", variant: "#2F1B3E", border: "#5A2A7B" } },
      minimalist: { name: "Tối giản Đen Trắng", colors: { primary: "#FFFFFF", background: "#111111", surface: "#1A1A1A", textPrimary: "#FFFFFF", textSecondary: "#888888", variant: "#262626", border: "#444444" } },
    };

    const BANK_LOGOS = [
      { name: "Vietcombank", url: "https://api.vietqr.io/img/VCB.png" },
      { name: "Techcombank", url: "https://api.vietqr.io/img/TCB.png" },
      { name: "MB Bank", url: "https://api.vietqr.io/img/MB.png" },
      { name: "TPBank", url: "https://api.vietqr.io/img/TPB.png" },
      { name: "VPBank", url: "https://api.vietqr.io/img/VPB.png" },
      { name: "Agribank", url: "https://api.vietqr.io/img/AGR.png" },
      { name: "BIDV", url: "https://api.vietqr.io/img/BIDV.png" },
      { name: "VietinBank", url: "https://api.vietqr.io/img/ICB.png" },
      { name: "Sacombank", url: "https://api.vietqr.io/img/STB.png" },
      { name: "ACB", url: "https://api.vietqr.io/img/ACB.png" },
      { name: "VIB", url: "https://api.vietqr.io/img/VIB.png" },
      { name: "Shinhan Bank", url: "https://api.vietqr.io/img/SHB.png" },
      { name: "Ví MoMo", url: "https://cdn.haitrieu.com/wp-content/uploads/2022/10/Logo-MoMo-Square.png" },
      { name: "ZaloPay", url: "https://cdn.haitrieu.com/wp-content/uploads/2022/10/Logo-ZaloPay-Square.png" },
      { name: "Ví ShopeePay", url: "https://cdn.haitrieu.com/wp-content/uploads/2022/10/Logo-ShopeePay-Orange.png" },
      { name: "Viettel Money", url: "https://cdn.haitrieu.com/wp-content/uploads/2022/10/Logo-Viettel-Money.png" },
      { name: "Tiền mặt", url: null, icon: "banknote" }
    ];

    const getBankLogo = (bankName) => {
      const norm = bankName.toLowerCase().replace(/ /g, '');
      if(norm.includes("vietcombank") || norm.includes("vcb")) return BANK_LOGOS[0].url;
      if(norm.includes("techcombank") || norm.includes("tcb")) return BANK_LOGOS[1].url;
      if(norm.includes("mbbank") || norm.includes("mbb") || (norm.includes("mb") && !norm.includes("momo"))) return BANK_LOGOS[2].url;
      if(norm.includes("tpbank") || norm.includes("tpb")) return BANK_LOGOS[3].url;
      if(norm.includes("vpbank") || norm.includes("vpb")) return BANK_LOGOS[4].url;
      if(norm.includes("agribank") || norm.includes("agr")) return BANK_LOGOS[5].url;
      if(norm.includes("bidv")) return BANK_LOGOS[6].url;
      if(norm.includes("vietinbank") || norm.includes("ctg") || norm.includes("icb")) return BANK_LOGOS[7].url;
      if(norm.includes("sacombank") || norm.includes("stb")) return BANK_LOGOS[8].url;
      if(norm.includes("acb")) return BANK_LOGOS[9].url;
      if(norm.includes("vib")) return BANK_LOGOS[10].url;
      if(norm.includes("shinhan")) return BANK_LOGOS[11].url;
      if(norm.includes("momo")) return BANK_LOGOS[12].url;
      if(norm.includes("zalopay") || norm.includes("zalo")) return BANK_LOGOS[13].url;
      if(norm.includes("shopeepay") || norm.includes("spp")) return BANK_LOGOS[14].url;
      if(norm.includes("viettelmoney") || norm.includes("vtm")) return BANK_LOGOS[15].url;
      return null;
    }

    const getCategoryIcon = (category) => {
        switch (category) {
            case "Ăn uống": return "coffee";
            case "Di chuyển": return "bike";
            case "Mua sắm": return "shopping-bag";
            case "Giải trí": return "gamepad-2";
            case "Lương": return "banknote";
            case "Nhà cửa": return "home";
            case "Sức khỏe": return "heart";
            case "Học tập": return "book";
            case "Hóa đơn": return "file-text";
            case "Đầu tư": return "trending-up";
            case "Tiết kiệm": return "piggy-bank";
            case "Du lịch": return "compass";
            case "Làm đẹp": return "flower";
            case "Quà tặng": return "gift";
            case "Gia đình": return "users";
            case "Thú cưng": return "paw-print";
            case "Mua xe": return "car";
            case "Bảo hiểm": return "shield";
            case "Thuế": return "file";
            case "Thể thao": return "activity";
            case "Từ thiện": return "heart-handshake";
            case "Thiết bị số": return "smartphone";
            case "Sửa chữa": return "wrench";
            case "Ăn vặt": return "ice-cream";
            default: return "tag";
        }
    }

    const formatVND = (num) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(num || 0);

    const Icon = ({ name, className }) => {
      // Small wrapper to ensure Lucide renders reliably
      return <span dangerouslySetInnerHTML={{ __html: `<i data-lucide="${name}" class="${className}"></i>` }} />;
    };

    function App() {
      // Data States
      const [accounts, setAccounts] = useState(() => JSON.parse(localStorage.getItem("vina_accounts")) || [{ id: 1, name: "Tiền mặt", accountNo: "CASH", balance: 0 }]);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem("vina_transactions")) || []);
      const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem("vina_categories")) || ["Ăn uống", "Di chuyển", "Mua sắm", "Giải trí", "Lương", "Nhà cửa", "Sức khỏe", "Học tập", "Hóa đơn", "Đầu tư", "Tiết kiệm", "Du lịch", "Làm đẹp", "Quà tặng", "Gia đình", "Thú cưng", "Mua xe", "Bảo hiểm", "Thuế", "Khác"]);
      const [debts, setDebts] = useState(() => JSON.parse(localStorage.getItem("vina_debts")) || []);
      const [theme, setTheme] = useState(() => localStorage.getItem("vina_theme") || "ocean");

      // UI States
      const [activeTab, setActiveTab] = useState("overview"); 
      const [subTab, setSubTab] = useState("wallet"); // wallet, debts
      const [isAddTxModalOpen, setIsAddTxModalOpen] = useState(false);
      const [isAddBankModalOpen, setIsAddBankModalOpen] = useState(false);
      const [showThemeDialog, setShowThemeDialog] = useState(false);
      const [showSettingsDialog, setShowSettingsDialog] = useState(false);
      
      const [googleClientId, setGoogleClientId] = useState(() => localStorage.getItem("vina_google_client_id") || "");
      const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem("vina_gemini_key") || "");
      const [accessToken, setAccessToken] = useState(null);
      const [syncStatus, setSyncStatus] = useState("Chưa đồng bộ");

      const [aiInputText, setAiInputText] = useState("");
      const [isAiProcessing, setIsAiProcessing] = useState(false);

      useEffect(() => {
        const rootStyle = document.documentElement.style;
        const c = THEMES[theme].colors;
        Object.keys(c).forEach(k => rootStyle.setProperty(`--${k.replace(/([A-Z])/g, "-$1").toLowerCase()}`, c[k]));
        localStorage.setItem("vina_theme", theme);
      }, [theme]);

      useEffect(() => {
        localStorage.setItem("vina_accounts", JSON.stringify(accounts));
        localStorage.setItem("vina_transactions", JSON.stringify(transactions));
        localStorage.setItem("vina_categories", JSON.stringify(categories));
        localStorage.setItem("vina_debts", JSON.stringify(debts));
        localStorage.setItem("vina_google_client_id", googleClientId);
        localStorage.setItem("vina_gemini_key", geminiApiKey);
      }, [accounts, transactions, categories, debts, googleClientId, geminiApiKey]);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      // Calculate totals
      const totalOwned = accounts.reduce((sum, acc) => sum + (Number(acc.balance)||0), 0);
      const totalIncome = transactions.filter(t => t.type === "INCOME").reduce((sum, t) => sum + t.amount, 0);
      const totalExpense = transactions.filter(t => t.type === "EXPENSE").reduce((sum, t) => sum + t.amount, 0);
      const totalDebtLent = debts.filter(d => d.type === "CHO_VAY" && !d.isPaid).reduce((sum, d) => sum + d.amount, 0);
      const totalDebtBorrowed = debts.filter(d => d.type === "VAY" && !d.isPaid).reduce((sum, d) => sum + d.amount, 0);

      const updateData = (newAcc, newTx, newCat, newDebts) => {
        if(newAcc) setAccounts(newAcc);
        if(newTx) setTransactions(newTx);
        if(newCat) setCategories(newCat);
        if(newDebts) setDebts(newDebts);
        setTimeout(() => window.lucide && window.lucide.createIcons(), 50);
      };

      const handleAddTx = (e) => {
        e.preventDefault();
        const tx = { id: Date.now(), type: e.target.type.value, amount: Number(e.target.amount.value) || 0, category: e.target.category.value, bankName: e.target.bankName.value, note: e.target.note.value, date: new Date().toISOString() };
        const newTx = [tx, ...transactions];
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? tx.amount : -tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
        setIsAddTxModalOpen(false);
      };

      const handleDeleteTx = (id) => {
        if(!confirm("Xóa giao dịch này?")) return;
        const tx = transactions.find(t => t.id === id);
        const newTx = transactions.filter(t => t.id !== id);
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? -tx.amount : tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
      };

      const handleAddDebt = (e) => {
        e.preventDefault();
        const d = { id: Date.now(), title: e.target.title.value, type: e.target.type.value, amount: Number(e.target.amount.value) || 0, note: e.target.note.value, date: new Date().toISOString(), isPaid: false };
        updateData(null, null, null, [d, ...debts]);
      };

      const handleToggleDebt = (id) => {
        updateData(null, null, null, debts.map(d => d.id === id ? {...d, isPaid: !d.isPaid} : d));
      };
      
      const handleDeleteDebt = (id) => {
        if(confirm("Xóa khoản nợ này?")) updateData(null, null, null, debts.filter(d => d.id !== id));
      };

      const handleAddBank = (e) => {
        e.preventDefault();
        const b = { id: Date.now(), name: e.target.bankName.value, balance: Number(e.target.balance.value) || 0, accountNo: "N/A" };
        updateData([...accounts, b], null, null, null);
        setIsAddBankModalOpen(false);
      };

      const handleParseAI = async () => {
        if (!geminiApiKey) return alert("Vui lòng cấu hình Gemini API Key bằng nút Cài đặt ở góc phải trên cùng!");
        setIsAiProcessing(true);
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
          const prompt = `Trích xuất JSON từ nội dung này (amount:number, type:"EXPENSE"|"INCOME", category:"text", note:"text", bankName:"text"). Nội dung: ${aiInputText}`;
          const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
          const data = await res.json();
          if(data.error) throw new Error(data.error.message);
          const raw = data.candidates[0].content.parts[0].text;
          const result = JSON.parse(raw.replace(/```json/g, "").replace(/```/g, "").trim());
          
          if (confirm(`AI Phát hiện: ${formatVND(result.amount)} - ${result.type}\nLưu ngay?`)) {
             handleAddTx({ target: { type: { value: result.type }, amount: { value: result.amount }, category: { value: result.category || categories[0] }, bankName: { value: accounts.find(a => a.name.includes(result.bankName))?.name || accounts[0].name }, note: { value: result.note || "AI Scan" } }, preventDefault: ()=>{} });
             setAiInputText("");
          }
        } catch(e) { alert("Lỗi AI: " + e.message); }
        setIsAiProcessing(false);
      };

      // Tab Definitions
      const TABS = [
        { id: "overview", icon: "layout-dashboard", label: "Tổng quan" },
        { id: "report", icon: "bar-chart-2", label: "Báo cáo" },
        { id: "category", icon: "tags", label: "Hạng mục" },
        { id: "wallet_ai", icon: "sparkles", label: "Ví & Liên kết" }
      ];

      return (
        <div className="flex flex-col h-screen md:flex-row pb-16 md:pb-0 font-sans">
          
          {/* HEADER MOBILE */}
          <header className="md:hidden bg-theme-surface border-b border-theme-border px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-sm">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-xl bg-theme-primary flex items-center justify-center shadow-lg shadow-theme-primary/20">
                <Icon name="wallet" className="w-4 h-4 text-theme-background" />
              </div>
              <h1 className="font-bold text-lg text-theme-textPrimary">VinaSpends</h1>
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setShowThemeDialog(true)} className="text-theme-textSecondary hover:text-theme-primary"><Icon name="palette" className="w-5 h-5" /></button>
              <button onClick={()=>setShowSettingsDialog(true)} className="text-theme-textSecondary hover:text-theme-primary"><Icon name="settings" className="w-5 h-5" /></button>
            </div>
          </header>

          {/* SIDEBAR DESKTOP */}
          <aside className="hidden md:flex w-64 bg-theme-surface border-r border-theme-border flex-col p-4 shadow-lg z-10">
             <div className="flex items-center justify-between mb-8 px-2">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-xl bg-theme-primary flex items-center justify-center shadow-lg shadow-theme-primary/20">
                    <Icon name="wallet" className="w-4 h-4 text-theme-background" />
                  </div>
                  <h1 className="font-bold text-xl text-theme-textPrimary">VinaSpends</h1>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setShowThemeDialog(true)} className="text-theme-textSecondary hover:text-theme-primary"><Icon name="palette" className="w-4 h-4" /></button>
                  <button onClick={()=>setShowSettingsDialog(true)} className="text-theme-textSecondary hover:text-theme-primary"><Icon name="settings" className="w-4 h-4" /></button>
                </div>
            </div>
            <nav className="flex-1 space-y-2">
              {TABS.map(t => (
                <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl font-bold transition-all duration-200 ${activeTab===t.id ? 'bg-theme-primary text-theme-background shadow-md shadow-theme-primary/20 scale-[1.02]' : 'text-theme-textSecondary hover:bg-theme-variant hover:text-theme-textPrimary'}`}>
                  <Icon name={t.icon} className="w-5 h-5" />
                  {t.label}
                </button>
              ))}
            </nav>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto no-scrollbar p-4 md:p-8 bg-theme-background relative">
            
            {/* TAB: TỔNG QUAN */}
            {activeTab === "overview" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <div className="relative p-[1px] rounded-[24px] overflow-hidden bg-gradient-to-br from-theme-primary to-theme-surface shadow-2xl">
                  <div className="p-6 rounded-[23px] bg-gradient-to-br from-theme-surface to-theme-variant h-full w-full">
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="text-[11px] font-bold text-theme-textSecondary uppercase tracking-widest flex items-center gap-1.5"><Icon name="shield-check" className="w-3.5 h-3.5" /> TỔNG TÀI SẢN THỰC TẾ</h3>
                        <h2 className="text-[32px] md:text-4xl font-extrabold text-theme-primary mt-2 leading-none">{formatVND(totalOwned - totalDebtBorrowed)}</h2>
                      </div>
                      <div className="bg-white/10 px-2.5 py-1.5 rounded-lg font-mono text-[9px] text-white tracking-wider uppercase font-bold shadow-inner">AES-256 MÃ HOÁ</div>
                    </div>
                    
                    <div className="flex gap-4 mt-6 pt-6 border-t border-theme-border/50">
                      <div className="flex-1 bg-white/5 p-4 rounded-2xl border border-white/5 shadow-inner">
                        <p className="text-[11px] font-bold text-theme-textSecondary uppercase flex items-center gap-1.5"><Icon name="piggy-bank" className="w-3.5 h-3.5 text-incomeLight" /> TÀI SẢN SỞ HỮU</p>
                        <p className="font-bold text-theme-textPrimary mt-1.5 text-sm md:text-base">{formatVND(totalOwned)}</p>
                      </div>
                      <div className="flex-1 bg-white/5 p-4 rounded-2xl border border-white/5 shadow-inner">
                        <p className="text-[11px] font-bold text-theme-textSecondary uppercase flex items-center gap-1.5"><Icon name="credit-card" className="w-3.5 h-3.5 text-expenseLight" /> TỔNG NỢ ĐI VAY</p>
                        <p className="font-bold text-theme-textPrimary mt-1.5 text-sm md:text-base">{formatVND(totalDebtBorrowed)}</p>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 mt-6">
                   <button onClick={()=>setIsAddTxModalOpen(true)} className="flex-1 py-4 bg-theme-primary text-theme-background font-bold rounded-2xl flex items-center justify-center gap-2 shadow-lg hover:brightness-110 active:scale-95 transition-all">
                     <Icon name="plus-circle" className="w-5 h-5" /> THÊM GIAO DỊCH
                   </button>
                </div>

                <div className="mt-8">
                  <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-theme-textPrimary"><Icon name="history" className="w-5 h-5" /> Giao dịch gần đây</h3>
                  <div className="space-y-3">
                    {transactions.slice(0, 8).map(tx => (
                      <div key={tx.id} className="bg-theme-surface border border-theme-border p-4 rounded-2xl flex justify-between items-center group transition-colors hover:bg-theme-variant hover:border-theme-primary/50 shadow-sm">
                        <div className="flex items-center gap-4">
                           <div className={`w-12 h-12 rounded-xl flex items-center justify-center shadow-inner ${tx.type==="INCOME"?'bg-income/20 text-incomeLight':'bg-expense/20 text-expenseLight'}`}>
                             <Icon name={getCategoryIcon(tx.category)} className="w-6 h-6" />
                           </div>
                           <div>
                             <p className="font-bold text-theme-textPrimary text-[15px]">{tx.category}</p>
                             <p className="text-xs text-theme-textSecondary mt-1 font-medium">{tx.bankName} • {new Date(tx.date).toLocaleDateString()}</p>
                           </div>
                        </div>
                        <p className={`font-bold text-base ${tx.type==="INCOME"?'text-incomeLight':'text-expenseLight'}`}>
                          {tx.type==="INCOME"?'+':'-'}{formatVND(tx.amount)}
                        </p>
                      </div>
                    ))}
                    {transactions.length === 0 && (
                      <div className="text-center p-8 bg-theme-surface/50 border border-theme-border border-dashed rounded-2xl">
                         <Icon name="inbox" className="w-8 h-8 text-theme-textSecondary mx-auto mb-2 opacity-50" />
                         <p className="text-sm text-theme-textSecondary font-medium">Chưa có giao dịch nào gần đây.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: BÁO CÁO */}
            {activeTab === "report" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <h2 className="text-2xl font-bold text-theme-textPrimary flex items-center gap-2"><Icon name="bar-chart-2" className="w-6 h-6" /> Báo cáo & Thống kê</h2>
                
                <div className="bg-theme-surface border border-theme-border p-6 rounded-3xl shadow-sm">
                  <h3 className="text-xs font-bold text-theme-textSecondary uppercase mb-4 tracking-wider">Tỷ lệ Thu / Chi</h3>

                  <div>
                    <h4 className="text-sm font-bold text-theme-textPrimary mb-2 flex items-center gap-2"><Icon name="cloud-off" className="w-4 h-4 text-theme-primary" /> Chế độ Offline</h4>
                    <p className="text-xs text-theme-textSecondary leading-relaxed">Web app hiện hoạt động ở chế độ ngoại tuyến (sử dụng Local Storage) và dùng để demo nhanh. Để đồng bộ đám mây và bảo vệ AES-256, vui lòng cài đặt ứng dụng Android qua file APK.</p>
                  </div>
                  <button onClick={()=>setShowSettingsDialog(false)} className="w-full py-4 bg-theme-primary text-theme-background font-bold rounded-xl mt-4 hover:brightness-110 transition-all shadow-lg">Lưu & Đóng</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
