    const SolidPieChart = ({ data, total }) => {
        let cumulativePercent = 0;
        const getCoordinatesForPercent = (percent) => {
            const x = Math.cos(2 * Math.PI * percent);
            const y = Math.sin(2 * Math.PI * percent);
            return [x, y];
        };
        return (
            <svg viewBox="-1 -1 2 2" className="w-32 h-32 md:w-40 md:h-40 transform -rotate-90">
                {data.length === 0 && <circle cx="0" cy="0" r="1" fill="#888" opacity="0.2" />}
                {data.length === 1 && <circle cx="0" cy="0" r="1" fill={data[0].color} />}
                {data.length > 1 && data.filter(d => d.amount > 0).map((slice, i) => {
                    const percent = slice.amount / total;
                    if (percent === 1) return <circle key={i} cx="0" cy="0" r="1" fill={slice.color} />;
                    const [startX, startY] = getCoordinatesForPercent(cumulativePercent);
                    cumulativePercent += percent;
                    const [endX, endY] = getCoordinatesForPercent(cumulativePercent);
                    const largeArcFlag = percent > 0.5 ? 1 : 0;
                    const pathData = [
                        `M ${startX} ${startY}`,
                        `A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY}`,
                        `L 0 0`,
                    ].join(' ');
                    return <path key={i} d={pathData} fill={slice.color} stroke="transparent" strokeWidth="0" />;
                })}
            </svg>
        );
    };

    const CurrencyInput = ({ id, name, defaultValue, placeholder, required, className }) => {
        const [val, setVal] = useState(() => {
            if (defaultValue === undefined || defaultValue === null || defaultValue === "") return "";
            return new Intl.NumberFormat('en-US').format(defaultValue);
        });

        const handleChange = (e) => {
            const numericStr = e.target.value.replace(/[^0-9]/g, '');
            if (!numericStr) {
                setVal('');
                return;
            }
            setVal(new Intl.NumberFormat('en-US').format(parseInt(numericStr, 10)));
        };

        return (
            <React.Fragment>
                <input type="hidden" name={name} value={val.replace(/,/g, '')} />
                <input 
                    id={id}
                    type="text" 
                    inputMode="numeric"
                    placeholder={placeholder} 
                    required={required} 
                    className={className}
                    value={val}
                    onChange={handleChange}
                />
            </React.Fragment>
        );
    };

      try {
        const item = localStorage.getItem(key);
        if (!item || item === "undefined" || item === "null") return fallback;
        const parsed = JSON.parse(item);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        console.warn(`Error parsing localStorage key: ${key}`, e);

      const seen = new Set();
      rawCats.forEach(c => {
        if (!c || !c.name) return;
        const key = c.name.trim().toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          result.push({
            ...c,
            name: c.name.trim(),
            id: c.id || `c_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
            icon: c.icon || "tag",
            color: c.color || "#4ECDC4",
            isParent: !!c.isParent,
            parent: c.isParent ? null : (c.parent || null)
          });
        }
      });
      return result;

                Authorization: `Bearer ${accessToken}`,
                'Content-Type': 'application/json; charset=UTF-8'
              },
              body: fileContent
            });

            return { success: true, fileId: existingFile.id, action: 'updated' };
          } else {
            const boundary = "-------314159265358979323846";
            const delimiter = "\r\n--" + boundary + "\r\n";
            const close_delim = "\r\n--" + boundary + "--";
            const metadata = {
              name: name,
              mimeType: 'application/json',
              description: description || 'VinaSpends Financial Data'
            };
            const multipartRequestBody =
              delimiter +
              'Content-Type: application/json; charset=UTF-8\r\n\r\n' +

              'Content-Type: application/json; charset=UTF-8\r\n\r\n' +

                Authorization: `Bearer ${accessToken}`,

              body: multipartRequestBody
            });

            return { success: true, fileId: created.id, action: 'created' };

           if (reportPeriod === "Tháng" && (d.getMonth() !== now.getMonth() || d.getFullYear() !== now.getFullYear())) return false;
           if (reportPeriod === "Năm" && d.getFullYear() !== now.getFullYear()) return false;
           if (reportPeriod === "Ngày" && d.toDateString() !== now.toDateString()) return false;
           
           return true;
        });
      }, [transactions, reportPeriod, reportAccount, reportSearch]);

      const reportSummary = React.useMemo(() => {
        let income = 0;
        let expense = 0;
        baseReportTxs.forEach(t => {
            if (t.type === "INCOME") income += t.amount;
            if (t.type === "EXPENSE") expense += t.amount;
        });
        return { income, expense, net: income - expense };
      }, [baseReportTxs]);

      const reportTxs = React.useMemo(() => {
        return baseReportTxs.filter(t => {
           if (reportType === "Chi tiêu" && t.type !== "EXPENSE") return false;
           if (reportType === "Thu nhập" && t.type !== "INCOME") return false;
           return true;
        });
      }, [baseReportTxs, reportType]);

      const reportTotal = reportTxs.reduce((sum, t) => sum + t.amount, 0);

      // Parent Category Level Breakdown
      const parentBreakdown = React.useMemo(() => {
         const groups = {};
         const counts = {};
         reportTxs.forEach(t => {
            const pName = getParentNameForCategory(t.category);
            groups[pName] = (groups[pName] || 0) + t.amount;
            counts[pName] = (counts[pName] || 0) + 1;
         });
         return Object.entries(groups).map(([category, amount]) => ({
            category,
            amount,
            txCount: counts[category] || 0,
            color: getColorForCategoryName(category),
            icon: getIconForCategoryName(category)
         })).sort((a,b) => b.amount - a.amount);
      }, [reportTxs, categoryParentMap, categories]);

      // Child / Granular Category Level Breakdown
      const childBreakdown = React.useMemo(() => {
         const groups = {};
         const counts = {};
         reportTxs.forEach(t => {
            groups[t.category] = (groups[t.category] || 0) + t.amount;
            counts[t.category] = (counts[t.category] || 0) + 1;
         });
         return Object.entries(groups).map(([category, amount]) => ({
            category,
            parent: getParentNameForCategory(category),
            amount,
            txCount: counts[category] || 0,
            color: getColorForCategoryName(category),
            icon: getIconForCategoryName(category)
         })).sort((a,b) => b.amount - a.amount);
      }, [reportTxs, categoryParentMap, categories]);

      // Drill-down Breakdown for a selected Parent Category
      const drillDownData = React.useMemo(() => {
         if (!drillDownParent) return null;
         const txs = reportTxs.filter(t => getParentNameForCategory(t.category) === drillDownParent);
         const total = txs.reduce((sum, t) => sum + t.amount, 0);
         const groups = {};
         const counts = {};
         txs.forEach(t => {
            groups[t.category] = (groups[t.category] || 0) + t.amount;
            counts[t.category] = (counts[t.category] || 0) + 1;
         });
         const breakdown = Object.entries(groups).map(([subCat, amount]) => ({
            category: subCat,
            amount,
            txCount: counts[subCat] || 0,
            color: getColorForCategoryName(subCat),
            icon: getIconForCategoryName(subCat)
         })).sort((a,b) => b.amount - a.amount);

         return {
           parentName: drillDownParent,
           parentIcon: getIconForCategoryName(drillDownParent),
           parentColor: getColorForCategoryName(drillDownParent),
           total,
           percentageOfPeriod: reportTotal > 0 ? (total / reportTotal * 100).toFixed(1) : 0,
           txs,
           breakdown
         };
      }, [drillDownParent, reportTxs, reportTotal, categoryParentMap, categories]);

      // Category selected for Add Tx (filtered)
      const filteredCategoriesForTx = React.useMemo(() => {
         if (txParentFilter === "Tất cả") {
           const subs = categories.filter(c => !c.isParent);
           // Include standalone parent categories that have no subcategories
           const standaloneParents = categories.filter(c => c.isParent && !categories.some(sub => !sub.isParent && (sub.parent === c.name || categoryParentMap[sub.name] === c.name)));
           return [...subs, ...standaloneParents];
         }

         const matchedChildren = categories.filter(c => !c.isParent && (c.parent === txParentFilter || categoryParentMap[c.name] === txParentFilter));
         const matchedParent = categories.find(c => c.name === txParentFilter);

         if (matchedChildren.length > 0) {
           if (matchedParent) {
             return [
               { id: `p_choice_${matchedParent.id}`, name: matchedParent.name, icon: matchedParent.icon, color: matchedParent.color },
               ...matchedChildren
             ];
           }
           return matchedChildren;
         }

         if (matchedParent) {
           return [{ id: matchedParent.id, name: matchedParent.name, icon: matchedParent.icon, color: matchedParent.color }];
         }

         return categories;
      }, [categories, txParentFilter, categoryParentMap]);

      const handleScanBill = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsOcrScanning(true);
        showToast("Đang phân tích ảnh giao dịch...", "info");
        try {
          if (!window.Tesseract) throw new Error("Chưa tải xong thư viện OCR");
          const result = await window.Tesseract.recognize(file, 'vie+eng', {
            logger: m => {} // Ignore logs for cleaner console
          });
          const text = result.data.text;
          
          let amount = 0;
          let type = "EXPENSE"; // Default
          let note = "";
          
          // Pattern matching
          const amountRegex = /(?:VND|đ|vnđ|\$)\s*([\d\.,]+)|([\d\.,]+)\s*(?:VND|đ|vnđ)/i;
          const matchAmount = text.match(amountRegex);
          if (matchAmount) {
             const rawStr = matchAmount[1] || matchAmount[2];
             amount = parseInt(rawStr.replace(/[^\d]/g, ''), 10);
          } else {
             const rawNums = text.match(/\b\d{1,3}(?:[.,]\d{3})+\b/g);
             if (rawNums && rawNums.length > 0) {
                // Find largest number, often amount
                const nums = rawNums.map(n => parseInt(n.replace(/[^\d]/g, ''), 10));
                amount = Math.max(...nums);
             }
          }
          
          const lowerText = text.toLowerCase();
          if (lowerText.includes("nhận tiền") || lowerText.includes("cộng") || text.includes("+") || lowerText.includes("chuyển đến") || lowerText.includes("thu nhập")) {
             type = "INCOME";
          } else if (lowerText.includes("chuyển tiền") || lowerText.includes("thanh toán") || lowerText.includes("trừ") || text.includes("-") || lowerText.includes("chuyển đi")) {
             type = "EXPENSE";
          }
          
          const lines = text.split('\n');
          for (let i = 0; i < lines.length; i++) {
             const line = lines[i].toLowerCase();
             if (line.includes("nội dung") || line.includes("lời nhắn") || line.includes("thông điệp")) {
                note = lines[i].replace(/^.*(nội dung|lời nhắn|thông điệp)[\s:]*/i, '').trim();
                if (!note && i + 1 < lines.length) note = lines[i+1].trim();
                break;
             }
          }
          
          const form = document.getElementById("addTxForm");
          if (form) {
             if (form.type) form.type.value = type;
             const radios = form.querySelectorAll('input[name="type"]');
             radios.forEach(r => r.checked = (r.value === type));

             if (form.amount) {
                form.amount.value = amount ? amount.toString() : "";
                const visibleAmountInput = document.getElementById("amountVisibleInput");
                if (visibleAmountInput) {
                   visibleAmountInput.value = amount ? new Intl.NumberFormat('en-US').format(amount) : "";
                   const tracker = visibleAmountInput._valueTracker;
                   if (tracker) tracker.setValue("");
                   visibleAmountInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
             }
             if (form.note) {
                form.note.value = note || "Quét từ ảnh chụp";
                const tracker = form.note._valueTracker;
                if (tracker) tracker.setValue("");
                form.note.dispatchEvent(new Event('input', { bubbles: true }));
             }
          }
          showToast("Đã trích xuất dữ liệu từ ảnh!", "success");
        } catch (err) {
          console.error(err);
          showToast("Lỗi phân tích: " + err.message, "error");
        } finally {
          setIsOcrScanning(false);
          if (ocrFileInputRef.current) ocrFileInputRef.current.value = "";
        }
      };

      const handleAddTx = (e) => {
        e.preventDefault();
        const tx = { id: Date.now(), type: e.target.type.value, amount: Number(e.target.amount.value) || 0, category: e.target.category.value, bankName: e.target.bankName.value, note: e.target.note.value, date: new Date().toISOString() };
        const newTx = [tx, ...transactions];
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? tx.amount : -tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
        setIsAddTxModalOpen(false);
      };

      const handleUpdateTx = (e) => {
        e.preventDefault();
        if (!editingTx) return;
        const form = e.target;
        const newType = form.type.value;
        const newAmount = Number(form.amount.value) || 0;
        const newCategory = form.category.value;
        const newBankName = form.bankName.value;
        const newNote = form.note.value;
        const newDateVal = form.date ? form.date.value : null;
        const newDate = newDateVal ? new Date(newDateVal).toISOString() : editingTx.date;

        const updatedTx = {
          ...editingTx,
          type: newType,
          amount: newAmount,
          category: newCategory,
          bankName: newBankName,
          note: newNote,
          date: newDate
        };

        // Reconcile bank balances: Revert old tx, then apply updated tx
        let newAcc = accounts.map(a => {
          let bal = a.balance;
          if (a.name === editingTx.bankName) {
            bal += (editingTx.type === "INCOME" ? -editingTx.amount : editingTx.amount);
          }
          return { ...a, balance: bal };
        });

        newAcc = newAcc.map(a => {
          let bal = a.balance;
          if (a.name === updatedTx.bankName) {
            bal += (updatedTx.type === "INCOME" ? updatedTx.amount : -updatedTx.amount);
          }
          return { ...a, balance: bal };
        });

        const newTx = transactions.map(t => t.id === editingTx.id ? updatedTx : t);
        updateData(newAcc, newTx, null, null);
        setEditingTx(null);
        showToast("Đã cập nhật giao dịch thành công!");
      };

      const handleStartEditTx = (tx) => {
        setEditingTx(tx);
        const parent = categoryParentMap[tx.category] || categories.find(c => c.name === tx.category)?.parent;
        if (parent) {
          setTxParentFilter(parent);
        } else {
          setTxParentFilter("Tất cả");
        }
      };

      const handleDeleteTx = (id) => {
        if(!confirm("Xóa giao dịch này?")) return;
        const tx = transactions.find(t => t.id === id);
        const newTx = transactions.filter(t => t.id !== id);
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? -tx.amount : tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
      };

      const handleAddDebt = (e) => {
        e.preventDefault();
        const d = { id: Date.now(), title: e.target.title.value, type: e.target.type.value, amount: Number(e.target.amount.value) || 0, note: e.target.note.value, date: new Date().toISOString(), isPaid: false };
        updateData(null, null, null, [d, ...debts]);
      };

      const handleToggleDebt = (id) => {
        updateData(null, null, null, debts.map(d => d.id === id ? {...d, isPaid: !d.isPaid} : d));
      };
      
      const handleDeleteDebt = (id) => {
        if(confirm("Xóa khoản nợ này?")) updateData(null, null, null, debts.filter(d => d.id !== id));
      };

      const handleAddCategory = (payload) => {
        let catName, catIcon, catColor, isChild, parentName;
        if (payload && payload.preventDefault) {
          payload.preventDefault();
          catName = payload.target.catName?.value?.trim() || "";
          catIcon = payload.target.catIcon?.value || "tag";
          catColor = payload.target.catColor?.value || "#4ECDC4";
          isChild = payload.target.isChildCategory ? payload.target.isChildCategory.checked : false;
          parentName = isChild ? (payload.target.parentCategorySelect?.value || newCategoryParent || parentCategories[0]?.name || "Khác") : null;
        } else if (payload && typeof payload === 'object') {
          catName = payload.name?.trim() || "";
          catIcon = payload.icon || "tag";
          catColor = payload.color || "#4ECDC4";
          isChild = !!payload.isChild;
          parentName = isChild ? (payload.parent || newCategoryParent || parentCategories[0]?.name || "Khác") : null;
        }

        if (!catName) {
          showToast("Vui lòng nhập tên hạng mục!", "error");
          return;
        }
        
        const normName = catName.toLowerCase();
        let updatedCategories;
        const newMap = { ...categoryParentMap };

        if (editingCategory) {
            const oldName = editingCategory.name;
            delete newMap[oldName];
            delete newMap[oldName.toLowerCase()];

            updatedCategories = categories.map(c => {
              if (c.id === editingCategory.id || c.name.toLowerCase() === oldName.toLowerCase()) {
                return { 
                  ...c, 
                  name: catName, 
                  icon: catIcon, 
                  color: catColor,
                  isParent: !isChild,
                  parent: isChild ? parentName : null
                };
              }
              // If editing a parent category name, update children pointing to it
              if (editingCategory.isParent && c.parent === oldName) {
                return { ...c, parent: catName };
              }
              return c;
            });

            if (editingCategory.isParent) {
              Object.keys(newMap).forEach(k => {
                if (newMap[k] === oldName) newMap[k] = catName;
              });
            }

            if (isChild && parentName) {
              newMap[catName] = parentName;
            } else {
              delete newMap[catName];
            }
            showToast(`Đã cập nhật danh mục: ${catName}`);
        } else {
            // Check if category with this name already exists
            const existingIdx = categories.findIndex(c => c.name.toLowerCase() === normName);
            const newCat = { 
              id: `c_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`, 
              name: catName, 
              icon: catIcon, 
              color: catColor,
              isParent: !isChild,
              parent: isChild ? parentName : null
            };

            if (existingIdx !== -1) {
              // Replace existing entry cleanly to avoid duplicates
              updatedCategories = categories.map((c, i) => i === existingIdx ? newCat : c);
            } else {
              updatedCategories = [...categories, newCat];
            }

            if (isChild && parentName) {
              newMap[catName] = parentName;
            } else {
              delete newMap[catName];
            }
            showToast(`Đã thêm danh mục: ${catName}`);
        }

        const sanitizedList = deduplicateCategories(updatedCategories);
        updateData(null, null, sanitizedList, null, newMap);
        setIsCategoryModalOpen(false);
        setEditingCategory(null);
        setNewCategoryParent("");
      };

      const handleDeleteCategory = (cat) => {
        if (!confirm(`Bạn có chắc muốn xóa hạng mục "${cat.name}"?`)) return;
        const normName = cat.name.trim().toLowerCase();
        
        // Filter out by ID and by normalized name to eliminate any duplicates
        const updated = categories.filter(c => c.id !== cat.id && c.name.trim().toLowerCase() !== normName);
        const newMap = { ...categoryParentMap };
        delete newMap[cat.name];
        delete newMap[normName];
        Object.keys(newMap).forEach(k => {
          if (k.toLowerCase() === normName) delete newMap[k];
        });

        // If deleting a parent category, disassociate its children
        if (cat.isParent) {
          Object.keys(newMap).forEach(k => {
            if (newMap[k] === cat.name || newMap[k]?.toLowerCase() === normName) {
              delete newMap[k];
            }
          });
        }
        updateData(null, null, updated, null, newMap);
        showToast(`Đã xóa hạng mục: ${cat.name}`);
      };

      const handleResetCategories = () => {
        if (!confirm("Khôi phục danh mục về bộ danh mục chuẩn (11 danh mục lớn, 36 danh mục chi tiêu con)? Dữ liệu giao dịch cũ vẫn được giữ nguyên.")) return;
        updateData(null, null, [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES], null, DEFAULT_CATEGORY_PARENT_MAP);
        showToast("Đã khôi phục cây danh mục chuẩn thành công!");
      };

      const handleAddBank = (e) => {
        e.preventDefault();
        const bName = bankNameType === "preset" ? e.target.bankName.value : e.target.customBankName.value;
        const acctNo = e.target.accountNo.value || "N/A";
        if (editingBank) {
            const updated = accounts.map(a => a.id === editingBank.id ? { ...a, name: bName, balance: Number(e.target.balance.value) || 0, accountNo: acctNo } : a);
            updateData(updated, null, null, null);
        } else {
            const b = { id: Date.now(), name: bName, balance: Number(e.target.balance.value) || 0, accountNo: acctNo };
            updateData([...accounts, b], null, null, null);
        }
        setIsAddBankModalOpen(false);
        setEditingBank(null);
      };

      const handleParseAI = async () => {
        if (!geminiApiKey) return alert("Vui lòng cấu hình Gemini API Key bằng nút Cài đặt ở góc phải trên cùng!");
        setIsAiProcessing(true);
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
          const prompt = `Trích xuất JSON từ nội dung này (amount:number, type:"EXPENSE"|"INCOME", category:"text", note:"text", bankName:"text"). Nội dung: ${aiInputText}`;
          const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
          const data = await res.json();
          if(data.error) throw new Error(data.error.message);
          const raw = data.candidates[0].content.parts[0].text;
          const result = JSON.parse(raw.replace(/```json/g, "").replace(/```/g, "").trim());
          
          if (confirm(`AI Phát hiện: ${formatVND(result.amount)} - ${result.type}\nLưu ngay?`)) {
             handleAddTx({ target: { type: { value: result.type }, amount: { value: result.amount }, category: { value: result.category || categories[0]?.name }, bankName: { value: accounts.find(a => a.name.includes(result.bankName))?.name || accounts[0].name }, note: { value: result.note || "AI Scan" } }, preventDefault: ()=>{} });
             setAiInputText("");
          }
        } catch(e) { alert("Lỗi AI: " + e.message); }
        setIsAiProcessing(false);
      };

      // Tab Definitions

        { id: "overview", icon: "layout-dashboard", label: "Tổng quan" },
        { id: "report", icon: "bar-chart-2", label: "Báo cáo" },

                <Icon name={syncMessage.type === 'error' ? 'alert-circle' : syncMessage.type === 'info' ? 'info' : 'check-circle-2'} className="w-5 h-5" />
                <span className="text-sm font-semibold">{syncMessage.text}</span>

                <Icon name="wallet" className="w-4 h-4 text-theme-background" />

              <button

                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs font-bold transition-all shadow-sm ${isRealtimeLive ? 'border-emerald-500 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'}`}>

              <div className="flex items-center justify-between gap-2">
                <div onClick={()=>setShowSyncDialog(true)} className="flex items-center gap-2.5 flex-1 overflow-hidden cursor-pointer">
                  <div className="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-500 group-hover:scale-105 transition-transform shrink-0">

                  <div className="flex-1 overflow-hidden">

                        <Icon name="clipboard-paste" className="w-4 h-4 text-blue-500" /> Nhập mã PIN 6 số hoặc chuỗi LZ
                      </h4>
                      <textarea 
                        value={pasteSyncCode} 
                        onChange={e => setPasteSyncCode(e.target.value)} 
                        rows={2} 
                        placeholder="Nhập mã PIN 6 số hoặc dán chuỗi LZ..." 
                        className="w-full bg-theme-surface border border-theme-border rounded-xl p-2.5 text-xs text-theme-textPrimary font-mono focus:border-theme-primary"
                      />
                      <button 
                        onClick={() => handleApplyTransferString(pasteSyncCode)}
                        disabled={!pasteSyncCode.trim()}
                        className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 transition-all disabled:opacity-40 shadow-md">
                        <Icon name="zap" className="w-4 h-4" /> Kết nối & Khôi phục dữ liệu
                      </button>
                    </div>
                  </div>
                )}

                {/* TAB 3: JSON FILE OFFLINE */}
                {syncModalTab === "json" && (
                  <div className="bg-theme-background border border-theme-border p-4 rounded-2xl space-y-3">
                    <div>
                      <h4 className="text-xs font-bold text-theme-textPrimary">Tệp sao lưu .JSON ngoại tuyến</h4>
                      <p className="text-[11px] text-theme-textSecondary mt-0.5">Tải tệp về máy tính hoặc nạp tệp từ điện thoại</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2.5 pt-2">
                      <button 
                        onClick={handleExportJson}
                        className="py-3 px-3 bg-theme-surface border border-theme-border hover:border-theme-primary rounded-xl text-xs font-bold text-theme-textPrimary flex items-center justify-center gap-2 transition-all shadow-sm">
                        <Icon name="file-down" className="w-4 h-4 text-emerald-500" /> Tải tệp .JSON
                      </button>
                      <label className="py-3 px-3 bg-theme-surface border border-theme-border hover:border-theme-primary rounded-xl text-xs font-bold text-theme-textPrimary flex items-center justify-center gap-2 cursor-pointer transition-all shadow-sm">
                        <Icon name="file-up" className="w-4 h-4 text-blue-500" /> Nạp tệp .JSON
                        <input id="hidden_drive_file_input" type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                      </label>
                    </div>
                  </div>
                )}

                {/* Close Button */}
                <button onClick={()=>setShowSyncDialog(false)} className="w-full py-3 bg-theme-variant text-theme-textPrimary font-bold rounded-2xl hover:bg-theme-border transition-all text-xs">
                  Đóng
                </button>
              </div>
            </div>
          )}

          {/* BUDGET SETUP MODAL */}
          {isBudgetModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-theme-surface w-full max-w-md rounded-3xl border border-theme-border p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-theme-primary/10 text-theme-primary flex items-center justify-center shadow-inner">
                      <Icon name="sliders" className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-theme-textPrimary">
                        {editingBudgetCat ? `Ngân sách: ${editingBudgetCat}` : "Thiết lập Ngân sách Chi tiêu"}
                      </h3>
                      <p className="text-xs text-theme-textSecondary">Tự động đồng bộ lên Google Drive</p>
                    </div>
                  </div>
                  <button onClick={() => { setIsBudgetModalOpen(false); setEditingBudgetCat(null); }} className="text-theme-textSecondary hover:text-theme-textPrimary bg-theme-background p-2 rounded-full">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                {editingBudgetCat ? (
                  /* Edit individual category budget */
                  <div className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-theme-textSecondary uppercase tracking-wider block mb-1.5">
                        Hạn mức chi tiêu tháng cho nhóm "{editingBudgetCat}" (VNĐ)
                      </label>
                      <input 
                        type="number"
                        defaultValue={categoryBudgets[editingBudgetCat] || ""}
                        id="cat_budget_input"
                        placeholder="Ví dụ: 3000000"
                        className="w-full bg-theme-background border border-theme-border rounded-xl p-3.5 text-base font-bold text-theme-textPrimary focus:border-theme-primary transition-all"
                      />
                    </div>

                    {/* Quick amount chips */}
                    <div className="flex flex-wrap gap-2">
                      {[500000, 1000000, 2000000, 3000000, 5000000, 10000000].map(amt => (
                        <button 
                          key={amt}
                          type="button"
                          onClick={() => {
                            const el = document.getElementById("cat_budget_input");
                            if (el) el.value = amt;
                          }}
                          className="text-xs bg-theme-background border border-theme-border hover:border-theme-primary text-theme-textPrimary font-semibold px-2.5 py-1.5 rounded-xl transition-all">
                          {formatVND(amt)}
                        </button>
                      ))}
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button 
                        type="button"
                        onClick={() => {
                          const val = document.getElementById("cat_budget_input")?.value || 0;
                          handleSaveCategoryBudget(editingBudgetCat, val);
                        }}
                        className="flex-1 py-3.5 bg-theme-primary text-theme-background font-bold rounded-xl text-xs hover:brightness-110 active:scale-95 transition-all shadow-md">
                        Lưu hạn mức
                      </button>
                      {categoryBudgets[editingBudgetCat] > 0 && (
                        <button 
                          type="button"
                          onClick={() => handleSaveCategoryBudget(editingBudgetCat, 0)}
                          className="px-4 py-3.5 bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 font-bold rounded-xl text-xs transition-colors">
                          Xóa hạn mức
                        </button>
                      )}
                    </div>
                  </div>
                ) : (
                  /* Edit overall monthly budget & quick jump to categories */
                  <div className="space-y-4">
                    <div className="bg-theme-background border border-theme-border p-4 rounded-2xl space-y-3">
                      <label className="text-xs font-bold text-theme-textPrimary block">
                        Tổng ngân sách chi tiêu toàn bộ hàng tháng (VNĐ)
                      </label>
                      <input 
                        type="number"
                        defaultValue={monthlyBudget || ""}
                        id="monthly_budget_input"
                        placeholder="Ví dụ: 15000000"
                        className="w-full bg-theme-surface border border-theme-border rounded-xl p-3 text-base font-bold text-theme-textPrimary focus:border-theme-primary transition-all"
                      />
                      <div className="flex flex-wrap gap-2">
                        {[5000000, 10000000, 15000000, 20000000, 30000000].map(amt => (
                          <button 
                            key={amt}
                            type="button"
                            onClick={() => {
                              const el = document.getElementById("monthly_budget_input");
                              if (el) el.value = amt;
                            }}
                            className="text-[11px] bg-theme-surface border border-theme-border hover:border-theme-primary text-theme-textPrimary font-semibold px-2 py-1 rounded-lg transition-all">
                            {formatVND(amt)}
                          </button>
                        ))}
                      </div>
                      <button 
                        type="button"
                        onClick={() => {
                          const val = document.getElementById("monthly_budget_input")?.value || 0;
                          handleSaveMonthlyBudget(val);
                          setIsBudgetModalOpen(false);
                        }}
                        className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-emerald-500/20">
                        Cập nhật Ngân sách Tổng
                      </button>
                    </div>

                    {/* Category list selector */}
                    <div className="space-y-2">
                      <span className="text-[11px] font-bold text-theme-textSecondary uppercase tracking-wider block">
                        Hoặc chọn Danh mục để đặt hạn mức riêng:
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-[180px] overflow-y-auto no-scrollbar">
                        {parentCategories.map(p => (
                          <button 
                            key={p.id}
                            type="button"
                            onClick={() => setEditingBudgetCat(p.name)}
                            className="p-2.5 bg-theme-background border border-theme-border hover:border-theme-primary rounded-xl text-left flex items-center justify-between group transition-all">
                            <div className="flex items-center gap-2 truncate">
                              <Icon name={p.icon} className="w-3.5 h-3.5" style={{ color: p.color }} />
                              <span className="text-xs font-bold text-theme-textPrimary truncate">{p.name}</span>
                            </div>
                            <span className="text-[10px] text-theme-primary font-bold opacity-0 group-hover:opacity-100 transition-opacity">Đặt</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ACCOUNT CHOOSER & SWITCHER MODAL */}
          {showAccountModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-theme-surface w-full max-w-md rounded-3xl border border-theme-border p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-white p-2 flex items-center justify-center shadow-sm border border-gray-200">
                      <svg className="w-full h-full" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                      </svg>
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-theme-textPrimary">Chọn Tài Khoản Gmail</h3>
                      <p className="text-xs text-theme-textSecondary">Đồng bộ dữ liệu thời gian thực giữa các thiết bị</p>
                    </div>
                  </div>
                  <button onClick={()=>setShowAccountModal(false)} className="text-theme-textSecondary hover:text-theme-textPrimary bg-theme-background p-2 rounded-full"><Icon name="x" className="w-4 h-4" /></button>
                </div>

                {/* Option 1: Official Google OAuth Account Picker */}
                <div className="bg-theme-background border border-theme-border p-4 rounded-2xl space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold text-theme-textSecondary uppercase tracking-wider">Cách 1: Chọn tài khoản Google</span>
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold px-2 py-0.5 rounded-md">Khuyên dùng</span>
                  </div>
                  <p className="text-xs text-theme-textSecondary leading-relaxed">
                    Mở popup của Google để chọn bất kỳ tài khoản Gmail nào bạn đã đăng nhập trên trình duyệt.
                  </p>
                  <button 
                    onClick={handleGoogleOAuthLogin} 
                    className="w-full py-3.5 bg-white text-gray-800 hover:bg-gray-50 border border-gray-300 font-bold rounded-2xl flex items-center justify-center gap-3 transition-all active:scale-95 shadow-sm text-sm">
                    <svg className="w-5 h-5" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Mở danh sách tài khoản Google</span>
                  </button>
                </div>

                {/* Option 2: Direct Gmail Input */}
                <div className="bg-theme-background border border-theme-border p-4 rounded-2xl space-y-3">
                  <span className="text-[11px] font-bold text-theme-textSecondary uppercase tracking-wider block">Cách 2: Nhập trực tiếp địa chỉ Gmail</span>
                  <form onSubmit={(e) => { e.preventDefault(); handleManualEmailLogin(); }} className="space-y-2">
                    <div className="flex gap-2">
                      <div className="relative flex-1">
                        <Icon name="mail" className="w-4 h-4 text-theme-textSecondary absolute left-3.5 top-1/2 -translate-y-1/2" />
                        <input 
                          type="email" 
                          value={customEmailInput} 
                          onChange={(e)=>setCustomEmailInput(e.target.value)} 
                          placeholder="Nhập email, ví dụ: name@gmail.com" 
                          className="w-full bg-theme-surface border border-theme-border rounded-xl pl-10 pr-3 py-3 text-xs text-theme-textPrimary focus:border-theme-primary focus:ring-1 focus:ring-theme-primary transition-all font-medium"
                        />
                      </div>
                      <button 
                        type="submit" 
                        disabled={!customEmailInput.trim()}
                        className="px-4 bg-theme-primary text-theme-background font-bold text-xs rounded-xl hover:brightness-110 active:scale-95 transition-all shadow-md disabled:opacity-40 shrink-0 flex items-center gap-1.5">
                        <Icon name="check" className="w-3.5 h-3.5" />
                        <span>Chọn</span>
                      </button>
                    </div>
                  </form>
                </div>

                {/* Option 3: Recent Accounts */}
                {recentAccounts && recentAccounts.length > 0 && (
                  <div className="space-y-2">
                    <span className="text-[11px] font-bold text-theme-textSecondary uppercase tracking-wider block">Tài khoản đã dùng gần đây:</span>
                    <div className="space-y-1.5 max-h-[160px] overflow-y-auto no-scrollbar">
                      {recentAccounts.map(accEmail => {
                        const isCurrent = googleUser?.email?.toLowerCase() === accEmail.toLowerCase();
                        return (
                          <div 
                            key={accEmail} 
                            onClick={() => handleManualEmailLogin(accEmail)}
                            className={`p-3 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${isCurrent ? 'bg-theme-primary/10 border-theme-primary ring-1 ring-theme-primary/30' : 'bg-theme-background border-theme-border hover:bg-theme-surface hover:border-theme-primary/50'}`}>
                            <div className="flex items-center gap-2.5 overflow-hidden">
                              <div className={`w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs uppercase ${isCurrent ? 'bg-theme-primary text-theme-background' : 'bg-white/10 text-theme-textPrimary'}`}>
                                {accEmail.charAt(0)}
                              </div>
                              <div className="overflow-hidden">
                                <p className="text-xs font-bold text-theme-textPrimary truncate">{accEmail}</p>
                                {isCurrent && <span className="text-[10px] text-emerald-500 font-bold flex items-center gap-1">● Đang hoạt động</span>}
                              </div>
                            </div>
                            <div className="flex items-center gap-1.5">
                              {!isCurrent && (
                                <button 
                                  type="button" 
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    const updated = recentAccounts.filter(a => a !== accEmail);
                                    setRecentAccounts(updated);
                                    localStorage.setItem("vina_recent_accounts", JSON.stringify(updated));
                                  }}
                                  className="p-1.5 text-theme-textSecondary hover:text-rose-500 rounded-lg">
                                  <Icon name="x" className="w-3.5 h-3.5" />
                                </button>
                              )}
                              <span className="text-xs text-theme-primary font-bold">{isCurrent ? "" : "Chuyển"}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                <button 
                  type="button" 
                  onClick={()=>setShowAccountModal(false)} 
                  className="w-full py-3 bg-theme-surface border border-theme-border text-theme-textSecondary hover:text-theme-textPrimary font-bold rounded-2xl text-xs transition-colors">
                  Đóng
                </button>
              </div>
            </div>
          )}

          {/* SETTINGS (GEMINI API) DIALOG */}
          {showSettingsDialog && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-theme-surface w-full max-w-sm rounded-3xl border border-theme-border p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-5">
                  <h3 className="text-lg font-bold text-theme-textPrimary flex items-center gap-2"><Icon name="settings" className="w-5 h-5 text-theme-primary" /> Cấu hình Hệ thống</h3>
                  <button onClick={()=>setShowSettingsDialog(false)} className="text-theme-textSecondary hover:text-theme-textPrimary bg-theme-background p-2 rounded-full"><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div className="space-y-5">
                  <div>
                    <h4 className="text-sm font-bold text-theme-textPrimary mb-2 flex items-center gap-2"><Icon name="cloud" className="w-4 h-4 text-theme-primary" /> Đồng bộ & Sao lưu</h4>
                    <p className="text-xs text-theme-textSecondary mb-3">Sao lưu dữ liệu tài chính lên Google Drive và quản lý tệp khôi phục an toàn.</p>
                    <button onClick={()=>{ setShowSettingsDialog(false); setShowSyncDialog(true); }} className="w-full py-3 bg-theme-background border border-theme-primary/40 text-theme-primary font-bold rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-theme-primary/10 transition-all">
                      <Icon name="cloud" className="w-4 h-4" /> Mở trung tâm Đồng bộ Drive
                    </button>
                  </div>
                  <hr className="border-theme-border" />
                  <div>
                    <h4 className="text-sm font-bold text-theme-textPrimary mb-2 flex items-center gap-2"><Icon name="cpu" className="w-4 h-4 text-theme-primary" /> Gemini API Key</h4>
                    <p className="text-xs text-theme-textSecondary mb-3">Sử dụng để phân tích tin nhắn và hình ảnh tự động. Cấu hình sẽ được lưu cục bộ trên trình duyệt.</p>
                    <input type="password" placeholder="AIzaSy..." value={geminiApiKey} onChange={e=>setGeminiApiKey(e.target.value)} className="w-full bg-theme-background border border-theme-border rounded-xl p-3.5 text-sm text-theme-textPrimary focus:border-theme-primary transition-all shadow-inner" />
                  </div>
                  <button onClick={()=>setShowSettingsDialog(false)} className="w-full py-4 bg-theme-primary text-theme-background font-bold rounded-xl mt-4 hover:brightness-110 transition-all shadow-lg">Lưu & Đóng</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("VinaSpends Error Caught:", error, errorInfo);
      }
      handleReset() {
        localStorage.removeItem("vina_theme");
        localStorage.removeItem("vina_category_parent_map");
        window.location.reload();
      }
      handleFullReset() {
        if (confirm("Thao tác này sẽ xoá cấu hình lỗi cục bộ và tải lại ứng dụng. Bạn có chắc không?")) {
          localStorage.clear();
          window.location.reload();
        }
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-50 text-slate-800 flex items-center justify-center p-6 font-sans">
              <div className="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-200 text-center space-y-4">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
                <h2 className="text-xl font-bold text-slate-900">Khôi phục Ứng dụng VinaSpends</h2>
                <p className="text-xs text-slate-500">
                  Đã xảy ra sự cố khi tải giao diện. Nhấn nút bên dưới để đặt lại giao diện sáng và tiếp tục sử dụng:
                </p>
                {this.state.error && (
                  <div className="p-3 bg-red-50 text-red-700 text-[11px] rounded-xl text-left font-mono break-all max-h-24 overflow-y-auto">
                    {this.state.error.toString()}
                  </div>
                )}
                <div className="space-y-2 pt-2">
                  <button 
                    onClick={() => this.handleReset()} 
                    className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl text-sm shadow-md hover:bg-emerald-700 active:scale-95 transition-all">
                    Đặt lại Giao diện & Tải lại
                  </button>
                  <button 
                    onClick={() => window.location.reload()} 
                    className="w-full py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-xl text-xs hover:bg-slate-200">
                    Thử tải lại ngay
                  </button>
                  <button 
                    onClick={() => this.handleFullReset()} 
                    className="w-full py-2 text-slate-400 hover:text-red-500 text-[11px] font-medium transition-colors">
                    Khôi phục dữ liệu gốc nếu bị xung đột
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
