            <p className="tv-lbl" style={{ color: PH.butter }}>Tài sản ròng</p>
            <p className="tv-big crt-glow tabular mt-1" style={{ color: "var(--crt-big)", fontSize: Math.min(44, Math.floor(420 / Math.max(8, nwStr.length))) }}><CountUp value={netWorth} format={formatVND} from0 /></p>
            <div className="mt-2.5 space-y-0.5" style={{ color: PH.cream }}>
              <div className="tv-row"><span>+ Trong {accounts.filter(a => !isCreditAcc(a)).length} ví</span><span className="tabular">{formatVND(totalCash)}</span></div>
              {totalDebtLent > 0 && <div className="tv-row"><span>+ Cho vay</span><span className="tabular">{formatVND(totalDebtLent)}</span></div>}
              {totalCardDebt > 0 && <div className="tv-row" style={{ color: PH.pink }}><span>− Nợ thẻ tín dụng</span><span className="tabular">{formatVND(totalCardDebt)}</span></div>}
              {totalDebtBorrowed > 0 && <div className="tv-row" style={{ color: PH.pink }}><span>− Đi vay</span><span className="tabular">{formatVND(totalDebtBorrowed)}</span></div>}
            </div>
          </div>
        ) },
        { id: "month", title: `THÁNG ${monthNo}`, onOpen: () => setActiveTab("report"), render: () => {
          const max = Math.max(1, ...monthDaily);
          return (
            <div className="flex-1 flex flex-col min-w-0">
              <div className="space-y-0.5">
                {[["Thu", monthStats.inc, PH.mint], ["Chi", monthStats.exp, PH.pink], ["Còn", monthStats.net, PH.butter]].map(([l, v, c]) => (
                  <div key={l} className="flex items-baseline justify-between gap-2">
                    <span className="tv-lbl" style={{ color: c }}>{l}</span>
                    <span className="crt-glow tabular whitespace-nowrap font-display text-[24px] leading-none" style={{ color: c }}><CountUp value={v} format={formatVND} /></span>
                  </div>
                ))}
              </div>
              <div className="mt-auto">
                <div className="tv-bars" aria-label="Chi tiêu từng ngày trong tháng">
                  {monthDaily.map((v, i) => {
                    const future = i + 1 > monthStats.dayOfMonth;
                    return <i key={i} className={`${i + 1 === monthStats.dayOfMonth ? "today" : ""} ${v === 0 ? "zero" : ""}`} style={{ height: v > 0 ? `${Math.max(8, v / max * 100)}%` : "6%", opacity: future ? 0.35 : 1, animationDelay: `${i * 14}ms` }} />;
                  })}
                </div>
                <div className="flex justify-between tv-lbl mt-1" style={{ color: "rgba(255,242,226,.7)" }}><span>01</span><span>chi tiêu từng ngày</span><span>{monthStats.daysInMonth}</span></div>
              </div>
            </div>
          );
        } },
        { id: "budget", title: "NGÂN SÁCH", onOpen: openBudget, render: () => {
          if (!(monthlyBudget > 0)) return (
            <div className="flex-1 flex flex-col items-center justify-center text-center gap-1">
              <span className="w-11 h-11 px-anim-float" dangerouslySetInnerHTML={{ __html: window.VinaIcons ? window.VinaIcons.svg("piggy") : "" }} />
              <p className="tv-mid crt-glow" style={{ color: PH.butter }}>CHƯA ĐẶT NGÂN SÁCH</p>
              <p className="text-[15px] font-semibold leading-tight" style={{ color: "rgba(255,242,226,.8)" }}>Chạm màn hình để đặt hạn mức chi tiêu tháng này</p>
            </div>
          );
          const rem = monthlyBudget - monthStats.exp, daysLeft = Math.max(1, monthStats.daysInMonth - monthStats.dayOfMonth + 1);
          const col = budgetPace === "over" ? PH.pink : budgetPace === "warn" ? PH.butter : PH.mint;
          const cells = Math.min(14, Math.round(Math.min(100, budgetPct) / 100 * 14));
          return (
            <div className="flex-1 flex flex-col justify-center min-w-0">
              <div className="flex items-end justify-between gap-2">
                <div>
                  <p className="tv-lbl" style={{ color: col }}>Đã dùng</p>
                  <p className="tv-big crt-glow tabular" style={{ color: col }}><CountUp value={budgetPct} format={(v) => `${v}%`} from0 /></p>
                </div>
                <div className="text-right">
                  <p className="tv-lbl">Hạn mức</p>
                  <p className="tv-mid tabular" style={{ color: "var(--crt-text)" }}>{formatShortVND(monthlyBudget)}</p>
                </div>
              </div>
              <div className="tv-hp mt-2">{Array.from({ length: 14 }, (_, i) => <i key={i} className={i < cells ? "on" : ""} style={i < cells ? { background: col, boxShadow: `0 0 6px ${col}`, animationDelay: `${i * 40}ms` } : undefined} />)}</div>
              <div className="mt-2 space-y-0.5" style={{ color: PH.cream }}>
                <div className="tv-row"><span>{rem >= 0 ? "Còn lại" : "Đã vượt"}</span><span className="tabular" style={rem < 0 ? { color: PH.pink } : undefined}>{formatVND(Math.abs(rem))}</span></div>
                {rem > 0 && <div className="tv-row"><span>Mỗi ngày tiêu được ~</span><span className="tabular">{formatShortVND(Math.floor(rem / daysLeft))}</span></div>}
              </div>
            </div>
          );
        } },
        { id: "wallets", title: `VÍ & THẺ (${accounts.length})`, onOpen: goWallets, render: () => {
          const rows = [...accounts].sort((x, y) => (isCreditAcc(y) ? -1e15 : (Number(y.balance) || 0)) - (isCreditAcc(x) ? -1e15 : (Number(x.balance) || 0)));
          if (!rows.length) return <p className="m-auto tv-mid crt-glow" style={{ color: PH.butter }}>CHƯA CÓ VÍ</p>;
          return (
            <TvScroll count={rows.length}>
              <div className="flex flex-col gap-1.5 py-0.5 pr-2.5">
                {rows.map(a => {
                  const credit = isCreditAcc(a), bal = Number(a.balance) || 0;
                  return (
                    <div key={a.id} className="flex items-center gap-2 min-w-0 min-h-[26px]">
                      <BankBadge name={a.name} size={18} />
                      <span className="flex-1 min-w-0 truncate text-[16px] font-semibold" style={{ color: PH.cream }}>{a.name}</span>
                      <span className="font-display text-[22px] leading-none tabular crt-glow" style={{ color: credit || bal < 0 ? PH.pink : PH.mint }}>{credit ? "−" + formatShortVND(Math.max(0, -bal)) : formatShortVND(bal)}</span>
                    </div>
                  );
                })}
              </div>
            </TvScroll>
          );
        } }
      ];
      const tvKeys = [
        { id: "exp", label: "Chi", aria: "Ghi khoản chi", icon: "btn-expense", color: "#FFB3BE", onClick: () => openAddTx("EXPENSE") },
        { id: "inc", label: "Thu", aria: "Ghi khoản thu", icon: "btn-income", color: "#A8E6BF", onClick: () => openAddTx("INCOME") },
        voiceAvailable ? { id: "voice", label: voice.state === "listening" ? "Dừng" : "Nói", aria: "Nói với Mai", icon: "btn-mic", color: "#D4BDF1", led: voice.state === "listening" ? "on" : "", onClick: () => (voice.state === "listening" ? voiceStop() : voiceListen("command")) } : null,
        { id: "scan", label: "Quét", aria: "Quét hoá đơn", icon: "btn-scan", color: "#A9D5F5", onClick: () => openAddTx("EXPENSE", true) },
        { id: "budget", label: "Hạn mức", small: true, aria: "Ngân sách tháng", icon: "btn-budget", color: "#FFE08A", led: budgetPace ? "warn" : monthlyBudget > 0 ? "on" : "", onClick: openBudget }
      ].filter(Boolean);

      // Móc kiểm thử giao diện (chỉ bật khi mở với ?shot=1)
      useEffect(() => {
        if (!/[?&]shot=1/.test(window.location.search)) return;
        window.__vinaNav = (t) => setActiveTab(t);
        window.__vinaTv = (c) => setTvChannel(c);
        window.__vinaOpen = (w) => {
          if (w === "addTx") openAddTx("EXPENSE");
          else if (w === "settings") setShowSettingsDialog(true);
          else if (w === "budget") setIsBudgetModalOpen(true);
          else { setIsAddTxModalOpen(false); setShowSettingsDialog(false); setIsBudgetModalOpen(false); }
        };
      });

      return (
        <div className="flex flex-col h-screen md:flex-row font-sans relative isolate">
          {window.PixelKit ? <PixelSky /> : <SkyLayer />}

          {/* FLOATING EDGE-SWIPE BACK PILL */}
          <div
            ref={swipePillRef}
            className="fixed top-1/2 z-[95] pointer-events-none opacity-0 transition-opacity duration-75 font-pixel text-xs px-3 py-1.5 rounded-lg border-2 border-[var(--ink)] shadow-[inset_0_-3px_0_rgba(74,51,80,.22)]"
            style={{ transform: "translateY(-50%) scale(0.8)" }}
          />

          {/* TOAST NOTIFICATION */}
          {syncMessage && (
            <div key={syncMessage.text} className="fixed left-1/2 z-[60] toast-in w-[calc(100%-32px)] max-w-md" style={{ top: "calc(var(--safe-top) + 12px)" }} role="status">
              <div className={`relative overflow-hidden px-4 py-3 rounded-xl flex items-center gap-3 border-[3px] border-[var(--ink)] shadow-[inset_0_-4px_0_rgba(74,51,80,.18)] ${syncMessage.type === 'error' ? 'bg-[var(--expense-light)] text-[var(--expense)]' : syncMessage.type === 'info' ? 'bg-[var(--accent)] text-[var(--on-accent)]' : 'bg-[var(--income-light)] text-[var(--income)]'}`}>
                <Icon name={syncMessage.type === 'error' ? 'alert-circle' : syncMessage.type === 'info' ? 'info' : 'check-circle-2'} anim={syncMessage.type === 'error' ? 'wiggle' : 'hop'} className="w-6 h-6" />
                <span className="text-[17px] font-bold leading-snug">{syncMessage.text}</span>
                <span className="toast-bar" />
              </div>
            </div>
          )}

          {/* HUD MOBILE – thanh tài nguyên kiểu game */}
          <header className="md:hidden hud-wrap pt-safe relative z-20 shrink-0">
            <div className="px-3 pt-2.5 pb-1.5 flex gap-2 items-start">
              <div className="flex-1 min-w-0 space-y-2">
                <div className="hud">
                  <button type="button" className="hud-cell flex-1 min-w-0" onClick={() => { buzz(); goWallets(); }} aria-label={`Tài sản ròng ${formatVND(netWorth)} – xem ví`}>
                    <Icon name="btn-balance" className="w-6 h-6 shrink-0" />
                    <span className="hud-num truncate tabular"><CountUp value={netWorth} format={formatShortVND} /></span>
                    <span role="button" tabIndex={0} aria-label="Ghi giao dịch" className="hud-plus ml-auto" onClick={(e) => { e.stopPropagation(); buzz(); openAddTx("EXPENSE"); }}><Icon name="btn-plus" className="w-3 h-3" /></span>
                  </button>
                  <button type="button" className="hud-cell relative shrink-0" onClick={() => { buzz(); setActiveTab("mai"); }} aria-label={`Tự động – ${maiBadge} khoản chờ duyệt`}>
                    <Icon name="btn-auto" anim={maiBadge > 0 ? "float" : ""} className="w-6 h-6" />
                    <span className="hud-num tabular">{maiBadge}</span>
                  </button>
                  <button type="button" className="hud-cell hud-cell-light shrink-0" onClick={() => setShowSettingsDialog(true)} aria-label="Đồng bộ dữ liệu">
                    <Icon name={isSyncing ? "btn-refresh" : googleUser ? "btn-cloud" : "btn-local"} anim={isSyncing ? "spin" : ""} className="w-5 h-5" />
                    <span className="font-pixel text-[14px]">{googleUser ? (isRealtimeLive ? "LIVE" : "CLOUD") : "LOCAL"}</span>
                  </button>
                </div>
                <button type="button" className="hud-sub w-full" onClick={() => { buzz(); openBudget(); }} aria-label={monthlyBudget > 0 ? `Ngân sách tháng đã dùng ${budgetPct}%` : "Đặt ngân sách tháng"}>
                  <span className="lvl-tag">T{monthNo} · LV{rpgLevel}</span>
                  <span className={`xp-bar ${budgetPace}`}><i style={{ width: monthlyBudget > 0 ? `calc(${Math.min(100, Math.max(4, budgetPct))}% - 4px)` : "0%" }} /></span>
                  <span className={`text-[var(--on-hud)] w-[50px] text-right shrink-0 [text-shadow:1px_1px_0_rgba(0,0,0,.3)] ${monthlyBudget > 0 ? "font-display text-[24px] leading-none" : "font-pixel text-[14px]"}`}>{monthlyBudget > 0 ? `${budgetPct}%` : "ĐẶT N.S"}</span>
                </button>
              </div>
              <div className="flex flex-col gap-2 shrink-0">
                <button type="button" onClick={() => { buzz(); setShowSettingsDialog(true); }} aria-label="Cài đặt" className="hud-btn"><Icon name="btn-settings" className="w-6 h-6" /></button>
                <button type="button" onClick={() => { buzz(); setActiveTab("category"); }} aria-label="Hạng mục" className={`hud-btn ${activeTab === "category" ? "!bg-[var(--accent)]" : ""}`}><Icon name="btn-tag" className="w-6 h-6" /></button>
              </div>
            </div>
          </header>

          {/* SIDEBAR DESKTOP (Game Console Side Frame) */}
          <aside className="hidden md:flex w-64 bg-theme-surface border-r-[3px] border-[var(--ink)] flex-col p-4 z-10 relative overflow-hidden">
             <div className="absolute left-0 top-0 bottom-0 w-1.5 retro-stripes" />
             <div className="flex items-center justify-between mb-4 px-1.5">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-lg bg-[var(--accent)] border-2 border-[var(--ink)] flex items-center justify-center shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] text-[var(--on-accent,#4A2B18)]">
                    <Icon name="btn-auto" anim="float" className="w-6 h-6" />
                  </div>
                  <div>
                    <h1 className="font-display font-bold text-3xl text-theme-textPrimary leading-none">Spendy</h1>
                    <span className="font-pixel text-[13px] text-theme-textSecondary">P1 · LV.{rpgLevel} · {transactions.length} TX</span>
                  </div>
                </div>
                <button onClick={()=>setShowSettingsDialog(true)} aria-label="Cài đặt" className="game-btn-sm game-btn-neutral w-8 h-8 bg-theme-background flex items-center justify-center text-theme-textPrimary">
                  <Icon name="btn-settings" className="w-4 h-4" />
                </button>
            </div>

            {canGoBackUI && (
              <button
                type="button"
                onClick={handleBack}
                className="game-btn-sm bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] w-full py-2 px-3 mb-3 text-xs font-bold flex items-center justify-center gap-1.5">
                <span className="console-key">◄</span> Quay lại màn trước
              </button>
            )}

            <button onClick={()=>setShowSettingsDialog(true)} className="console-lcd mb-4 p-2.5 bg-theme-background text-left flex items-center gap-2.5 hover:bg-theme-variant transition-colors">
              <div className={`w-8 h-8 rounded-lg border-2 border-[var(--ink)] flex items-center justify-center shrink-0 ${googleUser ? 'bg-[var(--income-light)] text-[var(--income)]' : 'bg-theme-surface text-theme-primary'}`}>
                <Icon name={googleUser ? (isRealtimeLive ? "zap" : "cloud") : "cloud-off"} anim={isSyncing ? "spin" : ""} className="w-4 h-4" />
              </div>
              <div className="flex-1 overflow-hidden">
                <p className="text-xs font-bold text-theme-textPrimary truncate">{googleUser?.email?.split('@')[0] || "Chưa đăng nhập"}</p>
                <p className="text-[13px] font-semibold text-theme-textSecondary truncate">{googleUser ? (isRealtimeLive ? 'Đang đồng bộ Cloud' : (lastSyncTime ? `Lưu lúc ${lastSyncTime.split(' ')[1] || ''}` : 'Tự động sao lưu')) : 'Bấm đăng nhập Google'}</p>
              </div>
            </button>

            <nav className="flex-1 space-y-2">
              {TABS.map(t => {
                const active = activeTab === t.id;
                return (
                  <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-bold border-2 transition-all ${active ? 'bg-theme-primary text-[var(--on-primary)] border-[var(--ink)] shadow-[inset_0_-3px_0_rgba(74,51,80,.22)]' : 'border-transparent text-theme-textSecondary hover:bg-theme-variant hover:text-theme-textPrimary'}`}>
                    {t.id === "mai" ? <MaiAvatar size={22} animated={active || maiBadge > 0} /> : <Icon name={t.icon} anim={active ? "hop" : ""} className="w-5 h-5" />}
                    <span className="flex-1 text-left">{t.label}</span>
                    {t.id === "mai" && maiBadge > 0 && <span className="font-pixel min-w-[20px] h-5 px-1.5 rounded bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] border border-[var(--ink)] text-[14px] font-bold flex items-center justify-center">{maiBadge}</span>}
                  </button>
                );
              })}
            </nav>
            <button type="button" onClick={() => { buzz(); openAddTx("EXPENSE"); }} className="game-btn w-full py-3 mt-4 bg-[var(--accent)] text-[var(--on-accent)] font-bold flex items-center justify-center gap-2">
              <Icon name="btn-plus" className="w-5 h-5" /> Ghi giao dịch
            </button>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main ref={mainScrollRef} className="flex-1 overflow-y-auto overflow-x-hidden no-scrollbar px-4 pt-4 pb-44 md:p-8 bg-theme-background relative" style={{ "--dx": `${tabDirRef.current.dx}px` }}>

            {/* TAB: MÀN HÌNH CHÍNH – 1 màn hình CRT liền mạch */}
            {activeTab === "overview" && (
              <RetroTV ch={tvChannel} onChange={setTvChannel} channels={tvChannels} keys={tvKeys}>
                {/* Nhắc quyền đọc thông báo trên Android */}
                {canListen && !maiAccess && (
                  <button onClick={() => { try { window.MaiBridge.openNotificationAccessSettings(); } catch(e) {} }} className="retro-card w-full text-left p-3.5 flex items-center gap-3 text-[#FFE08A]">
                    <MaiAvatar size={42} animated />
                    <div className="flex-1">
                      <p className="font-bold text-[17px] text-[#FFE08A]">Cho phép đọc thông báo ngân hàng</p>
                      <p className="text-xs font-semibold mt-0.5 text-[#C8B6DE]">Bật 1 lần, Gemini tự phân tích và ghi mọi biến động số dư.</p>
                    </div>
                    <Icon name="btn-next" anim="wiggle" className="w-5 h-5 shrink-0" />
                  </button>
                )}

                {/* NHẬT KÝ GẦN ĐÂY – nằm liền mạch trong cùng màn hình CRT tối */}
                <section className="space-y-2.5">
                  <div className="flex items-center justify-between gap-2 px-1">
                    <span className="flex items-center gap-2 min-w-0">
                      <span className="w-2.5 h-2.5 bg-[#7DFFB0] px-led shrink-0" style={{ boxShadow: "0 0 6px #7DFFB0" }} />
                      <span className="osd text-[16px] tracking-wider uppercase truncate">Nhật ký gần đây</span>
                    </span>
                    <button type="button" onClick={() => { buzz(); setActiveTab("report"); }} className="font-pixel text-[15px] text-[#FFE08A] crt-glow flex items-center gap-1 shrink-0">TẤT CẢ <Icon name="btn-next" className="w-3.5 h-3.5" /></button>
                  </div>
                  {recentGroups.length === 0 ? (
                    <div className="console-lcd text-center px-6 py-8">
                      <span className="block w-16 h-16 mx-auto mb-3"><Icon name="btn-journal" anim="float" className="w-16 h-16" /></span>
                      <p className="font-display text-[30px] leading-none text-theme-textPrimary">Sổ còn trống</p>
                      <p className="text-sm text-theme-textSecondary mt-2">Bấm nút <b>GHI</b> vàng bên dưới, hoặc để Mai tự ghi từ thông báo ngân hàng.</p>
                    </div>
                  ) : (
                    <div className="space-y-2.5 stagger">
                      {recentGroups.map(g => (
                        <div key={g.key} className="day-card">
                          <div className="panel-head">
                            <span className="truncate">{g.label}</span>
                            <span className={`font-display text-[20px] leading-none normal-case tracking-normal px-2 py-0.5 bg-[#140D20]/80 border border-[#5E4A84] crt-glow ${g.net >= 0 ? 'text-[var(--income)]' : 'text-[var(--expense)]'}`}>{g.net >= 0 ? '+' : '−'}{formatVND(Math.abs(g.net))}</span>
                          </div>
                          <div className="divide-y-2 divide-dashed divide-theme-border/45">
                            {g.items.map(tx => {
                              const col = getColorForCategoryName(tx.category);
                              const tint = /^#[0-9a-f]{6}$/i.test(String(col || "")) ? `${col}35` : "rgba(255,242,226,.09)";
                              return (
                                <div key={tx.id} role="button" tabIndex={0} onClick={() => handleStartEditTx(tx)} onKeyDown={(e) => { if (e.key === "Enter") handleStartEditTx(tx); }} className="tx-row px-3 py-2.5 flex items-center gap-3 cursor-pointer">
                                  <div className="tx-ico" style={{ background: tint }}>
                                    <Icon name={getIconForCategoryName(tx.category) || getCategoryIcon(tx.category)} className="w-7 h-7" />
                                  </div>
                                  <div className="flex-1 min-w-0">
                                    <p className="font-bold text-theme-textPrimary text-[17px] truncate flex items-center gap-1.5">
                                      <span className="truncate">{tx.category}</span>
                                      {tx.source === "mai" && <span title="Mai tự ghi" className="inline-flex shrink-0"><MaiAvatar size={16} /></span>}
                                    </p>
                                    <p className="text-xs text-theme-textSecondary truncate">{tx.note ? `${tx.note} · ` : ""}{txBankLabel(accounts, tx)} · {new Date(tx.date).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}</p>
                                  </div>
                                  <p className={`font-display text-[22px] leading-none tabular shrink-0 crt-glow ${tx.type==="INCOME" ? 'text-[var(--income)]' : 'text-[var(--expense)]'}`}>
                                    {tx.type==="INCOME" ? '+' : '−'}{formatVND(tx.amount)}
                                  </p>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>
              </RetroTV>
            )}

            {/* TAB: BÁO CÁO */}
            {activeTab === "report" && (
              <CrtSectionScreen chCode="CH02" color="tvTeal" brand="BÁO CÁO" title="BÁO CÁO · THỐNG KÊ" badge={reportPeriod === "Ngày" ? "TÙY CHỌN" : reportPeriod.toUpperCase()}>
                <section className="console-bezel">
                  <div className="p-3 space-y-3">
                    {/* Chi tiêu / Thu nhập */}
                    <div className="grid grid-cols-2 gap-2">
                      {[["Chi tiêu", "arrow-up-right", "var(--expense)", "var(--on-expense)"], ["Thu nhập", "arrow-down-left", "var(--income)", "var(--on-income)"]].map(([t, ic, bg, fg]) => {
                        const on = reportType === t;
                        return (
                          <button key={t} type="button" onClick={() => { buzz(); setReportType(t); setDrillDownParent(null); }}
                            className={`ekey !min-h-0 !flex-row !gap-2 py-2.5 ${on ? "is-down" : ""}`} style={{ "--c": on ? bg : "rgb(var(--variant-rgb))", "--t": on ? fg : "var(--text-secondary)" }}>

                            <div className="flex flex-col min-w-0">

                <button onClick={() => { setAssistInput(""); lockFinish(0); }} className="console-key">ESC</button>
              </div>
              <div className="fixed top-8 inset-x-0 h-1.5 retro-stripes-h" />
              <button onClick={() => {
                  if (voice.state === "thinking") return;
                  if (voice.state === "listening") { voiceStop(); return; }
                  setAssistInput("");
                  if (window.onMaiAssist) window.onMaiAssist({}); else voiceListen("command");
                }}
                aria-label="Nói với Mai"
                className={`w-28 h-28 rounded-2xl border-[3px] border-[var(--ink)] flex items-center justify-center shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] transition-transform active:translate-x-[2px] active:translate-y-[2px] ${voice.state === "listening" ? "bg-[var(--expense)] text-[var(--on-expense)] mai-pulse" : voice.state === "done" ? "bg-[var(--income)] text-[var(--on-income)]" : "bg-[var(--accent)] text-[var(--on-accent,#4A2B18)]"}`}>
                {voice.state === "thinking" ? <span className="mai-typing inline-flex gap-2 scale-150"><i /><i /><i /></span> : voice.state === "done" ? <Icon name="btn-check" anim="hop" className="w-14 h-14" /> : <MicIcon anim={voice.state === "listening" ? "pulse" : "float"} className="w-14 h-14" />}
              </button>
              <h2 className="font-display text-4xl text-theme-textPrimary mt-5 leading-tight">
                {voice.state === "listening" ? "Mai đang nghe…" : voice.state === "thinking" ? "Mai đang ghi…" : voice.state === "done" ? "Mai ghi rồi ạ" : voice.error ? "Mai chưa ghi được" : "Mai sẵn sàng"}
              </h2>
              {voice.state === "listening" && !voice.text && <p className="text-sm text-theme-textSecondary mt-1.5">Anh nói hoặc gõ bên dưới, ví dụ:<br /><b>“nãy anh chi hết 45k tiền mặt ăn trưa”</b></p>}
              {voice.text && voice.state !== "done" && <p className="text-lg font-semibold text-theme-textPrimary mt-3 italic max-w-sm">“{voice.text}”</p>}

                <div key={t.id} className="console-lcd mt-4 w-full max-w-sm bg-theme-surface px-4 py-3 text-left">

                </div>
              ))}
              {voice.error && voice.state === "idle" && <p className="text-sm font-bold text-[var(--expense)] mt-2 max-w-sm">{voice.error}</p>}

                <form onSubmit={e => {
                    e.preventDefault();
                    const txt = assistInput.trim();
                    if (!txt) return;
                    clearTimeout(voiceRef.current.lockT);
                    if (voice.state === "listening") voiceStop();
                    voiceRef.current.isAssist = true;
                    setAssistInput("");
                    voiceProcess(txt, { lock: true });
                  }}
                  className="mt-5 w-full max-w-sm flex gap-2 items-center">
                  <input
                    type="text"
                    value={assistInput}
                    onFocus={() => {
                      clearTimeout(voiceRef.current.lockT);
                      if (voice.state === "listening") voiceStop();
                    }}
                    onChange={e => {
                      clearTimeout(voiceRef.current.lockT);
                      if (voice.state === "listening") voiceStop();
                      setAssistInput(e.target.value);

                    placeholder="Hoặc gõ: 45k ăn trưa tiền mặt…"
                    className="flex-1 min-w-0 px-3.5 py-2.5 rounded-lg border-2 border-[var(--ink)] bg-theme-surface text-theme-textPrimary text-sm font-semibold shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] focus:outline-none"

                {voice.state === "done" && <button onClick={() => { voiceUndo(); lockFinish(1200); }} className="game-btn game-btn-neutral flex-1 py-3 bg-theme-surface text-theme-textPrimary font-bold">Hoàn tác</button>}
                {voice.state !== "done" && voice.state !== "listening" && voice.state !== "thinking" && (
                  <button onClick={() => { setAssistInput(""); if (window.onMaiAssist) window.onMaiAssist({}); else voiceListen("command"); }} className="game-btn game-btn-neutral flex-1 py-3 bg-theme-surface text-theme-textPrimary font-bold flex items-center justify-center gap-1.5">
                    <MicIcon className="w-4 h-4 text-theme-primary" /> Nói lại
                  </button>
                )}
                <button onClick={() => { setAssistInput(""); lockFinish(0); }} className="game-btn flex-1 py-3 bg-theme-primary text-[var(--on-primary)] font-bold">{voice.state === "done" ? "Xong" : "Đóng"}</button>
              </div>
            </div>
          )}

          {/* MAI ĐANG NGHE (giọng nói) */}
          {voice.lock ? null : (voice.state !== "idle" && !(voice.state === "listening" && voice.mode === "wake")) || voice.error ? (
            <div className="fixed inset-x-0 bottom-0 z-[60] p-3 pb-6 md:p-6 flex justify-center pointer-events-none">
              <div className="console-bezel modal-sheet pointer-events-auto w-full max-w-md p-4">
                <div className="flex items-center gap-3">
                  <span className={`w-12 h-12 shrink-0 rounded-xl border-2 border-[var(--ink)] shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] flex items-center justify-center ${voice.state === "listening" ? "bg-theme-primary text-[var(--on-primary)] mai-pulse" : "bg-[var(--accent)] text-[var(--on-accent,#4A2B18)]"}`}>
                    {voice.state === "thinking" ? <span className="mai-typing inline-flex gap-1"><i /><i /><i /></span> : <MicIcon anim={voice.state === "listening" ? "pulse" : ""} className="w-6 h-6" />}
                  </span>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-theme-textPrimary">{voice.state === "listening" ? "Mai đang nghe…" : voice.state === "thinking" ? "Mai đang hiểu câu…" : voice.state === "done" ? "Mai đã ghi" : "Mai"}</p>
                    {voice.text && voice.state !== "done" && <p className="text-sm text-theme-textSecondary italic truncate">“{voice.text}”</p>}
                    {voice.state === "listening" && !voice.text && <p className="text-xs text-theme-textSecondary">Ví dụ: “nãy anh chi hết 45k tiền mặt ăn trưa”</p>}
                  </div>
                  <button onClick={() => { voiceStop(); setVoice(v => ({ ...v, state: "idle", result: null, error: null })); }} aria-label="Đóng" className="console-key shrink-0">✕</button>
                </div>
                {voice.state === "done" && (voice.result || []).map(t => (
                  <div key={t.id} className="console-lcd mt-3 flex items-center gap-3 bg-theme-background px-3 py-2">
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-bold text-theme-textPrimary truncate">{t.category}{t.note ? ` · ${t.note}` : ""}</p>
                      <p className="text-xs text-theme-textSecondary truncate">{txBankLabel(accounts, t)} · {new Date(t.date).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" })}</p>
                    </div>
                    <p className={`font-display text-xl tabular ${t.type === "INCOME" ? "text-[var(--income)]" : "text-theme-textPrimary"}`}>{t.type === "INCOME" ? "+" : "−"}{formatVND(t.amount)}</p>
                  </div>
                ))}
                {voice.state === "done" && (
                  <div className="flex gap-2 mt-3">
                    <button onClick={voiceUndo} className="game-btn-sm flex-1 py-2 text-sm font-bold text-theme-textPrimary bg-theme-background">Hoàn tác</button>
                    <button onClick={() => { const t = (voice.result || [])[0]; setVoice(v => ({ ...v, state: "idle", result: null })); if (t) { setActiveTab("overview"); handleStartEditTx(t); } }} className="game-btn-sm flex-1 py-2 text-sm font-bold text-theme-textPrimary bg-theme-background">Sửa</button>
                    <button onClick={() => setVoice(v => ({ ...v, state: "idle", result: null }))} className="game-btn flex-1 py-2 bg-theme-primary text-[var(--on-primary)] text-sm font-bold">Xong</button>
                  </div>
                )}
                {voice.error && voice.state === "idle" && <p className="text-xs font-bold text-[var(--expense)] mt-2">{voice.error}</p>}
                {voice.error && voice.state === "idle" && voiceAvailable && <button onClick={() => voiceListen("command")} className="game-btn mt-2 w-full py-2.5 bg-theme-primary text-[var(--on-primary)] text-sm font-bold">Nói lại</button>}
              </div>
            </div>
          ) : null}

          {/* MAI – XÁC NHẬN / SỬA TRƯỚC KHI GHI */}
          <Presence show={!!maiDraft}>{maiDraft && (
            <div className="fixed inset-0 modal-backdrop z-50 flex items-end md:items-center justify-center p-2 sm:p-4" onClick={() => setMaiDraft(null)}>
              <form key={`${maiDraft.inboxId || maiDraft.raw || "draft"}_${maiDraft.bankId || ""}`} onClick={e => e.stopPropagation()} onSubmit={e => {
                  e.preventDefault();
                  const f = e.target;
                  const sel = parseBankSelection(f.bankSelect ? f.bankSelect.value : "");
                  const draft = {
                    ...maiDraft,
                    type: f.type.value,
                    amount: Number(f.amount.value) || 0,
                    category: f.category.value,
                    bankId: sel.bankId,
                    bankName: sel.bankName || null,
                    isCredit: sel.account ? isCreditAcc(sel.account) : maiDraft.isCredit,
                    note: f.note.value
                  };
                  draft.categoryEdited = draft.category !== maiDraft.category;
                  draft.noteEdited = draft.note !== (maiDraft.note || "");
                  draft.typeEdited = draft.type !== maiDraft.type;
                  draft.edited = draft.amount !== maiDraft.amount || draft.type !== maiDraft.type || ((maiDraft.bankId != null || maiDraft.bankName) && (draft.bankId !== maiDraft.bankId || draft.bankName !== maiDraft.bankName));
                  if ((f.date && f.date.value) || (f.time && f.time.value)) {
                    const old = new Date(maiDraft.date || Date.now());
                    const [y, m, d] = (f.date && f.date.value) ? f.date.value.split("-").map(Number) : [old.getFullYear(), old.getMonth() + 1, old.getDate()];
                    const [hh, mm] = (f.time && f.time.value) ? f.time.value.split(":").map(Number) : [old.getHours(), old.getMinutes()];
                    draft.date = new Date(y, m - 1, d, isNaN(hh) ? old.getHours() : hh, isNaN(mm) ? old.getMinutes() : mm).toISOString();
                  }
                  const tx = maiCommit(draft);
                  if (tx) { if (maiDraft.inboxId) setMaiInbox(prev => prev.filter(x => x.inboxId !== maiDraft.inboxId)); setMaiDraft(null); }
                }}
                className="console-bezel modal-sheet w-full md:max-w-md max-h-[92vh] overflow-hidden flex flex-col">
                <div className="console-top-strip px-3.5 py-1.5 flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="w-2 h-2 rounded-sm bg-[#72E6BA] px-led shrink-0" />
                    <span className="font-pixel text-[14px] uppercase tracking-wider truncate">MAI · XÁC NHẬN GHI SỔ</span>
                  </div>
                  <button type="button" onClick={() => setMaiDraft(null)} aria-label="Đóng" className="console-key shrink-0">✕</button>
                </div>
                <div className="h-1 retro-stripes-h shrink-0" />
                <div className="p-3.5 overflow-y-auto no-scrollbar space-y-2.5">
                  <div className="flex items-center gap-2.5">
                    <MaiAvatar size={36} animated />
                    <div className="flex-1 min-w-0">
                      <p className="font-display text-xl text-theme-textPrimary leading-tight truncate">Hiểu thế này, đúng không anh?</p>
                      {maiDraft.confidence != null && <p className="text-[13px] font-semibold text-theme-textSecondary truncate">Chắc chắn {Math.round(maiDraft.confidence * 100)}%{maiDraft.balance != null ? ` · Sau GD ${formatVND(maiDraft.balance)}` : ""}</p>}
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5">
                    {[["EXPENSE", "Chi tiền", "arrow-up-right"], ["INCOME", "Thu tiền", "arrow-down-left"]].map(([v, l, ic]) => (
                      <label key={v} className="cursor-pointer">
                        <input type="radio" name="type" value={v} defaultChecked={maiDraft.type === v} className="peer sr-only" />
                        <span className={`flex items-center justify-center gap-1 py-2 px-2 rounded-lg border-2 border-theme-border bg-theme-background font-bold text-xs text-theme-textSecondary peer-checked:border-[var(--ink)] peer-checked:shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] ${v === "INCOME" ? "peer-checked:bg-[var(--income)] peer-checked:text-[var(--on-income)]" : "peer-checked:bg-[var(--expense)] peer-checked:text-[var(--on-expense)]"}`}><Icon name={ic} className="w-3.5 h-3.5" /> {l}</span>
                      </label>
                    ))}
                  </div>
                  <div className="grid grid-cols-[1fr_auto] gap-1.5 items-center">
                    <input name="date" type="date" defaultValue={(() => { const d = new Date(maiDraft.date || Date.now()); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })()} className="w-full bg-theme-background border-2 border-theme-border rounded-lg py-1.5 px-2.5 text-xs font-bold text-theme-textPrimary" />
                    <input name="time" type="time" defaultValue={(() => { const d = new Date(maiDraft.date || Date.now()); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; })()} className="w-[104px] bg-theme-background border-2 border-theme-border rounded-lg py-1.5 px-2 text-xs font-bold text-theme-textPrimary" />
                  </div>
                  <div className="console-lcd px-3 py-2 bg-theme-background">
                    <label className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider block">Số tiền</label>
                    <CurrencyInput name="amount" defaultValue={maiDraft.amount} required={true} className="w-full bg-transparent border-0 p-0 font-display text-2xl text-theme-textPrimary tabular focus:outline-none focus:ring-0 focus:shadow-none" />
                  </div>

                  {/* Chọn Hạng mục đồng bộ UI App */}
                  <div className="space-y-1.5">
                    <div className="flex justify-between items-center">
                      <label className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider">Hạng mục</label>
                      <span className="text-[12px] font-bold px-1.5 py-0.5 rounded bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] border border-[var(--ink)]">{maiDraft.category}</span>
                    </div>
                    <CategoryParentFilterBar parentCategories={parentCategories} selectedParent={txParentFilter} onSelectParent={setTxParentFilter} />
                    <div className="grid grid-cols-3 gap-1.5 max-h-[116px] overflow-y-auto no-scrollbar p-1.5 border-2 border-theme-border rounded-lg bg-theme-background">
                      {filteredCategoriesForTx.map((c, i) => (
                        <label key={c.id || `md_cat_${c.name}_${i}`} className="cursor-pointer">
                          <input type="radio" name="category" value={c.name} defaultChecked={maiDraft.category === c.name}
                            onChange={() => setMaiDraft(prev => prev ? { ...prev, category: c.name } : prev)} className="peer sr-only" />
                          <div className="flex items-center gap-1.5 px-2 py-1.5 rounded-lg border-2 border-theme-border bg-theme-surface text-theme-textPrimary peer-checked:border-[var(--ink)] peer-checked:bg-[var(--accent)] peer-checked:text-[var(--on-accent,#4A2B18)] peer-checked:shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] transition-all">
                            <Icon name={c.icon || "tag"} className="w-4 h-4 shrink-0" />
                            <span className="text-[13px] font-bold truncate">{c.name}</span>
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Chọn Nguồn tiền / Ví đồng bộ UI App */}
                  <div className="space-y-1.5">
                    <label className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider block">Nguồn tiền / Ví</label>
                    {(() => {
                      const matched = resolveAccount(accounts, maiDraft);
                      const defaultVal = matched ? String(matched.id) : (maiDraft.bank ? "" : (maiDraft.bankName ? `legacy:${maiDraft.bankName}` : (accounts[0] ? String(accounts[0].id) : "")));
                      return (
                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar p-1 border-2 border-theme-border rounded-lg bg-theme-background">
                          {!matched && maiDraft.bank && (
                            <label className="cursor-pointer shrink-0">
                              <input type="radio" name="bankSelect" value="" defaultChecked={defaultVal === ""} className="peer sr-only" />
                              <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border-2 border-theme-border bg-theme-surface text-theme-textPrimary peer-checked:border-[var(--ink)] peer-checked:bg-[var(--accent)] peer-checked:text-[var(--on-accent,#4A2B18)] peer-checked:shadow-[inset_0_-3px_0_rgba(74,51,80,.22)]">
                                <Icon name="btn-plus" className="w-4 h-4 shrink-0" />
                                <span className="text-xs font-bold whitespace-nowrap">Tạo ví “{maiDraft.bank}”</span>
                              </div>
                            </label>
                          )}
                          {accounts.map(a => (
                            <label key={a.id} className="cursor-pointer shrink-0">
                              <input type="radio" name="bankSelect" value={String(a.id)} defaultChecked={defaultVal === String(a.id)} className="peer sr-only" />
                              <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border-2 border-theme-border bg-theme-surface text-theme-textPrimary peer-checked:border-[var(--ink)] peer-checked:bg-[var(--accent)] peer-checked:text-[var(--on-accent,#4A2B18)] peer-checked:shadow-[inset_0_-3px_0_rgba(74,51,80,.22)]">
                                <BankBadge name={a.name} size={18} />
                                <span className="text-xs font-bold whitespace-nowrap">{formatAccountLabel(a)}</span>
                              </div>
                            </label>
                          ))}
                        </div>
                      );
                    })()}
                  </div>

                  <div>
                    <label className="font-pixel text-[14px] text-theme-textSecondary mb-1 block uppercase">Ghi chú</label>
                    <input name="note" defaultValue={maiDraft.note || ""} placeholder="Ghi chú..." className="w-full bg-theme-background border-2 border-theme-border rounded-lg py-2 px-2.5 text-xs font-semibold text-theme-textPrimary" />
                  </div>
                  <button type="submit" className="game-btn w-full py-2.5 bg-theme-primary text-[var(--on-primary)] font-bold text-sm flex justify-center items-center gap-2"><span className="console-key">A</span><Icon name="btn-check" className="w-4 h-4" /> Đúng rồi, ghi sổ</button>
                </div>
              </form>
            </div>
          )}</Presence>

          {/* GHI HÀNG LOẠT NHIỀU GIAO DỊCH TỪ NHIỀU ẢNH */}
          <Presence show={!!(batchImageDrafts && batchImageDrafts.length)}>{batchImageDrafts && batchImageDrafts.length > 0 && (() => {
            const picked = batchImageDrafts.filter(x => x.selected && Math.round(Number(x.amount) || 0) > 0);
            const sumExp = picked.filter(x => x.type !== "INCOME").reduce((s, x) => s + Math.round(Number(x.amount) || 0), 0);
            const sumInc = picked.filter(x => x.type === "INCOME").reduce((s, x) => s + Math.round(Number(x.amount) || 0), 0);
            const allSelected = batchImageDrafts.every(x => x.selected);
            const patchItem = (bid, patch) => setBatchImageDrafts(prev => (prev || []).map(x => x._bid === bid ? { ...x, ...patch } : x));
            const removeItem = (bid) => setBatchImageDrafts(prev => {
              const next = (prev || []).filter(x => x._bid !== bid);
              return next.length ? next : null;
            });
            const closeBatch = () => { setBatchPicker(null); setBatchImageDrafts(null); };
            return (
              <div className="fixed inset-0 modal-backdrop z-50 flex items-end sm:items-center justify-center p-2 sm:p-4" onClick={closeBatch}>
                <div onClick={e => e.stopPropagation()} className="console-bezel modal-sheet w-full max-w-lg max-h-[93vh] overflow-hidden flex flex-col">
                  <div className="console-top-strip px-3.5 py-1.5 flex items-center justify-between shrink-0">
                    <div className="flex items-center gap-2 min-w-0">
                      <span className="w-2 h-2 rounded-sm bg-[#72E6BA] px-led shrink-0" />
                      <span className="font-pixel text-[14px] uppercase tracking-wider truncate">QUÉT NHIỀU ẢNH · {batchImageDrafts.length} GIAO DỊCH</span>
                    </div>
                    <button type="button" onClick={closeBatch} aria-label="Đóng" className="console-key shrink-0">✕</button>
                  </div>
                  <div className="h-1 retro-stripes-h shrink-0" />

                  {/* Tóm tắt nhanh */}
                  <div className="px-3.5 pt-2.5 pb-2 border-b-2 border-dashed border-theme-border bg-theme-surface shrink-0 flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2 text-xs font-bold">
                      <span className="font-pixel text-[14px] px-2 py-0.5 rounded bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] border border-[var(--ink)]">ĐÃ CHỌN {picked.length}/{batchImageDrafts.length}</span>
                      {sumExp > 0 && <span className="text-[var(--expense)] tabular">−{formatShortVND(sumExp)}</span>}
                      {sumInc > 0 && <span className="text-[var(--income)] tabular">+{formatShortVND(sumInc)}</span>}
                    </div>
                    <button type="button" onClick={() => setBatchImageDrafts(prev => (prev || []).map(x => ({ ...x, selected: !allSelected })))}
                      className="text-xs font-bold text-theme-primary underline">
                      {allSelected ? "Bỏ chọn hết" : "Chọn tất cả"}
                    </button>
                  </div>

                  {/* Danh sách từng giao dịch */}
                  <div className="p-3 space-y-2.5 overflow-y-auto no-scrollbar flex-1 min-h-0">
                    {batchImageDrafts.map((item, idx) => {
                      const matchedAcc = resolveAccount(accounts, item);
                      const accDisplayName = matchedAcc ? matchedAcc.name : (item.bank || item.bankName || (accounts[0] ? accounts[0].name : "Tiền mặt"));
                      const accDisplayLabel = matchedAcc ? formatAccountLabel(matchedAcc) : (item.bank ? `+ Tạo ví “${item.bank}”` : accDisplayName);
                      const dObj = item.date ? new Date(item.date) : new Date();
                      const dateStr = `${dObj.getFullYear()}-${pad2(dObj.getMonth() + 1)}-${pad2(dObj.getDate())}`;
                      const timeStr = `${pad2(dObj.getHours())}:${pad2(dObj.getMinutes())}`;
                      const catPickerOpen = batchPicker && batchPicker.bid === item._bid && batchPicker.kind === "cat";
                      const bankPickerOpen = batchPicker && batchPicker.bid === item._bid && batchPicker.kind === "bank";
                      return (
                        <div key={item._bid} className={`rounded-xl border-2 p-2.5 space-y-2 transition-all ${item.selected ? "border-[var(--ink)] bg-theme-background" : "border-theme-border bg-theme-background/50 opacity-55"}`}>
                          <div className="flex items-center justify-between gap-2">
                            <label className="flex items-center gap-2 cursor-pointer min-w-0">
                              <input type="checkbox" checked={!!item.selected} onChange={e => patchItem(item._bid, { selected: e.target.checked })}
                                className="w-4 h-4 accent-theme-primary shrink-0 cursor-pointer" />
                              <span className="font-pixel text-[13px] px-1.5 py-0.5 rounded bg-theme-surface border border-theme-border text-theme-textSecondary shrink-0">#{idx + 1}</span>
                              {item.imgLabel && <span className="text-[12px] font-semibold text-theme-textSecondary truncate">{item.imgLabel}</span>}
                            </label>
                            <div className="flex items-center gap-1 shrink-0">
                              <button type="button" onClick={() => patchItem(item._bid, { type: item.type === "INCOME" ? "EXPENSE" : "INCOME", typeEdited: true })}
                                className={`px-2 py-0.5 rounded border-[1.5px] border-[var(--ink)] text-[12px] font-bold ${item.type === "INCOME" ? "bg-[var(--income)] text-[var(--on-income)]" : "bg-[var(--expense)] text-[var(--on-expense)]"}`}>
                                {item.type === "INCOME" ? "+ Thu" : "− Chi"}
                              </button>
                              <button type="button" onClick={() => removeItem(item._bid)} aria-label="Bỏ khoản này"
                                className="w-6 h-6 rounded border border-theme-border bg-theme-surface text-theme-textSecondary text-xs font-bold flex items-center justify-center">✕</button>
                            </div>
                          </div>

                          <div className="grid grid-cols-[1fr_auto_auto] gap-1.5 items-center">
                            <input type="number" inputMode="numeric" value={item.amount || ""}
                              onChange={e => patchItem(item._bid, { amount: Math.max(0, Number(e.target.value) || 0), edited: true })}
                              placeholder="Số tiền..."
                              className="w-full min-w-0 bg-theme-surface border-2 border-theme-border rounded-lg px-2.5 py-1 font-display text-xl text-theme-textPrimary tabular" />
                            <input type="date" value={dateStr}
                              onChange={e => {
                                if (!e.target.value) return;
                                const [y, m, d] = e.target.value.split("-").map(Number);
                                const old = new Date(item.date || Date.now());
                                patchItem(item._bid, { date: new Date(y, m - 1, d, old.getHours(), old.getMinutes()).toISOString() });
                              }}
                              className="bg-theme-surface border-2 border-theme-border rounded-lg py-1.5 px-1.5 text-[12px] font-bold text-theme-textPrimary w-[112px]" />
                            <input type="time" value={timeStr}
                              onChange={e => {
                                if (!e.target.value) return;
                                const [hh, mm] = e.target.value.split(":").map(Number);
                                const old = new Date(item.date || Date.now());
                                patchItem(item._bid, { date: new Date(old.getFullYear(), old.getMonth(), old.getDate(), hh, mm).toISOString() });
                              }}
                              className="bg-theme-surface border-2 border-theme-border rounded-lg py-1.5 px-1.5 text-[12px] font-bold text-theme-textPrimary w-[84px]" />
                          </div>

                          {/* Nút chọn Hạng mục & Nguồn tiền đồng bộ UI App */}
                          <div className="grid grid-cols-2 gap-1.5">
                            <button type="button"
                              onClick={() => setBatchPicker(catPickerOpen ? null : { bid: item._bid, kind: "cat" })}
                              className={`flex items-center gap-1.5 px-2 py-1.5 rounded-lg border-2 text-left transition-all ${catPickerOpen ? "border-[var(--ink)] bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] shadow-[inset_0_-2px_0_rgba(74,51,80,.22)]" : "border-[var(--ink)] bg-theme-surface text-theme-textPrimary shadow-[inset_0_-2px_0_rgba(74,51,80,.14)]"}`}>
                              <Icon name={getIconForCategoryName(item.category) || getCategoryIcon(item.category)} className="w-4 h-4 shrink-0" />
                              <span className="text-xs font-bold truncate flex-1">{item.category}</span>
                              <Icon name={catPickerOpen ? "chevron-up" : "chevron-down"} className="w-3.5 h-3.5 shrink-0 opacity-70" />
                            </button>

          {/* MODAL XEM TRƯỚC NHẬP FILE SAO LƯU */}
          <Presence show={!!importPreview}>{importPreview && (
            <div className="fixed inset-0 z-[90] modal-backdrop flex items-center justify-center p-4" onClick={() => setImportPreview(null)}>
              <div onClick={e => e.stopPropagation()} className="console-bezel modal-sheet w-full max-w-md overflow-hidden">
                <div className="console-top-strip px-3.5 py-1.5 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-sm bg-[#FFD875] px-led" />
                    <span className="font-pixel text-[14px] uppercase tracking-wider">NHẬP TỆP SAO LƯU .JSON</span>
                  </div>
                  <button type="button" onClick={() => setImportPreview(null)} aria-label="Đóng" className="console-key">✕</button>
                </div>
                <div className="h-1 retro-stripes-h" />
                <div className="p-4 space-y-3.5">
                  <div className="console-lcd p-3 bg-theme-background space-y-1.5 text-sm">
                    <p className="font-bold text-theme-textPrimary truncate">📄 {importPreview.fileName}</p>
                    {importPreview.timestamp && <p className="text-xs text-theme-textSecondary">Thời gian: {new Date(importPreview.timestamp).toLocaleString("vi-VN")}</p>}
                    <div className="grid grid-cols-2 gap-2 pt-1.5 text-xs font-bold text-theme-textPrimary">
                      <div className="bg-theme-surface p-2 rounded-lg border-2 border-theme-border">🧾 {importPreview.data.transactions.length} giao dịch</div>
                      <div className="bg-theme-surface p-2 rounded-lg border-2 border-theme-border">💳 {Array.isArray(importPreview.data.accounts) ? importPreview.data.accounts.length : 0} ví</div>
                      <div className="bg-theme-surface p-2 rounded-lg border-2 border-theme-border">🏷️ {Array.isArray(importPreview.data.categories) ? importPreview.data.categories.length : 0} hạng mục</div>
                      <div className="bg-theme-surface p-2 rounded-lg border-2 border-theme-border">🤝 {Array.isArray(importPreview.data.debts) ? importPreview.data.debts.length : 0} vay/nợ</div>
                    </div>
                  </div>
                  <div className="space-y-2">
                    <button onClick={() => applyImportJson("merge")} className="game-btn game-btn-accent w-full py-2.5 bg-[var(--accent)] text-[var(--on-accent,#4A2B18)] font-bold text-sm flex items-center justify-center gap-2">
                      <span className="console-key">A</span> Gộp thêm vào dữ liệu hiện tại
                    </button>
                    <button onClick={() => applyImportJson("replace")} className="game-btn w-full py-2.5 bg-[var(--expense)] text-[var(--on-expense)] font-bold text-sm flex items-center justify-center gap-2">
                      <span className="console-key">X</span> Thay thế toàn bộ trên máy
                    </button>
                    <button onClick={() => setImportPreview(null)} className="game-btn-sm w-full py-2 bg-theme-background text-theme-textSecondary font-bold text-xs">
                      Huỷ
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}</Presence>

          {/* BUDGET SETUP MODAL */}
          <Presence show={isBudgetModalOpen}>{isBudgetModalOpen && (
            <div className="fixed inset-0 modal-backdrop z-50 flex items-end sm:items-center justify-center p-2 sm:p-4" onClick={() => { setIsBudgetModalOpen(false); setEditingBudgetCat(null); }}>
              <div onClick={e => e.stopPropagation()} className="console-bezel modal-sheet w-full max-w-md max-h-[92vh] overflow-hidden flex flex-col">
                <div className="console-top-strip px-3.5 py-1.5 flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2 min-w-0">
                    {editingBudgetCat ? (
                      <button type="button" onClick={() => setEditingBudgetCat(null)} className="console-key shrink-0" title="Quay lại">◄</button>
                    ) : (
                      <span className="w-2 h-2 rounded-sm bg-[#72E6BA] px-led shrink-0" />
                    )}
                    <span className="font-pixel text-[14px] uppercase tracking-wider truncate">
                      {editingBudgetCat ? `NGÂN SÁCH · ${editingBudgetCat}` : "THIẾT LẬP NGÂN SÁCH"}
                    </span>
                  </div>
                  <button type="button" onClick={() => { setIsBudgetModalOpen(false); setEditingBudgetCat(null); }} aria-label="Đóng" className="console-key shrink-0">✕</button>
                </div>
                <div className="h-1 retro-stripes-h shrink-0" />

                <div className="p-4 space-y-4 overflow-y-auto no-scrollbar">
                  {editingBudgetCat ? (
                    <div className="space-y-3">
                      <div className="console-lcd p-3 bg-theme-background">
                        <label className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider block mb-1">
                          Hạn mức tháng · “{editingBudgetCat}” (VNĐ)
                        </label>
                        <input
                          type="number"
                          defaultValue={categoryBudgets[editingBudgetCat] || ""}
                          id="cat_budget_input"
                          placeholder="Ví dụ: 3000000"
                          className="w-full bg-theme-surface border-2 border-theme-border rounded-lg p-2.5 font-display text-2xl text-theme-textPrimary"
                        />
                      </div>

                      <div className="flex flex-wrap gap-1.5">
                        {[500000, 1000000, 2000000, 3000000, 5000000, 10000000].map(amt => (
                          <button
                            key={amt}
                            type="button"
                            onClick={() => {
                              const el = document.getElementById("cat_budget_input");
                              if (el) el.value = amt;
                            }}
                            className="game-btn-sm text-xs bg-theme-background text-theme-textPrimary font-bold px-2.5 py-1">
                            {formatVND(amt)}
                          </button>
                        ))}
                      </div>

                      <div className="flex gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => {
                            const val = document.getElementById("cat_budget_input")?.value || 0;
                            handleSaveCategoryBudget(editingBudgetCat, val);
                          }}
                          className="game-btn flex-1 py-2.5 bg-theme-primary text-[var(--on-primary)] font-bold text-xs flex items-center justify-center gap-1.5">
                          <span className="console-key">A</span> Lưu hạn mức
                        </button>
                        {categoryBudgets[editingBudgetCat] > 0 && (
                          <button
                            type="button"
                            onClick={() => handleSaveCategoryBudget(editingBudgetCat, 0)}
                            className="game-btn-sm px-3.5 py-2.5 bg-[var(--expense-light)] text-[var(--expense)] font-bold text-xs">
                            Xóa hạn mức
                          </button>
                        )}
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-3.5">
                      <div className="console-lcd bg-theme-background p-3 space-y-2.5">
                        <label className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider block">
                          Tổng ngân sách chi tiêu hàng tháng (VNĐ)
                        </label>
                        <input
                          type="number"
                          defaultValue={monthlyBudget || ""}
                          id="monthly_budget_input"
                          placeholder="Ví dụ: 15000000"
                          className="w-full bg-theme-surface border-2 border-theme-border rounded-lg p-2.5 font-display text-2xl text-theme-textPrimary"
                        />
                        <div className="flex flex-wrap gap-1.5">
                          {[5000000, 10000000, 15000000, 20000000, 30000000].map(amt => (
                            <button
                              key={amt}
                              type="button"
                              onClick={() => {
                                const el = document.getElementById("monthly_budget_input");
                                if (el) el.value = amt;
                              }}
                              className="game-btn-sm text-[13px] bg-theme-surface text-theme-textPrimary font-bold px-2 py-1">
                              {formatVND(amt)}
                            </button>
                          ))}
                        </div>
                        <button
                          type="button"
                          onClick={() => {
                            const val = document.getElementById("monthly_budget_input")?.value || 0;
                            handleSaveMonthlyBudget(val);
                            setIsBudgetModalOpen(false);
                          }}
                          className="game-btn w-full py-2.5 bg-[var(--income)] text-[var(--on-income)] font-bold text-xs flex items-center justify-center gap-2">
                          <span className="console-key">A</span> Cập nhật Ngân sách Tổng
                        </button>
                      </div>

                      <div className="space-y-1.5">
                        <span className="font-pixel text-[14px] text-theme-textSecondary uppercase tracking-wider block">
                          Hoặc chọn nhóm lớn đặt hạn mức riêng:
                        </span>
                        <div className="grid grid-cols-2 gap-2 max-h-[180px] overflow-y-auto no-scrollbar">
                          {parentCategories.map(p => (
                            <button
                              key={p.id}
                              type="button"
                              onClick={() => setEditingBudgetCat(p.name)}
                              className="p-2 bg-theme-background border-2 border-theme-border hover:border-[var(--ink)] rounded-lg text-left flex items-center justify-between group transition-all">
                              <div className="flex items-center gap-2 truncate">
                                <Icon name={p.icon} className="w-5 h-5" />
                                <span className="text-xs font-bold text-theme-textPrimary truncate">{p.name}</span>
                              </div>
                              <span className="font-pixel text-[13px] text-theme-primary shrink-0">ĐẶT</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}</Presence>

        </div>
      );
    }
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Spendy Error Caught:", error, errorInfo);
      }
      handleReset() {
        localStorage.removeItem("vina_theme");
        localStorage.removeItem("vina_category_parent_map");
        window.location.reload();
      }
      handleFullReset() {
        if (confirm("Thao tác này sẽ xoá cấu hình lỗi cục bộ và tải lại ứng dụng. Bạn có chắc không?")) {
          localStorage.clear();
          window.location.reload();
        }
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#DCECC8] text-[#4A2B18] flex items-center justify-center p-5 font-sans">
              <div className="max-w-md w-full bg-[#FBF2DE] rounded-xl border-[3px] border-[#54321D] shadow-[inset_0_-3px_0_rgba(74,51,80,.22)] overflow-hidden text-center">
                <div className="bg-[#C8945C] text-[#FFF9EC] px-3.5 py-1.5 flex items-center justify-between border-b-2 border-[#54321D]">
                  <span className="font-pixel text-[14px] tracking-wider uppercase">SYSTEM · RECOVERY MODE</span>
                  <span className="w-2.5 h-2.5 rounded-sm bg-[#FF7B95]" />
                </div>
                <div className="h-1.5 retro-stripes-h" />
                <div className="p-5 space-y-4">
                  <div className="w-14 h-14 bg-[#F8D56B] text-[#4A2B18] border-2 border-[#54321D] shadow-[inset_0_-2px_0_rgba(74,51,80,.22)] rounded-xl flex items-center justify-center mx-auto">
                    <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="font-display text-3xl text-[var(--on-accent,#4A2B18)] leading-none">Khôi phục Spendy</h2>
                    <p className="text-xs font-semibold text-[#564768] mt-1.5">
                      Đã xảy ra sự cố khi tải giao diện. Nhấn nút bên dưới để đặt lại giao diện chuẩn và tiếp tục sử dụng:
                    </p>
                  </div>
                  {this.state.error && (
                    <div className="p-3 bg-[#FFE2E8] text-[#D9385A] border-2 border-[#D9385A] text-[13px] font-bold rounded-lg text-left font-mono break-all max-h-24 overflow-y-auto">
                      {this.state.error.toString()}
                    </div>
                  )}
                  <div className="space-y-2 pt-1">
                    <button
                      onClick={() => this.handleReset()}
                      className="game-btn w-full py-2.5 bg-[#8CD778] text-[var(--on-accent,#4A2B18)] font-bold text-sm">
                      [A] Đặt lại Giao diện & Tải lại
                    </button>
                    <button
                      onClick={() => window.location.reload()}
                      className="game-btn-sm w-full py-2 bg-[#EFE0BF] text-[var(--on-accent,#4A2B18)] font-bold text-xs">
                      Thử tải lại ngay
                    </button>
                    <button
                      onClick={() => this.handleFullReset()}
                      className="w-full py-2 text-[#564768] hover:text-[#D9385A] text-xs font-bold underline transition-colors">
                      Khôi phục dữ liệu gốc nếu bị xung đột
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
