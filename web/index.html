      // Gộp dữ liệu 2 thiết bị thay vì ghi đè nhau. `base` là bên có thay đổi mới hơn (nguồn
      // chính cho ví, danh mục, ngân sách...), `other` là bên cũ hơn. Giao dịch được gộp theo id,
      // lệnh xoá (tombstone) luôn thắng, số dư ví được hiệu chỉnh theo phần giao dịch chênh lệch.
      const mergeFinancialData = (base, other) => {
        const eff = (t) => (t.type === "INCOME" ? t.amount : -t.amount) || 0;
        const deleted = new Set([...(base.deletedTxIds || []), ...(other.deletedTxIds || [])]);
        const baseTx = (base.transactions || []).filter(t => !deleted.has(t.id));
        const otherTx = (other.transactions || []).filter(t => !deleted.has(t.id));
        const baseAllIds = new Set((base.transactions || []).map(t => t.id));
        const otherById = new Map((other.transactions || []).map(t => [t.id, t]));
        const delta = {}; // tên ví -> chênh lệch số dư cần cộng vào ví của bên `base`
        const bump = (name, v) => { delta[name] = (delta[name] || 0) + v; };

        // Giao dịch bên base đã bị xoá ở bên kia -> trừ ảnh hưởng khỏi số dư
        (base.transactions || []).forEach(t => { if (deleted.has(t.id)) bump(t.bankName, -eff(t)); });
        // Giao dịch chỉ có bên kia -> thêm vào + cộng ảnh hưởng. Trùng id -> bản nào sửa sau thì thắng.
        const mergedTx = baseTx.map(t => {
          const o = otherById.get(t.id);
          if (o && (o.updatedAt || 0) > (t.updatedAt || 0)) {
            bump(t.bankName, -eff(t)); bump(o.bankName, eff(o));
            return o;
          }
          return t;
        });
        otherTx.forEach(t => { if (!baseAllIds.has(t.id)) { mergedTx.push(t); bump(t.bankName, eff(t)); } });
        mergedTx.sort((a, b) => new Date(b.date) - new Date(a.date));

        const accounts = (base.accounts || []).map(a => delta[a.name] ? { ...a, balance: (Number(a.balance) || 0) + delta[a.name] } : a);
        return { ...base, accounts, transactions: mergedTx, deletedTxIds: Array.from(deleted) };
      };

      // Tài liệu Firestore lưu bản sao lưu của tài khoản Firebase đang đăng nhập.
      // Khoá theo uid (ổn định, không đổi kể cả khi người dùng đổi email hiển thị).
      const getUserBackupDocRef = () => {
        const fbUser = window.firebase?.auth && window.firebase.auth().currentUser;
        if (!fbUser || !(window.firebase && window.firebase.firestore)) return null;
        return window.firebase.firestore().collection('vinaspends_backups').doc(fbUser.uid);
      };

      // Bản sao lưu cục bộ (fallback khi mất mạng) phải khoá riêng theo từng tài khoản,
      // nếu không dữ liệu tài khoản A có thể "rò" sang khi đăng nhập tài khoản B.
      const getLocalBackupCacheKey = () => {
        const fbUser = window.firebase?.auth && window.firebase.auth().currentUser;
        return fbUser ? `vina_google_backup_${fbUser.uid}` : "vina_google_backup_guest";
      };

      // Xoá dữ liệu tài chính trên máy về trạng thái trống (như app mới cài) — dùng khi đăng xuất
      // hoặc chuyển sang tài khoản Google khác, để không hiển thị nhầm dữ liệu của tài khoản cũ.
      // Dữ liệu thật vẫn an toàn trên Firebase của tài khoản cũ, không bị xoá.
      const resetLocalFinancialData = () => {
        deletedTxIdsRef.current = [];
        try { localStorage.removeItem("vina_deleted_tx_ids"); } catch(e) {}
        // Điều Mai học thuộc về tài khoản cũ -> không mang sang tài khoản mới
        try { localStorage.removeItem("vina_mai_brain_trained"); } catch(e) {}
        if (window.MaiAgent) setMaiBrain(window.MaiAgent.newBrain());
        setMaiMemory({});
        updateData(
          [{ id: 1, name: "Tiền mặt", accountNo: "CASH", balance: 0 }],
          [],
          [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES],
          [],
          DEFAULT_CATEGORY_PARENT_MAP,
          true,
          {},
          0
        );
      };

      // Xoá vĩnh viễn dữ liệu của TÀI KHOẢN ĐANG ĐĂNG NHẬP — cả trên máy lẫn trên Firebase.
      // Dùng để dọn sạch 1 lần khi tài khoản này lỡ có dữ liệu sai/dính từ tài khoản khác
      // (ví dụ do lỗi đồng bộ cũ trước khi có các bản vá cách ly dữ liệu theo tài khoản).
      // Khác resetLocalFinancialData ở chỗ: gọi updateData với isRemote=false để cơ chế tự
      // đẩy dữ liệu lên Firebase hoạt động bình thường, ghi đè bản cũ trên cloud.
      const handleWipeCloudData = () => {
        if (!confirm("XOÁ VĨNH VIỄN toàn bộ dữ liệu (giao dịch, ví, sổ nợ...) của tài khoản đang đăng nhập — cả trên máy lẫn trên Firebase. Không thể hoàn tác. Tiếp tục?")) return;
        updateData(
          [{ id: 1, name: "Tiền mặt", accountNo: "CASH", balance: 0 }],
          [],
          [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES],
          [],
          DEFAULT_CATEGORY_PARENT_MAP,
          false,
          {},
          0
        );
        addDeletedTxIds(transactions.map(t => t.id));
        showToast("Đã xoá toàn bộ dữ liệu của tài khoản này (cả trên máy và Firebase).", "info");
      };

      const applyUserAccount = (userObj) => {
        if (!userObj || !userObj.email) return;
        const cleanEmail = userObj.email.trim().toLowerCase();
        const finalized = {
          ...userObj,
          email: cleanEmail,
          name: userObj.name || cleanEmail.split('@')[0]
        };

        // Đang chuyển từ 1 tài khoản khác sang tài khoản này — xoá dữ liệu cục bộ trước để
        // tránh lẫn dữ liệu 2 tài khoản, dữ liệu thật của tài khoản mới sẽ được tải về ngay sau đó.
        // So theo uid (đáng tin hơn email) khi có, vì đây là phiên Firebase thật.
        // Dùng ref thay vì đọc thẳng state googleUser vì hàm này còn được gọi từ bên trong
        // listener onAuthStateChanged (closure sống lâu, chỉ chạy 1 lần lúc mount).
        const prevUser = googleUserRef.current;
        const isDifferentAccount = prevUser && (
          (userObj.uid && prevUser.uid) ? prevUser.uid !== userObj.uid : prevUser.email !== cleanEmail
        );
        if (isDifferentAccount) {
          resetLocalFinancialData();
        }

        setGoogleUser(finalized);
        localStorage.setItem("vina_google_user", JSON.stringify(finalized));

        showToast(`Đã đăng nhập: ${cleanEmail}`);
        setSyncStatusDetail(`Đã kết nối tài khoản ${cleanEmail}`);
        // Yêu cầu tải bản sao lưu của tài khoản này qua state trigger (không gọi thẳng
        // handleRestoreFromGoogle ở đây) — applyUserAccount có thể được gọi từ closure "đông cứng"
        // bên trong listener onAuthStateChanged (chỉ chạy 1 lần lúc mount), nên gọi thẳng sẽ dùng
        // nhầm transactions/accounts cũ từ lúc mount thay vì dữ liệu hiện tại.
        setRestoreTrigger(t => t + 1);
      };

      // ===== Đăng nhập Firebase =====
      // Email + mật khẩu chạy được ở mọi nơi (kể cả app Android). Google chỉ có trên trình duyệt
      // vì Google chặn đăng nhập qua cửa sổ web nhúng (WebView) trong app.
      const AUTH_ERRORS = {
        "auth/invalid-email": "Email không hợp lệ.",
        "auth/user-not-found": "Chưa có tài khoản với email này. Bấm \"Tạo tài khoản\".",
        "auth/wrong-password": "Sai mật khẩu.",
        "auth/invalid-credential": "Sai email hoặc mật khẩu.",
        "auth/invalid-login-credentials": "Sai email hoặc mật khẩu.",
        "auth/email-already-in-use": "Email này đã có tài khoản. Chọn \"Đăng nhập\".",
        "auth/weak-password": "Mật khẩu cần ít nhất 6 ký tự.",
        "auth/too-many-requests": "Thử sai quá nhiều lần, đợi một lúc rồi thử lại.",
        "auth/network-request-failed": "Không có mạng. Kết nối mạng để đăng nhập.",
        "auth/operation-not-allowed": "Dự án Firebase chưa bật đăng nhập Email/Mật khẩu (Firebase Console → Authentication → Sign-in method).",
        "auth/requires-recent-login": "Vui lòng đăng xuất rồi đăng nhập lại trước khi làm thao tác này.",
        "auth/provider-already-linked": "Tài khoản đã có mật khẩu.",
        "auth/credential-already-in-use": "Email này đã gắn với tài khoản khác."
      };
      const authErrorText = (err) => AUTH_ERRORS[err && err.code] || (err && err.message) || "Lỗi không xác định";
      const [authBusy, setAuthBusy] = useState(false);
      const [authMode, setAuthMode] = useState("login");
      const [authEmail, setAuthEmail] = useState("");
      const [authPass, setAuthPass] = useState("");
      const [showPass, setShowPass] = useState(false);
      const [linkPass, setLinkPass] = useState("");

      const handleEmailAuth = async (mode, email, password) => {
        if (!(window.firebase && window.firebase.auth)) { showToast("Firebase chưa sẵn sàng, kiểm tra kết nối mạng.", "error"); return; }
        const em = (email || "").trim().toLowerCase();
        if (!em.includes("@")) { showToast("Nhập đúng email.", "error"); return; }
        if ((password || "").length < 6) { showToast("Mật khẩu cần ít nhất 6 ký tự.", "error"); return; }
        setAuthBusy(true);
        try {
          if (mode === "signup") await window.firebase.auth().createUserWithEmailAndPassword(em, password);
          else await window.firebase.auth().signInWithEmailAndPassword(em, password);
          // onAuthStateChanged sẽ áp dụng tài khoản và tải dữ liệu về
        } catch (err) {
          showToast(authErrorText(err), "error");
        } finally {
          setAuthBusy(false);
        }
      };

      const handleResetPassword = async (email) => {
        const em = (email || "").trim().toLowerCase();
        if (!em.includes("@")) { showToast("Nhập email trước rồi bấm Quên mật khẩu.", "error"); return; }
        try {
          await window.firebase.auth().sendPasswordResetEmail(em);
          showToast(`Đã gửi thư đặt lại mật khẩu tới ${em}`, "info");
        } catch (err) { showToast(authErrorText(err), "error"); }
      };

      const handleGoogleOAuthLogin = async () => {
        if (!(window.firebase && window.firebase.auth)) { showToast("Firebase chưa sẵn sàng.", "error"); return; }
        try {
          const provider = new window.firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          await window.firebase.auth().signInWithPopup(provider);
        } catch (err) {
          if (err && err.code === 'auth/popup-closed-by-user') return;
          showToast("Đăng nhập Google thất bại: " + authErrorText(err), "error");
        }
      };

      // Tài khoản Google (tạo trên web) đặt thêm mật khẩu -> đăng nhập được trong app Android, cùng dữ liệu
      const fbHasPassword = () => {
        const u = window.firebase?.auth && window.firebase.auth().currentUser;
        return !!(u && u.providerData.some(p => p.providerId === "password"));
      };
      const handleLinkPassword = async (password) => {
        const u = window.firebase?.auth && window.firebase.auth().currentUser;
        if (!u || !u.email) return;
        if ((password || "").length < 6) { showToast("Mật khẩu cần ít nhất 6 ký tự.", "error"); return; }
        try {
          await u.linkWithCredential(window.firebase.auth.EmailAuthProvider.credential(u.email, password));
          showToast(`Đã đặt mật khẩu. Trong app Android, đăng nhập bằng ${u.email} + mật khẩu này.`);
          setGoogleUser(prev => prev ? { ...prev, hasPassword: true } : prev);
        } catch (err) { showToast(authErrorText(err), "error"); }
      };

      const handleGoogleLogout = () => {
        if (!confirm("Đăng xuất? Dữ liệu trên máy sẽ được dọn để tránh lẫn tài khoản; dữ liệu vẫn an toàn trên Firebase.")) return;
        const fbCurrentUser = window.firebase?.auth && window.firebase.auth().currentUser;
        if (fbCurrentUser) window.firebase.auth().signOut().catch((e) => console.warn("Sign out error:", e));
        showToast("Đã đăng xuất.", "info");
      };

      const handleSaveCategoryBudget = (catName, amount) => {
        const val = Math.max(0, Number(amount) || 0);
        const updated = { ...categoryBudgets, [catName]: val };
        setCategoryBudgets(updated);
        updateData(null, null, null, null, null, updated, null, null);
        showToast(`Đã lưu hạn mức cho "${catName}": ${formatVND(val)}`);
        setIsBudgetModalOpen(false);
        setEditingBudgetCat(null);
      };

      const handleSaveMonthlyBudget = (amount) => {
        const val = Math.max(0, Number(amount) || 0);
        setMonthlyBudget(val);
        updateData(null, null, null, null, null, null, val, null);
        showToast(`Đã cập nhật hạn mức chi tiêu tháng: ${formatVND(val)}`);
      };

      const buildFullBackupPayload = () => {
        const email = googleUser?.email || "";

        // Dynamic report snapshot metrics
        const totalExp = transactions.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);
        const totalInc = transactions.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
        const netSave = totalInc - totalExp;

        // Structured category hierarchy tree with budget and current spending info
        const hierarchyTree = parentCategories.map(parent => {
          const children = categories.filter(c => !c.isParent && (c.parent === parent.name || categoryParentMap[c.name] === parent.name));
          const allocatedBudget = categoryBudgets[parent.name] || 0;
          const currentSpent = transactions
            .filter(t => t.type === 'EXPENSE' && (getParentNameForCategory(t.category) === parent.name || t.category === parent.name))
            .reduce((s, t) => s + t.amount, 0);
          return {
            id: parent.id,
            name: parent.name,
            icon: parent.icon,
            color: parent.color,
            budget: allocatedBudget,
            currentSpent,
            subCategories: children.map(ch => ({ id: ch.id, name: ch.name, icon: ch.icon, color: ch.color }))
          };
        });

        const reportSnapshot = {
          generatedAt: new Date().toISOString(),
          settings: {
            reportType,
            reportPeriod,
            reportHierarchyView,
            reportAccount
          },
          metrics: {
            totalExpense: totalExp,
            totalIncome: totalInc,
            netSavings: netSave,
            transactionCount: transactions.length,
            accountCount: accounts.length,
            parentCategoryCount: parentCategories.length,
            subCategoryCount: subCategories.length
          },
          budgets: {
            monthlyBudget: monthlyBudget || 0,
            categoryBudgets: categoryBudgets || {}
          },
          categoryHierarchy: hierarchyTree,
          parentBreakdown: parentBreakdown || [],
          childBreakdown: childBreakdown || []
        };

        return {
          appName: "VinaSpends",
          version: "2.1",
          timestamp: new Date().toISOString(),
          user: email,
          itemCount: {
            transactions: transactions.length,
            accounts: accounts.length,
            categories: categories.length,
            parentCategories: parentCategories.length,
            subCategories: subCategories.length,
            categoryParentMap: Object.keys(categoryParentMap || {}).length,
            categoryBudgets: Object.keys(categoryBudgets || {}).length,
            debts: debts.length
          },
          data: {
            accounts,
            transactions,
            deletedTxIds: deletedTxIdsRef.current,
            categories,
            categoryParentMap,
            categoryBudgets: categoryBudgets || {},
            monthlyBudget: monthlyBudget || 0,
            reportSettings: {
              reportType,
              reportPeriod,
              reportHierarchyView,
              reportAccount
            },
            reportSnapshot,
            debts,
            theme
          }
        };
      };

      const handleBackupToGoogle = async (isSilent = false) => {
        const email = (googleUser?.email || "").trim().toLowerCase();
        if (!getUserBackupDocRef()) {
          if (!isSilent) showToast("Đăng nhập tài khoản Firebase để đồng bộ.", "info");
          return;
        }

        if (!isSilent) setIsSyncing(true);
        try {
          const backupPayload = buildFullBackupPayload();
          let firebaseOk = false;

          // 1. Firestore (Firebase) của chính tài khoản đang đăng nhập - kênh đồng bộ chính, đợi kết quả thật
          const docRef = getUserBackupDocRef();
          if (docRef) {
            try {
              const db = window.firebase.firestore();
              const localTs = lastLocalEditTime.current || 0;
              let mergedForLocal = null;
              await db.runTransaction(async (trx) => {
                const snap = await trx.get(docRef);
                let toWrite = backupPayload;
                const remote = snap.exists ? snap.data()?.payload : null;
                const rData = remote && (remote.data || null);
                mergedForLocal = null;
                if (rData && Array.isArray(rData.transactions)) {
                  const remoteTs = new Date(remote.timestamp || 0).getTime();
                  const localData = backupPayload.data;
                  const merged = localTs >= remoteTs ? mergeFinancialData(localData, rData) : mergeFinancialData(rData, localData);
                  toWrite = { ...backupPayload, data: { ...localData, ...merged }, itemCount: { ...backupPayload.itemCount, transactions: merged.transactions.length, accounts: merged.accounts.length } };
                  mergedForLocal = toWrite.data;
                }
                trx.set(docRef, { email, payload: toWrite, updatedAt: window.firebase.firestore.FieldValue.serverTimestamp() });
              });
              // Nếu bản gộp khác dữ liệu đang hiển thị (máy khác có thay đổi) -> cập nhật lại màn hình
              if (mergedForLocal && (JSON.stringify(mergedForLocal.transactions) !== JSON.stringify(transactions) || JSON.stringify(mergedForLocal.accounts) !== JSON.stringify(accounts))) {
                addDeletedTxIds(mergedForLocal.deletedTxIds || []);
                updateData(mergedForLocal.accounts, mergedForLocal.transactions, null, null, null, true);
              }
              firebaseOk = true;
              localStorage.setItem("vina_last_firebase_push", String(Date.now()));
            } catch (fErr) {
              console.warn("Firestore backup error:", fErr);
            }
          }

          const timeFormatted = new Date().toLocaleString('vi-VN');
          setLastSyncTime(timeFormatted);
          localStorage.setItem("vina_last_google_sync", timeFormatted);

          if (firebaseOk) {
            setSyncStatusDetail(`Đã đồng bộ qua Firebase lúc ${new Date().toLocaleTimeString('vi-VN')}`);
            if (!isSilent) showToast(`⚡ Đã sao lưu toàn bộ ${transactions.length} GD, ${categories.length} hạng mục & báo cáo lên Firebase!`);
          } else {
            setSyncStatusDetail(`Chưa kết nối được Firebase lúc ${new Date().toLocaleTimeString('vi-VN')} – sẽ thử lại khi có mạng`);
            if (!isSilent) showToast("Chưa kết nối được Firebase. Kiểm tra mạng rồi thử lại.", "error");
          }
        } catch (err) {
          if (!isSilent) showToast("Lỗi sao lưu: " + err.message, "error");
        } finally {
          if (!isSilent) setIsSyncing(false);
        }
      };

      const handleRestoreFromGoogle = async (isSilent = false) => {
        if (!getUserBackupDocRef()) return;

        // Vừa có thao tác sửa/xoá cục bộ (vd xoá giao dịch) mà bản đẩy lên Firebase có thể chưa
        // kịp tới máy chủ — nếu vẫn cho khôi phục ngầm chạy lúc này (do focus lại tab, listener
        // realtime, v.v.) sẽ tải về bản CŨ trên Firebase và ghi đè mất thao tác vừa làm.
        // resetLocalFinancialData/updateData(isRemote=true) không tính là "sửa cục bộ" nên không
        // bị chặn ở đây — chỉ chặn khi có edit thật của người dùng.
        if (isSilent && Date.now() - (lastLocalEditTime.current || 0) < 3000) {
          return;
        }

        if (!isSilent) setIsSyncing(true);
        try {
          let remotePayload = null;
          let sourceName = "";

          const docRef = getUserBackupDocRef();
          try {
            const snap = await docRef.get();
            const firebaseData = snap.exists ? snap.data()?.payload : null;
            if (firebaseData && (firebaseData.data || firebaseData.accounts || firebaseData.transactions)) {
              remotePayload = firebaseData;
              sourceName = "Firebase";
            }
          } catch (fErr) {
            console.warn("Firestore restore err:", fErr);
            if (!isSilent) showToast("Chưa kết nối được Firebase. Kiểm tra mạng rồi thử lại.", "error");
            return;
          }

          if (!remotePayload) {
            if (!isSilent) {
              showToast("Tài khoản này chưa có dữ liệu trên Firebase. Bấm \"Đồng bộ ngay\" ở máy đang có dữ liệu.", "info");
            }
            return;
          }

          const realData = remotePayload.data || remotePayload;
          const { accounts: rAcc, transactions: rTx, categories: rCat, categoryParentMap: rMap, debts: rDebts, theme: rTheme, categoryBudgets: rBudgets, monthlyBudget: rMonthlyBudget, reportSettings: rReportSettings } = realData;

          if (isSilent) {
            if (rTx && rAcc) {
              const remoteTime = new Date(remotePayload.timestamp || 0).getTime();
              const localTs = lastLocalEditTime.current || 0;
              const localData = { accounts, transactions, deletedTxIds: deletedTxIdsRef.current };
              const merged = localTs > remoteTime
                ? mergeFinancialData({ ...localData, categories, categoryParentMap, debts, categoryBudgets, monthlyBudget }, realData)
                : mergeFinancialData(realData, localData);
              const changed = JSON.stringify(merged.transactions) !== JSON.stringify(transactions) || JSON.stringify(merged.accounts) !== JSON.stringify(accounts) ||
                (localTs <= remoteTime && (JSON.stringify(rCat) !== JSON.stringify(categories) || JSON.stringify(rDebts) !== JSON.stringify(debts) || JSON.stringify(rBudgets || {}) !== JSON.stringify(categoryBudgets || {}) || (rMonthlyBudget || 0) !== (monthlyBudget || 0)));
              if (changed) {
                addDeletedTxIds(merged.deletedTxIds || []);
                const useRemoteMeta = localTs <= remoteTime;
                updateData(merged.accounts, merged.transactions, useRemoteMeta ? rCat : null, useRemoteMeta ? rDebts : null, useRemoteMeta ? (rMap || DEFAULT_CATEGORY_PARENT_MAP) : null, true, useRemoteMeta ? rBudgets : null, useRemoteMeta ? rMonthlyBudget : null, useRemoteMeta ? rReportSettings : null);
                if (useRemoteMeta && rTheme && THEMES[rTheme]) setTheme(rTheme);
                const timeFormatted = new Date().toLocaleString('vi-VN');
                setLastSyncTime(timeFormatted);
                setSyncStatusDetail(`⚡ Đã gộp dữ liệu từ thiết bị khác: ${merged.transactions.length} GD`);
                // Bản gộp có thêm dữ liệu cục bộ mà cloud chưa có -> đẩy lại cho các máy khác
                if (JSON.stringify(merged.transactions) !== JSON.stringify(rTx)) setTimeout(() => handleBackupToGoogle(true), 300);
              }
            }
          } else {
            deletedTxIdsRef.current = [];
            addDeletedTxIds(realData.deletedTxIds || []);
            updateData(rAcc, rTx, rCat, rDebts, rMap || DEFAULT_CATEGORY_PARENT_MAP, true, rBudgets, rMonthlyBudget, rReportSettings);
            if (rTheme && THEMES[rTheme]) setTheme(rTheme);
            const timeFormatted = new Date().toLocaleString('vi-VN');
            setLastSyncTime(timeFormatted);
            localStorage.setItem("vina_last_google_sync", timeFormatted);
            setSyncStatusDetail(`Đã khôi phục thành công ${rTx?.length || 0} giao dịch & ${rCat?.length || categories.length} hạng mục từ ${sourceName}`);
            showToast(`🟢 Khôi phục thành công ${rTx?.length || 0} giao dịch & toàn bộ báo cáo, hạng mục!`);
          }
        } catch (err) {
          if (!isSilent) showToast("Lỗi khôi phục: " + err.message, "error");
        } finally {
          if (!isSilent) setIsSyncing(false);
        }
      };

      useEffect(() => { googleUserRef.current = googleUser; }, [googleUser]);

      // Nguồn sự thật DUY NHẤT cho trạng thái đăng nhập Google: lắng nghe trực tiếp phiên đăng
      // nhập thật của Firebase (onAuthStateChanged), thay vì tự suy đoán qua localStorage.
      // Firebase tự khôi phục phiên cũ khi tải lại trang — nếu chỉ dựa vào state cục bộ, UI có
      // thể hiển thị "chưa đăng nhập" trong khi Firebase vẫn còn phiên cũ (và ngược lại), khiến
      // app đồng bộ nhầm dữ liệu của tài khoản khác.
      useEffect(() => {
        if (!(window.firebase && window.firebase.auth)) return;
        const unsubscribe = window.firebase.auth().onAuthStateChanged((fbUser) => {
          if (fbUser) {
            applyUserAccount({
              uid: fbUser.uid,
              email: (fbUser.email || "").trim().toLowerCase(),
              name: fbUser.displayName || (fbUser.email || "").split('@')[0],
              picture: fbUser.photoURL || null,
              hasPassword: fbUser.providerData.some(p => p.providerId === "password"),
              hasGoogle: fbUser.providerData.some(p => p.providerId === "google.com"),
              connectedAt: new Date().toISOString()
            });
          } else if (googleUserRef.current && googleUserRef.current.uid) {
            // Chỉ tài khoản đăng nhập Firebase thật (có uid) mới bị xoá dữ liệu ở đây —
            // tài khoản nhập email thủ công không có phiên Firebase nên không đi qua nhánh này.
            resetLocalFinancialData();
            setGoogleUser(null);
            localStorage.removeItem("vina_google_user");
          }
        });
        return () => unsubscribe();
      }, []);

      // Luôn trỏ tới bản mới nhất của handler để các listener (đăng ký 1 lần) không đọc state cũ.
      const restoreRef = React.useRef(null);
      restoreRef.current = handleRestoreFromGoogle;

      // Initial restore check
      useEffect(() => {
        handleRestoreFromGoogle(true);
      }, []);

      // Tải bản sao lưu khi applyUserAccount yêu cầu (đăng nhập / đổi tài khoản). Đặt trong 1
      // effect riêng (chạy lại mỗi khi restoreTrigger đổi) để luôn dùng đúng closure hiện tại
      // của handleRestoreFromGoogle, thay vì bị "đông cứng" nếu gọi trực tiếp từ trong listener
      // onAuthStateChanged (chỉ đăng ký 1 lần lúc mount).
      useEffect(() => {
        if (restoreTrigger === 0) return;
        const timer = setTimeout(() => restoreRef.current(true), 300);
        return () => clearTimeout(timer);
      }, [restoreTrigger]);

      // Đồng bộ đa thiết bị THỜI GIAN THỰC qua Firestore onSnapshot: tự cập nhật ngay khi
      // một thiết bị khác lưu dữ liệu mới lên cùng tài khoản Firebase, không cần polling.
      useEffect(() => {
        if (!autoCloudSync || !googleUser?.email) {
          setIsRealtimeLive(false);
          return;
        }
        const docRef = getUserBackupDocRef();
        if (!docRef) {
          setIsRealtimeLive(false);
          return;
        }

        const unsubscribe = docRef.onSnapshot((snap) => {
          setIsRealtimeLive(true);
          if (snap.metadata.hasPendingWrites) return; // bản ghi do chính máy này vừa gửi lên, bỏ qua
          if (Date.now() - (lastLocalEditTime.current || 0) < 3000) return; // vừa sửa cục bộ, bỏ qua vòng này
          if (snap.exists) restoreRef.current(true);
        }, (err) => {
          console.warn("Firestore realtime listener error:", err);
          setIsRealtimeLive(false);
        });

        return () => unsubscribe();
      }, [autoCloudSync, googleUser?.email]);

      // Auto-refresh when tab becomes active / window focused (e.g. switching back on mobile/PC)
      useEffect(() => {
        const onFocus = () => {
          if (autoCloudSync) {
            restoreRef.current(true);
          }
        };
        window.addEventListener("focus", onFocus);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") onFocus();
        });
        return () => {
          window.removeEventListener("focus", onFocus);
        };
      }, [autoCloudSync, googleUser?.email]);

      // Tự đẩy dữ liệu lên Firebase khi có thay đổi trên máy
      useEffect(() => {
        if (isApplyingRemoteUpdate.current) {
          // Received from remote or cross-tab, do not push back to prevent echo loop
          isApplyingRemoteUpdate.current = false;
          return;
        }

        // Lần chạy đầu khi mở app chưa phải thao tác của người dùng: không đẩy dữ liệu cũ trên máy
        // lên cloud và không đánh dấu "vừa sửa", để bản cloud mới hơn được kéo về trước.
        if (isFirstAutoPushRun.current) {
          isFirstAutoPushRun.current = false;
          return;
        }
        lastLocalEditTime.current = Date.now();
        if (!autoCloudSync) return;

        // Đẩy lên Firebase sau 800ms kể từ lần sửa cuối (gom nhiều thay đổi liên tiếp thành 1 lần ghi)
        if (!googleUser?.uid) return;
        const timer = setTimeout(() => {
          handleBackupToGoogle(true);
        }, 800);

        return () => clearTimeout(timer);
      }, [transactions, accounts, categories, debts, categoryParentMap, categoryBudgets, monthlyBudget, reportType, reportPeriod, reportHierarchyView, theme]);

      const handleExportJson = () => {
        const payload = buildFullBackupPayload();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `vinaspends_sao_luu_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Đã tải tệp sao lưu JSON đầy đủ về máy!");
      };

      const handleImportJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const d = parsed.data || parsed;
            if (d.accounts || d.transactions) {
              if (!confirm(`Nhập tệp sao lưu (${d.transactions?.length || 0} giao dịch) sẽ THAY THẾ dữ liệu hiện có trên máy. Tiếp tục?`)) return;
              updateData(
                d.accounts, 
                d.transactions, 
                d.categories, 
                d.debts, 
                d.categoryParentMap || DEFAULT_CATEGORY_PARENT_MAP,
                false,
                d.categoryBudgets,
                d.monthlyBudget,
                d.reportSettings
              );
              if (d.theme && THEMES[d.theme]) setTheme(d.theme);
              showToast(`Đã nhập ${d.transactions?.length || 0} giao dịch & hạng mục từ tệp JSON!`);
              if (googleUser?.uid) setTimeout(() => handleBackupToGoogle(true), 500);
            } else {
              showToast("Tệp không đúng định dạng dữ liệu VinaSpends!", "error");
            }
          } catch(err) {
            showToast("Lỗi đọc tệp JSON: " + err.message, "error");
          }
        };
        reader.readAsText(file);
      };

      // Calculate totals
      const totalOwned = accounts.reduce((sum, acc) => sum + (Number(acc.balance)||0), 0);
      const totalIncome = transactions.filter(t => t.type === "INCOME").reduce((sum, t) => sum + t.amount, 0);
      const totalExpense = transactions.filter(t => t.type === "EXPENSE").reduce((sum, t) => sum + t.amount, 0);
      const totalDebtLent = debts.filter(d => d.type === "CHO_VAY" && !d.isPaid).reduce((sum, d) => sum + d.amount, 0);
      const totalDebtBorrowed = debts.filter(d => d.type === "VAY" && !d.isPaid).reduce((sum, d) => sum + d.amount, 0);

      // Tháng này: thu, chi, so với ngân sách
      const monthStats = React.useMemo(() => {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth();
        let inc = 0, exp = 0, count = 0, maiCount = 0;
        transactions.forEach(t => {
          const d = new Date(t.date);
          if (d.getFullYear() === y && d.getMonth() === m) {
            count++;
            if (t.source === "mai") maiCount++;
            if (t.type === "INCOME") inc += Number(t.amount) || 0; else exp += Number(t.amount) || 0;
          }
        });
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        return { inc, exp, count, maiCount, net: inc - exp, dayOfMonth: now.getDate(), daysInMonth, label: `Tháng ${m + 1}/${y}` };
      }, [transactions]);

      // Giao dịch gần đây, nhóm theo ngày
      const recentGroups = React.useMemo(() => {
        const sorted = transactions.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 20);
        const groups = [];
        const keyOf = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
        const today = new Date(); const yest = new Date(Date.now() - 86400000);
        sorted.forEach(t => {
          const d = new Date(t.date);
          const k = keyOf(d);
          let g = groups.find(x => x.key === k);
          if (!g) {
            const label = k === keyOf(today) ? "Hôm nay" : k === keyOf(yest) ? "Hôm qua" : d.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit' });
            g = { key: k, label, items: [], net: 0 };
            groups.push(g);
          }
          g.items.push(t);
          g.net += t.type === "INCOME" ? t.amount : -t.amount;
        });
        return groups;
      }, [transactions]);

      const baseReportTxs = React.useMemo(() => {
        return transactions.filter(t => {
           if (reportAccount !== "Tất cả" && t.bankName !== reportAccount) return false;
           if (reportSearch && !t.note.toLowerCase().includes(reportSearch.toLowerCase()) && !t.category.toLowerCase().includes(reportSearch.toLowerCase())) return false;
           
           const d = new Date(t.date);
           const key = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
           if (reportPeriod === "Tháng" && key.slice(0, 7) !== reportMonth) return false;
           if (reportPeriod === "Năm" && d.getFullYear() !== Number(reportYear)) return false;
           if (reportPeriod === "Ngày") {
             if (reportFrom && key < reportFrom) return false;
             if (reportTo && key > reportTo) return false;
           }
           
           return true;
        });
      }, [transactions, reportPeriod, reportAccount, reportSearch, reportDay, reportMonth, reportYear, reportFrom, reportTo]);

      const reportSummary = React.useMemo(() => {
        let income = 0;
        let expense = 0;
        baseReportTxs.forEach(t => {
            if (t.type === "INCOME") income += t.amount;
            if (t.type === "EXPENSE") expense += t.amount;
        });
        return { income, expense, net: income - expense };
      }, [baseReportTxs]);

      const reportTxs = React.useMemo(() => {
        return baseReportTxs.filter(t => {
           if (reportType === "Chi tiêu" && t.type !== "EXPENSE") return false;
           if (reportType === "Thu nhập" && t.type !== "INCOME") return false;
           return true;
        });
      }, [baseReportTxs, reportType]);

      const reportTotal = reportTxs.reduce((sum, t) => sum + t.amount, 0);

      // Parent Category Level Breakdown
      const parentBreakdown = React.useMemo(() => {
         const groups = {};
         const counts = {};
         reportTxs.forEach(t => {
            const pName = getParentNameForCategory(t.category);
            groups[pName] = (groups[pName] || 0) + t.amount;
            counts[pName] = (counts[pName] || 0) + 1;
         });
         return Object.entries(groups).map(([category, amount]) => ({
            category,
            amount,
            txCount: counts[category] || 0,
            color: getColorForCategoryName(category),
            icon: getIconForCategoryName(category)
         })).sort((a,b) => b.amount - a.amount);
      }, [reportTxs, categoryParentMap, categories]);

      // Child / Granular Category Level Breakdown
      const childBreakdown = React.useMemo(() => {
         const groups = {};
         const counts = {};
         reportTxs.forEach(t => {
            groups[t.category] = (groups[t.category] || 0) + t.amount;
            counts[t.category] = (counts[t.category] || 0) + 1;
         });
         return Object.entries(groups).map(([category, amount]) => ({
            category,
            parent: getParentNameForCategory(category),
            amount,
            txCount: counts[category] || 0,
            color: getColorForCategoryName(category),
            icon: getIconForCategoryName(category)
         })).sort((a,b) => b.amount - a.amount);
      }, [reportTxs, categoryParentMap, categories]);

      // Stacked bar chart data (columns = time buckets, colors = categories)
      const reportBarData = React.useMemo(() => {
         const catOf = (t) => reportHierarchyView === "parent" ? getParentNameForCategory(t.category) : t.category;
         const keyOf = (t) => { const d = new Date(t.date); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
         let mode = "category";
         let buckets = [];
         const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000) + 1;
         if (reportPeriod === "Năm") {
            mode = "month";
            for (let m = 1; m <= 12; m++) buckets.push({ key: `${reportYear}-${pad2(m)}`, label: `T${m}` });
         } else if (reportPeriod === "Tháng") {
            mode = "day";
            const [y, m] = reportMonth.split("-").map(Number);
            const n = new Date(y, m, 0).getDate();
            for (let d = 1; d <= n; d++) buckets.push({ key: `${reportMonth}-${pad2(d)}`, label: String(d) });
         } else if (reportPeriod === "Ngày" && reportFrom && reportTo && reportFrom <= reportTo) {
            const n = daysBetween(reportFrom, reportTo);
            if (n <= 62) {
               mode = "day";
               const start = new Date(reportFrom);
               for (let i = 0; i < n; i++) {
                  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                  buckets.push({ key: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`, label: `${d.getDate()}/${d.getMonth()+1}` });
               }
            } else {
               mode = "month";
               const start = new Date(reportFrom), end = new Date(reportTo);
               let y = start.getFullYear(), m = start.getMonth();
               while (y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth())) {
                  buckets.push({ key: `${y}-${pad2(m+1)}`, label: `${m+1}/${String(y).slice(2)}` });
                  m++; if (m > 11) { m = 0; y++; }
               }
            }
         }
         const catTotals = {};
         reportTxs.forEach(t => { const c = catOf(t); catTotals[c] = (catTotals[c] || 0) + t.amount; });
         const legend = Object.entries(catTotals).sort((a,b) => b[1] - a[1]).map(([name, amount]) => ({ name, amount, color: getColorForCategoryName(name) }));
         if (mode === "category") {
            const columns = legend.map(l => ({ label: l.name, total: l.amount, segments: [{ name: l.name, amount: l.amount, color: l.color }] }));
            return { mode, columns, legend, max: Math.max(0, ...columns.map(c => c.total)) };
         }
         const idx = {};
         buckets.forEach((b, i) => { idx[b.key] = i; b.segs = {}; b.total = 0; });
         reportTxs.forEach(t => {
            const k = mode === "month" ? keyOf(t).slice(0, 7) : keyOf(t);
            const b = buckets[idx[k]];
            if (!b) return;
            const c = catOf(t);
            b.segs[c] = (b.segs[c] || 0) + t.amount;
            b.total += t.amount;
         });
         const columns = buckets.map(b => ({
            label: b.label, total: b.total,
            segments: legend.filter(l => b.segs[l.name]).map(l => ({ name: l.name, amount: b.segs[l.name], color: l.color }))
         }));
         return { mode, columns, legend, max: Math.max(0, ...columns.map(c => c.total)) };
      }, [reportTxs, reportPeriod, reportMonth, reportYear, reportFrom, reportTo, reportHierarchyView, categoryParentMap, categories]);

      // Drill-down Breakdown for a selected Parent Category
      const drillDownData = React.useMemo(() => {
         if (!drillDownParent) return null;
         const txs = reportTxs.filter(t => getParentNameForCategory(t.category) === drillDownParent);
         const total = txs.reduce((sum, t) => sum + t.amount, 0);
         const groups = {};
         const counts = {};
         txs.forEach(t => {
            groups[t.category] = (groups[t.category] || 0) + t.amount;
            counts[t.category] = (counts[t.category] || 0) + 1;
         });
         const breakdown = Object.entries(groups).map(([subCat, amount]) => ({
            category: subCat,
            amount,
            txCount: counts[subCat] || 0,
            color: getColorForCategoryName(subCat),
            icon: getIconForCategoryName(subCat)
         })).sort((a,b) => b.amount - a.amount);

         return {
           parentName: drillDownParent,
           parentIcon: getIconForCategoryName(drillDownParent),
           parentColor: getColorForCategoryName(drillDownParent),
           total,
           percentageOfPeriod: reportTotal > 0 ? (total / reportTotal * 100).toFixed(1) : 0,
           txs,
           breakdown
         };
      }, [drillDownParent, reportTxs, reportTotal, categoryParentMap, categories]);

      // Category selected for Add Tx (filtered)
      const filteredCategoriesForTx = React.useMemo(() => {
         if (txParentFilter === "Tất cả") {
           const subs = categories.filter(c => !c.isParent);
           // Include standalone parent categories that have no subcategories
           const standaloneParents = categories.filter(c => c.isParent && !categories.some(sub => !sub.isParent && (sub.parent === c.name || categoryParentMap[sub.name] === c.name)));
           return [...subs, ...standaloneParents];
         }

         const matchedChildren = categories.filter(c => !c.isParent && (c.parent === txParentFilter || categoryParentMap[c.name] === txParentFilter));
         const matchedParent = categories.find(c => c.name === txParentFilter);

         if (matchedChildren.length > 0) {
           if (matchedParent) {
             return [
               { id: `p_choice_${matchedParent.id}`, name: matchedParent.name, icon: matchedParent.icon, color: matchedParent.color },
               ...matchedChildren
             ];
           }
           return matchedChildren;
         }

         if (matchedParent) {
           return [{ id: matchedParent.id, name: matchedParent.name, icon: matchedParent.icon, color: matchedParent.color }];
         }

         return categories;
      }, [categories, txParentFilter, categoryParentMap]);

      const handleScanBill = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsOcrScanning(true);
        showToast("Đang phân tích ảnh giao dịch...", "info");
        try {
          if (!window.Tesseract) throw new Error("Chưa tải xong thư viện OCR");
          const ocrOpts = window.VINA_OFFLINE_OCR ? { ...window.VINA_OFFLINE_OCR, logger: () => {} } : { logger: () => {} };
          const result = await window.Tesseract.recognize(file, 'vie+eng', ocrOpts);
          const text = result.data.text;
          // Ưu tiên bộ đọc của Mai: hiểu được ảnh chụp thông báo/biên lai của hầu hết ngân hàng & ví
          const maiR = window.MaiAgent ? window.MaiAgent.parse(text, maiOpts()) : null;
          if (maiR && maiR.ok) {
            setIsAddTxModalOpen(false);
            const m = maiMatchAccount(maiR, accounts);
            setMaiDraft({ ...maiR, category: maiResolveCategory(maiR.category, maiR.type, categories), bankName: m ? m.name : (maiR.bank ? null : accounts[0]?.name), inboxId: null });
            showToast("Mai đã đọc xong ảnh, anh kiểm tra lại nhé", "info");
            return;
          }
          
          let amount = 0;
          let type = "EXPENSE"; // Default
          let note = "";
          
          // Pattern matching
          const amountRegex = /(?:VND|đ|vnđ|\$)\s*([\d\.,]+)|([\d\.,]+)\s*(?:VND|đ|vnđ)/i;
          const matchAmount = text.match(amountRegex);
          if (matchAmount) {
             const rawStr = matchAmount[1] || matchAmount[2];
             amount = parseInt(rawStr.replace(/[^\d]/g, ''), 10);
          } else {
             const rawNums = text.match(/\b\d{1,3}(?:[.,]\d{3})+\b/g);
             if (rawNums && rawNums.length > 0) {
                // Find largest number, often amount
                const nums = rawNums.map(n => parseInt(n.replace(/[^\d]/g, ''), 10));
                amount = Math.max(...nums);
             }
          }
          
          const lowerText = text.toLowerCase();
          if (lowerText.includes("nhận tiền") || lowerText.includes("cộng") || text.includes("+") || lowerText.includes("chuyển đến") || lowerText.includes("thu nhập")) {
             type = "INCOME";
          } else if (lowerText.includes("chuyển tiền") || lowerText.includes("thanh toán") || lowerText.includes("trừ") || text.includes("-") || lowerText.includes("chuyển đi")) {
             type = "EXPENSE";
          }
          
          const lines = text.split('\n');
          for (let i = 0; i < lines.length; i++) {
             const line = lines[i].toLowerCase();
             if (line.includes("nội dung") || line.includes("lời nhắn") || line.includes("thông điệp")) {
                note = lines[i].replace(/^.*(nội dung|lời nhắn|thông điệp)[\s:]*/i, '').trim();
                if (!note && i + 1 < lines.length) note = lines[i+1].trim();
                break;
             }
          }
          
          const form = document.getElementById("addTxForm");
          if (form) {
             if (form.type) form.type.value = type;
             const radios = form.querySelectorAll('input[name="type"]');
             radios.forEach(r => r.checked = (r.value === type));

             if (form.amount) {
                form.amount.value = amount ? amount.toString() : "";
                const visibleAmountInput = document.getElementById("amountVisibleInput");
                if (visibleAmountInput) {
                   visibleAmountInput.value = amount ? new Intl.NumberFormat('en-US').format(amount) : "";
                   const tracker = visibleAmountInput._valueTracker;
                   if (tracker) tracker.setValue("");
                   visibleAmountInput.dispatchEvent(new Event('input', { bubbles: true }));
                }
             }
             if (form.note) {
                form.note.value = note || "Quét từ ảnh chụp";
                const tracker = form.note._valueTracker;
                if (tracker) tracker.setValue("");
                form.note.dispatchEvent(new Event('input', { bubbles: true }));
             }
          }
          showToast("Đã trích xuất dữ liệu từ ảnh!", "success");
        } catch (err) {
          console.error(err);
          showToast("Lỗi phân tích: " + err.message, "error");
        } finally {
          setIsOcrScanning(false);
          if (ocrFileInputRef.current) ocrFileInputRef.current.value = "";
        }
      };

      const handleAddTx = (e) => {
        e.preventDefault();
        let txDate = new Date();
        const dv = e.target.date && e.target.date.value;
        if (dv && dv !== todayKey()) { const [y, m, d] = dv.split("-").map(Number); txDate = new Date(y, m - 1, d, txDate.getHours(), txDate.getMinutes()); }
        const tx = { id: Date.now(), type: e.target.type.value, amount: Number(e.target.amount.value) || 0, category: e.target.category.value, bankName: e.target.bankName.value, note: e.target.note.value, date: txDate.toISOString(), updatedAt: Date.now() };
        if (!(tx.amount > 0)) { showToast("Vui lòng nhập số tiền", "error"); return; }
        const newTx = [tx, ...transactions];
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? tx.amount : -tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
        if (tx.note && tx.category) maiTeach([{ text: tx.note, category: tx.category, type: tx.type, weight: 1 }]);
        setIsAddTxModalOpen(false);
        setAddTxHint(null);
      };

      // Gợi ý hạng mục khi gõ ghi chú (dựa trên thói quen Mai đã học)
      const [addTxHint, setAddTxHint] = useState(null);
      useEffect(() => { if (!isAddTxModalOpen) setAddTxHint(null); }, [isAddTxModalOpen]);
      const suggestFromNote = (note) => {
        if (!window.MaiAgent || !maiBrain || !note || note.trim().length < 2) { setAddTxHint(null); return; }
        const type = document.querySelector('#addTxForm input[name="type"]:checked')?.value || "EXPENSE";
        const p = window.MaiAgent.predictCategory(maiBrain, note, type, window.MaiAgent.memoryKey(null, note))
          || (maiSettings.community && maiCommunity ? window.MaiAgent.predictCommunity(maiCommunity, note, type) : null);
        setAddTxHint(p && categories.some(c => c && c.name === p.category) ? p.category : null);
      };
      const applyAddTxHint = () => {
        if (!addTxHint) return;
        setTxParentFilter("Tất cả");
        setTimeout(() => {
          const el = Array.from(document.querySelectorAll('#addTxForm input[name="category"]')).find(i => i.value === addTxHint);
          if (el) { el.click(); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
        }, 50);
      };

      const handleUpdateTx = (e) => {
        e.preventDefault();
        if (!editingTx) return;
        const form = e.target;
        const newType = form.type.value;
        const newAmount = Number(form.amount.value) || 0;
        // Không bắt buộc chọn lại hạng mục: nếu hạng mục cũ không nằm trong nhóm đang lọc thì giữ nguyên
        const newCategory = (form.category && form.category.value) || editingTx.category;
        const newBankName = form.bankName.value;
        const newNote = form.note.value;
        const newDateVal = form.date ? form.date.value : null;
        // Giữ nguyên giờ trong ngày, chỉ đổi ngày theo lịch địa phương (tránh lệch múi giờ)
        let newDate = editingTx.date;
        if (newDateVal) {
          const [y, m, d] = newDateVal.split("-").map(Number);
          const old = new Date(editingTx.date);
          const base = isNaN(old) ? new Date() : old;
          newDate = new Date(y, m - 1, d, base.getHours(), base.getMinutes(), base.getSeconds()).toISOString();
        }

        const updatedTx = {
          ...editingTx,
          type: newType,
          amount: newAmount,
          category: newCategory,
          bankName: newBankName,
          note: newNote,
          date: newDate,
          updatedAt: Date.now()
        };

        // Reconcile bank balances: Revert old tx, then apply updated tx
        let newAcc = accounts.map(a => {
          let bal = a.balance;
          if (a.name === editingTx.bankName) {
            bal += (editingTx.type === "INCOME" ? -editingTx.amount : editingTx.amount);
          }
          return { ...a, balance: bal };
        });

        newAcc = newAcc.map(a => {
          let bal = a.balance;
          if (a.name === updatedTx.bankName) {
            bal += (updatedTx.type === "INCOME" ? updatedTx.amount : -updatedTx.amount);
          }
          return { ...a, balance: bal };
        });

        const newTx = transactions.map(t => t.id === editingTx.id ? updatedTx : t);
        // Mai học: người dùng sửa hạng mục của giao dịch Mai ghi -> lần sau gặp lại sẽ phân loại đúng
        // Mai học khi anh chấn chỉnh: đổi hạng mục (mọi giao dịch có ghi chú) hoặc đổi Thu/Chi của giao dịch Mai ghi
        const catChanged = newCategory !== editingTx.category, typeChanged = newType !== editingTx.type;
        if (window.MaiAgent && (catChanged || (typeChanged && editingTx.source === "mai")) && (newNote || editingTx.maiKey)) {
          maiTeach([{ text: newNote || editingTx.maiKey, key: editingTx.maiKey || window.MaiAgent.memoryKey(null, newNote), category: catChanged ? newCategory : null,
            type: newType, weight: 3, typeFix: typeChanged && editingTx.source === "mai" ? newType : null }]);
          if (catChanged) showToast(`Mai đã ghi nhớ: "${(newNote || editingTx.maiKey || "").slice(0, 30)}" → ${newCategory}`, "info");
        }
        updateData(newAcc, newTx, null, null);
        setEditingTx(null);
        showToast("Đã cập nhật giao dịch thành công!");
      };

      const handleStartEditTx = (tx) => {
        setEditingTx(tx);
        const parent = categoryParentMap[tx.category] || categories.find(c => c.name === tx.category)?.parent;
        if (parent) {
          setTxParentFilter(parent);
        } else {
          setTxParentFilter("Tất cả");
        }
      };

      const handleDeleteTx = (id) => {
        if(!confirm("Xóa giao dịch này?")) return;
        const tx = transactions.find(t => t.id === id);
        addDeletedTxIds([id]);
        const newTx = transactions.filter(t => t.id !== id);
        const newAcc = accounts.map(a => a.name === tx.bankName ? { ...a, balance: a.balance + (tx.type==="INCOME" ? -tx.amount : tx.amount) } : a);
        updateData(newAcc, newTx, null, null);
      };

      const handleAddDebt = (e) => {
        e.preventDefault();
        const d = { id: Date.now(), title: e.target.title.value, type: e.target.type.value, amount: Number(e.target.amount.value) || 0, note: e.target.note.value, date: new Date().toISOString(), isPaid: false };
        updateData(null, null, null, [d, ...debts]);
      };

      const handleToggleDebt = (id) => {
        updateData(null, null, null, debts.map(d => d.id === id ? {...d, isPaid: !d.isPaid} : d));
      };
      
      const handleDeleteDebt = (id) => {
        if(confirm("Xóa khoản nợ này?")) updateData(null, null, null, debts.filter(d => d.id !== id));
      };

      const handleAddCategory = (payload) => {
        let catName, catIcon, catColor, isChild, parentName;
        if (payload && payload.preventDefault) {
          payload.preventDefault();
          catName = payload.target.catName?.value?.trim() || "";
          catIcon = payload.target.catIcon?.value || "tag";
          catColor = payload.target.catColor?.value || "#2F6F6A";
          isChild = payload.target.isChildCategory ? payload.target.isChildCategory.checked : false;
          parentName = isChild ? (payload.target.parentCategorySelect?.value || newCategoryParent || parentCategories[0]?.name || "Khác") : null;
        } else if (payload && typeof payload === 'object') {
          catName = payload.name?.trim() || "";
          catIcon = payload.icon || "tag";
          catColor = payload.color || "#2F6F6A";
          isChild = !!payload.isChild;
          parentName = isChild ? (payload.parent || newCategoryParent || parentCategories[0]?.name || "Khác") : null;
        }

        if (!catName) {
          showToast("Vui lòng nhập tên hạng mục!", "error");
          return;
        }
        
        const normName = catName.toLowerCase();
        let updatedCategories;
        const newMap = { ...categoryParentMap };

        if (editingCategory) {
            const oldName = editingCategory.name;
            delete newMap[oldName];
            delete newMap[oldName.toLowerCase()];

            updatedCategories = categories.map(c => {
              if (c.id === editingCategory.id || c.name.toLowerCase() === oldName.toLowerCase()) {
                return { 
                  ...c, 
                  name: catName, 
                  icon: catIcon, 
                  color: catColor,
                  isParent: !isChild,
                  parent: isChild ? parentName : null
                };
              }
              // If editing a parent category name, update children pointing to it
              if (editingCategory.isParent && c.parent === oldName) {
                return { ...c, parent: catName };
              }
              return c;
            });

            if (editingCategory.isParent) {
              Object.keys(newMap).forEach(k => {
                if (newMap[k] === oldName) newMap[k] = catName;
              });
            }

            if (isChild && parentName) {
              newMap[catName] = parentName;
            } else {
              delete newMap[catName];
            }
            showToast(`Đã cập nhật danh mục: ${catName}`);
        } else {
            // Check if category with this name already exists
            const existingIdx = categories.findIndex(c => c.name.toLowerCase() === normName);
            const newCat = { 
              id: `c_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`, 
              name: catName, 
              icon: catIcon, 
              color: catColor,
              isParent: !isChild,
              parent: isChild ? parentName : null
            };

            if (existingIdx !== -1) {
              // Replace existing entry cleanly to avoid duplicates
              updatedCategories = categories.map((c, i) => i === existingIdx ? newCat : c);
            } else {
              updatedCategories = [...categories, newCat];
            }

            if (isChild && parentName) {
              newMap[catName] = parentName;
            } else {
              delete newMap[catName];
            }
            showToast(`Đã thêm danh mục: ${catName}`);
        }

        const sanitizedList = deduplicateCategories(updatedCategories);
        updateData(null, null, sanitizedList, null, newMap);
        setIsCategoryModalOpen(false);
        setEditingCategory(null);
        setNewCategoryParent("");
      };

      const handleDeleteCategory = (cat) => {
        if (!confirm(`Bạn có chắc muốn xóa hạng mục "${cat.name}"?`)) return;
        const normName = cat.name.trim().toLowerCase();
        
        // Filter out by ID and by normalized name to eliminate any duplicates
        const updated = categories.filter(c => c.id !== cat.id && c.name.trim().toLowerCase() !== normName);
        const newMap = { ...categoryParentMap };
        delete newMap[cat.name];
        delete newMap[normName];
        Object.keys(newMap).forEach(k => {
          if (k.toLowerCase() === normName) delete newMap[k];
        });

        // If deleting a parent category, disassociate its children
        if (cat.isParent) {
          Object.keys(newMap).forEach(k => {
            if (newMap[k] === cat.name || newMap[k]?.toLowerCase() === normName) {
              delete newMap[k];
            }
          });
        }
        updateData(null, null, updated, null, newMap);
        showToast(`Đã xóa hạng mục: ${cat.name}`);
      };

      const handleResetCategories = () => {
        if (!confirm("Khôi phục danh mục về bộ danh mục chuẩn (11 danh mục lớn, 36 danh mục chi tiêu con)? Dữ liệu giao dịch cũ vẫn được giữ nguyên.")) return;
        updateData(null, null, [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES], null, DEFAULT_CATEGORY_PARENT_MAP);
        showToast("Đã khôi phục cây danh mục chuẩn thành công!");
      };

      const handleAddBank = (e) => {
        e.preventDefault();
        const bName = bankNameType === "preset" ? e.target.bankName.value : e.target.customBankName.value;
        const acctNo = e.target.accountNo.value || "N/A";
        if (editingBank) {
            const updated = accounts.map(a => a.id === editingBank.id ? { ...a, name: bName, balance: Number(e.target.balance.value) || 0, accountNo: acctNo } : a);
            updateData(updated, null, null, null);
        } else {
            const b = { id: Date.now(), name: bName, balance: Number(e.target.balance.value) || 0, accountNo: acctNo };
            updateData([...accounts, b], null, null, null);
        }
        setIsAddBankModalOpen(false);
        setEditingBank(null);
      };

      // Tab Definitions
      const TABS = [
        { id: "overview", icon: "home", label: "Tổng quan" },
        { id: "report", icon: "bar-chart-3", label: "Báo cáo" },
        { id: "mai", icon: "flower-2", label: "Mai" },
        { id: "category", icon: "tags", label: "Hạng mục" },
        { id: "wallet_ai", icon: "wallet", label: "Ví & Nợ" }
      ];
      const maiBadge = maiInbox.length;

      return (
        <div className="flex flex-col h-screen md:flex-row font-sans">
          
          {/* TOAST NOTIFICATION */}
          {syncMessage && (
            <div className="fixed left-1/2 z-[60] toast-in w-[calc(100%-32px)] max-w-md" style={{ top: "calc(var(--safe-top) + 12px)" }}>
              <div className={`px-4 py-3 rounded-2xl flex items-center gap-3 border-2 border-retro-ink shadow-[4px_4px_0_#3A2618] ${syncMessage.type === 'error' ? 'bg-[#F4D9C8] text-[#7A2410]' : syncMessage.type === 'info' ? 'bg-[#F6E3B0] text-[#3A2618]' : 'bg-[#E3E8C6] text-[#2F3D12]'}`}>
                <Icon name={syncMessage.type === 'error' ? 'alert-circle' : syncMessage.type === 'info' ? 'info' : 'check-circle-2'} className="w-5 h-5" />
                <span className="text-sm font-semibold leading-snug">{syncMessage.text}</span>
              </div>
            </div>
          )}

          {/* HEADER MOBILE */}
          <header className="md:hidden bg-theme-background/95 backdrop-blur pt-safe sticky top-0 z-20">
            <div className="h-1.5 retro-stripes-h" />
            <div className="px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-full bg-retro-mustard border-2 border-retro-ink flex items-center justify-center shadow-[2px_2px_0_#3A2618]">
                  <Icon name="sun" className="w-5 h-5 text-retro-ink" />
                </div>
                <div className="leading-tight">
                  <h1 className="font-display font-black text-[22px] text-theme-textPrimary">VinaSpends</h1>
                  <p className="text-[11px] font-semibold text-theme-textSecondary">{new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit' })}</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button
                  onClick={()=>setShowSettingsDialog(true)}
                  aria-label="Đồng bộ dữ liệu"
                  className={`flex items-center gap-1.5 h-9 px-3 rounded-full border-2 text-xs font-bold ${googleUser ? 'border-retro-ink bg-theme-surface text-theme-textPrimary' : 'border-theme-border bg-theme-variant text-theme-textSecondary'}`}>
                  <Icon name={isSyncing ? "refresh-cw" : googleUser ? (isRealtimeLive ? "zap" : "cloud") : "cloud-off"} className={`w-3.5 h-3.5 ${isSyncing ? "animate-spin" : ""}`} />
                  <span>{googleUser ? (isRealtimeLive ? 'Live' : 'Đã lưu') : 'Offline'}</span>
                </button>
                <button onClick={()=>setShowSettingsDialog(true)} aria-label="Cài đặt" className="w-9 h-9 rounded-full flex items-center justify-center text-theme-textPrimary hover:bg-theme-variant"><Icon name="settings" className="w-5 h-5" /></button>
              </div>
            </div>
          </header>

          {/* SIDEBAR DESKTOP */}
          <aside className="hidden md:flex w-64 bg-theme-surface border-r-2 border-retro-ink/80 flex-col p-4 z-10 relative overflow-hidden">
             <div className="absolute left-0 top-0 bottom-0 w-1.5 retro-stripes" />
             <div className="flex items-center justify-between mb-6 px-2">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-retro-mustard border-2 border-retro-ink flex items-center justify-center shadow-[2px_2px_0_#3A2618]">
                    <Icon name="sun" className="w-5 h-5 text-retro-ink" />
                  </div>
                  <h1 className="font-display font-black text-2xl text-theme-textPrimary">VinaSpends</h1>
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>setShowSettingsDialog(true)} aria-label="Cài đặt" className="text-theme-textSecondary hover:text-theme-primary"><Icon name="settings" className="w-4 h-4" /></button>
                </div>
            </div>

            <button onClick={()=>setShowSettingsDialog(true)} className="mb-6 p-3 rounded-2xl bg-theme-background border-2 border-theme-border text-left flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-full bg-theme-variant flex items-center justify-center text-theme-primary shrink-0">
                <Icon name={googleUser ? (isRealtimeLive ? "zap" : "cloud") : "cloud-off"} className={`w-4 h-4 ${isSyncing ? "animate-spin" : ""}`} />
              </div>
              <div className="flex-1 overflow-hidden">
                <p className="text-xs font-bold text-theme-textPrimary truncate">{googleUser?.email?.split('@')[0] || "Chưa đăng nhập"}</p>
                <p className="text-[11px] font-medium text-theme-textSecondary truncate">{googleUser ? (isRealtimeLive ? 'Đang đồng bộ trực tiếp' : (lastSyncTime ? `Đồng bộ lúc ${lastSyncTime.split(' ')[1] || ''}` : 'Tự động sao lưu')) : 'Dữ liệu chỉ lưu trên máy'}</p>
              </div>
            </button>

            <nav className="flex-1 space-y-2">
              {TABS.map(t => (
                <button key={t.id} onClick={()=>setActiveTab(t.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-2xl font-bold transition-all ${activeTab===t.id ? 'bg-theme-primary text-white' : 'text-theme-textSecondary hover:bg-theme-variant hover:text-theme-textPrimary'}`}>
                  {t.id === "mai" ? <MaiAvatar size={22} /> : <Icon name={t.icon} className="w-5 h-5" />}
                  <span className="flex-1 text-left">{t.label}</span>
                  {t.id === "mai" && maiBadge > 0 && <span className="min-w-[20px] h-5 px-1.5 rounded-full bg-retro-mustard text-retro-ink border border-retro-ink text-[11px] font-black flex items-center justify-center">{maiBadge}</span>}
                </button>
              ))}
            </nav>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 overflow-y-auto no-scrollbar px-4 pt-3 pb-32 md:p-8 bg-theme-background relative">
            
            {/* TAB: TỔNG QUAN */}
            {activeTab === "overview" && (
              <div className="max-w-3xl mx-auto space-y-5">
                {/* VÉ TÀI SẢN – thẻ chính */}
                <section className="retro-card rounded-[26px] overflow-hidden bg-theme-surface relative">
                  <div className="retro-hero relative bg-theme-primary text-white px-5 pt-5 pb-14 overflow-hidden">
                    <div className="absolute inset-0 retro-sunburst opacity-90" />
                    <div className="absolute -right-10 -bottom-24 w-56 h-56 rounded-full border-[14px] border-retro-mustard/90" />
                    <div className="absolute -right-10 -bottom-24 w-56 h-56 rounded-full border-[14px] border-transparent" style={{ boxShadow: "0 0 0 14px #D9822B, 0 0 0 28px #8E3B1B" }} />
                    <div className="relative">
                      <p className="text-[12px] font-bold uppercase tracking-[0.18em] text-white/85">Tài sản ròng</p>
                      <h2 className="font-display font-black text-[38px] md:text-5xl leading-none mt-2 tabular">{formatVND(totalOwned - totalDebtBorrowed)}</h2>
                      <p className="text-[12px] font-semibold text-white/85 mt-2">{accounts.length} ví · {formatVND(totalOwned)} đang có{totalDebtBorrowed > 0 ? ` · nợ ${formatVND(totalDebtBorrowed)}` : ""}</p>
                    </div>
                  </div>
                  {/* Thống kê tháng – nổi lên trên dải màu */}
                  <div className="relative -mt-9 mx-4 mb-4 bg-theme-surface rounded-2xl border-2 border-retro-ink/85 p-4">
                    <div className="flex items-center justify-between mb-3">
                      <p className="text-xs font-bold uppercase tracking-wider text-theme-textSecondary">{monthStats.label}</p>
                      {monthStats.maiCount > 0 && <p className="text-[11px] font-semibold text-theme-textSecondary flex items-center gap-1"><MaiAvatar size={14} /> Mai ghi {monthStats.maiCount}/{monthStats.count}</p>}
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <p className="text-[11px] font-semibold text-theme-textSecondary">Thu</p>
                        <p className="font-display font-extrabold text-[19px] text-[var(--income)] tabular leading-tight" title={formatVND(monthStats.inc)}>{formatShortVND(monthStats.inc)}</p>
                      </div>
                      <div>
                        <p className="text-[11px] font-semibold text-theme-textSecondary">Chi</p>
                        <p className="font-display font-extrabold text-[19px] text-[var(--expense)] tabular leading-tight" title={formatVND(monthStats.exp)}>{formatShortVND(monthStats.exp)}</p>
                      </div>
                      <div>
                        <p className="text-[11px] font-semibold text-theme-textSecondary">Còn lại</p>
                        <p className={`font-display font-extrabold text-[19px] tabular leading-tight ${monthStats.net >= 0 ? 'text-theme-textPrimary' : 'text-[var(--expense)]'}`}>{formatShortVND(monthStats.net)}</p>
                      </div>
                    </div>
                    {monthlyBudget > 0 && (() => {
                      const pct = Math.min(100, Math.round(monthStats.exp / monthlyBudget * 100));
                      const timePct = Math.round(monthStats.dayOfMonth / monthStats.daysInMonth * 100);
                      return (

                            type="button"
                            onClick={() => setEditingBudgetCat(p.name)}
                            className="p-2.5 bg-theme-background border border-theme-border hover:border-theme-primary rounded-xl text-left flex items-center justify-between group transition-all">
                            <div className="flex items-center gap-2 truncate">
                              <Icon name={p.icon} className="w-5 h-5" style={{ color: p.color }} />
                              <span className="text-xs font-bold text-theme-textPrimary truncate">{p.name}</span>
                            </div>
                            <span className="text-[10px] text-theme-primary font-bold opacity-0 group-hover:opacity-100 transition-opacity">Đặt</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("VinaSpends Error Caught:", error, errorInfo);
      }
      handleReset() {
        localStorage.removeItem("vina_theme");
        localStorage.removeItem("vina_category_parent_map");
        window.location.reload();
      }
      handleFullReset() {
        if (confirm("Thao tác này sẽ xoá cấu hình lỗi cục bộ và tải lại ứng dụng. Bạn có chắc không?")) {
          localStorage.clear();
          window.location.reload();
        }
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#F2E6CC] text-[#3A2618] flex items-center justify-center p-6 font-sans">
              <div className="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl border border-[#3A2618] text-center space-y-4">
                <div className="w-16 h-16 bg-[var(--income)] text-[var(--income)] rounded-2xl flex items-center justify-center mx-auto">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
                <h2 className="text-xl font-bold text-[#6B4F3A]">Khôi phục Ứng dụng VinaSpends</h2>
                <p className="text-xs text-[#6B4F3A]">
                  Đã xảy ra sự cố khi tải giao diện. Nhấn nút bên dưới để đặt lại giao diện sáng và tiếp tục sử dụng:
                </p>
                {this.state.error && (
                  <div className="p-3 bg-[var(--expense)] text-[var(--expense)] text-[11px] rounded-xl text-left font-mono break-all max-h-24 overflow-y-auto">
                    {this.state.error.toString()}
                  </div>
                )}
                <div className="space-y-2 pt-2">
                  <button 
                    onClick={() => this.handleReset()} 
                    className="w-full py-3 bg-[var(--income)] text-white font-bold rounded-xl text-sm shadow-md hover:bg-[var(--income)] active:scale-95 transition-all">
                    Đặt lại Giao diện & Tải lại
                  </button>
                  <button 
                    onClick={() => window.location.reload()} 
                    className="w-full py-2.5 bg-[#EBDDBE] text-[#6B4F3A] font-semibold rounded-xl text-xs hover:bg-[#EBDDBE]">
                    Thử tải lại ngay
                  </button>
                  <button 
                    onClick={() => this.handleFullReset()} 
                    className="w-full py-2 text-[#6B4F3A] hover:text-[var(--expense)] text-[11px] font-medium transition-colors">
                    Khôi phục dữ liệu gốc nếu bị xung đột
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
