          },
          colors: {

              primary: 'rgb(var(--primary-rgb) / <alpha-value>)',

            },

  <script>
    // Trong app Android, WebView không tải được link blob: -> chuyển sang hộp thoại "Lưu tệp" của Android
    (function () {
      if (!window.MaiBridge || !window.MaiBridge.saveFile) return;
      var orig = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function () {
        var href = this.href || "", name = this.getAttribute("download");
        if (name !== null && /^(blob:|data:)/.test(href)) {
          fetch(href).then(function (r) { return r.text(); }).then(function (t) {
            window.MaiBridge.saveFile(name || "spendy.json", "application/json", t);
          });
          return;
        }
        return orig.apply(this, arguments);
      };
    })();
  </script>

  <style>
    /* =====================================================================
       Spendy · "Pastel Dusk Pixel" – hệ thiết kế
       Hồng hoàng hôn · mận chín · kem sữa · nút bấm điện tử · TV CRT
       ===================================================================== */
    :root {
      --primary: #F49CA6; --primary-rgb: 244 156 166;
      --on-primary: #4A2F4E;
      --background: #F5C4BC; --background-rgb: 245 196 188;
      --surface: #FCEEDD; --surface-rgb: 252 238 221;
      --text-primary: #4A3350; --text-primary-rgb: 74 51 80;
      --text-secondary: #85586A; --text-secondary-rgb: 133 88 106;
      --variant: #F5DFCB; --variant-rgb: 245 223 203;
      --border: #DDAE9E; --border-rgb: 221 174 158;
      --ink: #4A3350; --ink-rgb: 74 51 80;
      --wood: #B76E7B; --wood-light: #D9959D; --wood-dark: #8C4C5E;
      --accent: #FFD87E; --accent-rgb: 255 216 126;
      --on-accent: #5E3A28;
      --expense: #D4506A; --expense-light: #FDE1E3; --on-expense: #FFFFFF;
      --income: #378F67; --income-light: #DDF3E4; --on-income: #FFFFFF;
      --hud: #4E3651; --on-hud: #FFF2E2;
      --sky1: #F0A3A2; --sky2: #F8D3C6; --ground: #E9C3B6;
      --tv-body: #EE9AA3; --tv-trim: #FCE6D2; --screen: #2A2140; --screen2: #41325C;
      --key-home: #F59AA6; --key-report: #B9D18F; --key-mai: #C3A3E2; --key-wallet: #8DB4EA; --key-add: #FFD87E;
      --icon-ink: #4A3350;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* motion */
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
      --ease-soft: cubic-bezier(.45, 0, .2, 1);
      --dx: 0px;
    }
    html { font-size: 16px; }
    html, body {
      font-family: 'Handjet', system-ui, sans-serif;
      letter-spacing: 0.015em;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    body { font-size: 18px; line-height: 1.4; }
    ::selection { background: rgb(var(--primary-rgb) / .55); color: var(--ink); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .font-display { font-family: 'Handjet', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.01em; }
    .font-pixel { font-family: 'Handjet', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.05em; }
    .tabular { font-variant-numeric: tabular-nums; }
    .vi { width: 100%; height: 100%; display: block; overflow: visible; image-rendering: pixelated; }
    .vi .k { fill: var(--icon-ink); }
    .vi32 { image-rendering: auto; object-fit: contain; pointer-events: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .vi .ks { fill: rgba(74, 51, 80, .22); }
    html.dark .vi .ks { fill: rgba(0, 0, 0, .4); }

    /* ======================= NỀN TRỜI HOÀNG HÔN ======================= */
    html[data-retro="1"] body {
      background-color: var(--background);
      background-image: linear-gradient(180deg, var(--sky1) 0px, var(--sky2) 380px, var(--background) 900px);
      background-attachment: fixed;
    }
    html[data-retro="1"] main.bg-theme-background { background: transparent; }
    .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .sky-cloud { position: absolute; image-rendering: pixelated; opacity: .95; animation: cloudDrift linear infinite; will-change: transform; }
    .sky-cloud svg { display: block; width: 100%; height: 100%; }
    .sky-star { position: absolute; width: 3px; height: 3px; background: #FFF2E2; box-shadow: 0 0 6px #FFF2E2; opacity: 0; animation: starTwinkle 3.6s var(--ease-soft) infinite; }
    html:not(.dark) .sky-star { display: none; }
    html.dark .sky-cloud { opacity: .18; }
    .sky-hill { position: absolute; left: -5%; right: -5%; bottom: -40px; height: 160px; border-radius: 50% 50% 0 0 / 60px 60px 0 0; background: var(--ground); opacity: .55; }
    @keyframes cloudDrift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
    @keyframes starTwinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .9; transform: scale(1); } }

    /* ======================= HUD (thanh tài nguyên) ======================= */
    .hud-wrap { background: transparent; }
    .hud {
      display: flex; align-items: stretch; height: 40px;
      background: var(--hud); color: var(--on-hud);
      border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 rgba(74,51,80,.35);
      overflow: hidden;
    }
    .hud-cell { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; transition: background-color .2s var(--ease-soft); }
    .hud-cell:active { background: rgba(255,255,255,.08); }
    .hud-cell + .hud-cell { box-shadow: inset 3px 0 0 rgba(0,0,0,.25); }
    .hud-cell-light { background: var(--surface); color: var(--ink); }
    .hud-num { font-family: 'Handjet', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; white-space: nowrap; }
    .hud-plus {
      width: 22px; height: 22px; flex: none; border-radius: 999px; display: grid; place-items: center;
      background: #8A7392; color: var(--on-hud); border: 2px solid var(--ink);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 2px 0 rgba(0,0,0,.25);
      transition: transform .25s var(--ease-spring);
    }
    .hud-plus:active { transform: scale(.85); }
    .hud-badge { position: absolute; top: -7px; right: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--expense); color: #fff; border: 2px solid var(--ink); font: 700 15px/14px 'Handjet', sans-serif; text-align: center; animation: badgePop .5s var(--ease-spring) both; }
    .hud-btn {
      width: 40px; height: 40px; display: grid; place-items: center; flex: none;
      background: var(--surface); color: var(--ink);
      border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(74,51,80,.14), 0 3px 0 var(--ink);
      transition: transform .3s var(--ease-spring), box-shadow .3s var(--ease-spring);
    }
    .hud-btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 1px 0 var(--ink); transition-duration: .06s; }
    .hud-sub { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; background: var(--wood); border: 3px solid var(--ink); border-radius: 12px; box-shadow: inset 0 3px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 rgba(74,51,80,.35); transition: transform .3s var(--ease-spring); }
    .hud-sub:active { transform: translateY(2px); transition-duration: .06s; }
    .lvl-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border: 2px solid #D79A3C; border-radius: 6px; background: var(--accent); color: #9A5A1E; font: 700 16px/1 'Handjet', sans-serif; letter-spacing: .06em; box-shadow: inset 0 2px 0 rgba(255,255,255,.55); white-space: nowrap; }
    .xp-bar { position: relative; flex: 1; height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: var(--hud); overflow: hidden; box-shadow: 0 2px 0 rgba(74,51,80,.3); }
    .xp-bar > i { position: absolute; left: 2px; top: 2px; bottom: 2px; border-radius: 999px; background: #8EDB9E; box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.12); transition: width .9s var(--ease-out); }
    .xp-bar.warn > i { background: var(--accent); }
    .xp-bar.over > i { background: #FF8EA0; }

    /* ======================= CỬA SỔ / KHUNG PANEL ======================= */
    html[data-retro="1"] .bg-theme-surface.border.rounded-2xl,
    html[data-retro="1"] .bg-theme-surface.border.rounded-3xl,
    html[data-retro="1"] .retro-card {
      border-color: var(--ink) !important;
      border-width: 3px;
      border-radius: 14px !important;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.6), 0 4px 0 var(--ink), 0 8px 0 rgba(74,51,80,.18);
    }
    html[data-retro="1"] .retro-card-soft {
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 var(--ink);
    }
    /* Khung cửa sổ: viền mực + vành hồng mận + viền mực (giống bảng danh sách game) */
    .console-bezel {
      position: relative;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 0 0 4px var(--wood), 0 0 0 7px var(--ink), 0 10px 0 4px rgba(74,51,80,.22);
      margin: 7px 2px 12px;
      overflow: hidden;
    }
    .console-bezel.modal-sheet { margin: 0; }
    .console-top-strip {
      position: relative;
      background: var(--hud);
      color: var(--on-hud);
      border-bottom: 3px solid var(--ink);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.2);
      text-shadow: 1px 1px 0 rgba(0,0,0,.35);
    }
    .console-top-strip .console-key { text-shadow: none; }
    .console-lcd {
      position: relative;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(74,51,80,.12), inset 0 -2px 0 rgba(255,255,255,.4);
    }
    .console-key {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 5px;
      font-family: 'Handjet', sans-serif; font-weight: 700; font-size: 15px; line-height: 1;
      background: var(--surface); color: var(--ink);
      border: 2px solid var(--ink); border-radius: 6px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 2px 0 var(--ink);
      transition: transform .25s var(--ease-spring);
    }
    .console-key:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); transition-duration: .05s; }
    /* nút ✕ trên thanh tiêu đề = nút đỏ kiểu cửa sổ game */
    .console-top-strip button.console-key { background: #E8606E; color: #fff; min-width: 28px; height: 26px; border-color: var(--ink); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.35); font-size: 12px; }
    .bg-theme-primary .console-key, .game-btn-accent .console-key { background: var(--surface); color: var(--ink); border-color: var(--ink); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: #DDBB9D; color: #FFF8EE; border-bottom: 2.5px solid var(--ink); font-family: 'Handjet', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; text-shadow: 1px 1px 0 rgba(74,51,80,.45); box-shadow: inset 0 2px 0 rgba(255,255,255,.3); }
    .panel-head.dark { background: var(--hud); color: var(--on-hud); }

    /* ======================= NÚT BẤM ======================= */
    html[data-retro="1"] button.bg-theme-primary,
    html[data-retro="1"] .retro-btn,
    .game-btn {
      border: 3px solid var(--ink);
      border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(74,51,80,.16), 0 4px 0 var(--ink);
      transition: transform .32s var(--ease-spring), box-shadow .32s var(--ease-spring), filter .2s var(--ease-soft);
    }
    .game-btn-sm {
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -3px 0 rgba(74,51,80,.14), 0 3px 0 var(--ink);
      transition: transform .3s var(--ease-spring), box-shadow .3s var(--ease-spring);
    }
    .game-btn-sm:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 var(--ink); transition-duration: .06s; }
    html[data-retro="1"] .bg-theme-primary,
    html[data-retro="1"] button.bg-theme-primary,
    html[data-retro="1"] .retro-hero { color: var(--on-primary) !important; }
    html[data-retro="1"] .retro-hero .text-white,
    html[data-retro="1"] .retro-hero .text-white\/85,
    html[data-retro="1"] .retro-hero .text-white\/90 { color: var(--on-primary) !important; opacity: .94; }
    html[data-retro="1"] button.bg-theme-primary:active,
    html[data-retro="1"] .retro-btn:active,
    .game-btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(74,51,80,.16), 0 1px 0 var(--ink); transition-duration: .06s; }
    button:disabled { filter: saturate(.6); opacity: .65; }

    /* Nút bấm điện tử (phím cơ có đèn LED) */
    .ekey {
      --c: var(--surface); --t: var(--ink);
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-height: 64px; padding: 8px 4px 6px;
      background: var(--c); color: var(--t);
      border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -5px 0 rgba(74,51,80,.18), 0 5px 0 var(--ink), 0 8px 0 rgba(74,51,80,.2);
      transition: transform .34s var(--ease-spring), box-shadow .34s var(--ease-spring);
      -webkit-user-select: none; user-select: none; touch-action: manipulation;
    }
    .ekey:active, .ekey.is-down { transform: translateY(4px); box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(74,51,80,.18), 0 1px 0 var(--ink), 0 2px 0 rgba(74,51,80,.15); transition-duration: .06s; }
    .ekey .ekey-ico { width: 26px; height: 26px; transition: transform .34s var(--ease-spring); }
    .ekey:active .ekey-ico { transform: scale(.9); }
    .ekey .ekey-label { font: 700 15px/1 'Handjet', sans-serif; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .ekey .ekey-label.is-small { font-size: 14px; letter-spacing: .02em; }
    .ekey .led { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 2px; background: rgba(74,51,80,.28); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
    .ekey .led.on { background: #7DFFB0; box-shadow: 0 0 6px #7DFFB0, 0 0 2px #fff inset; animation: ledBreath 2.4s var(--ease-soft) infinite; }
    .ekey .led.warn { background: #FFE07A; box-shadow: 0 0 6px #FFE07A; animation: ledBlink 1s steps(2, start) infinite; }
    .ekey .ekey-badge { position: absolute; top: -9px; left: -7px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--expense); color: #fff; border: 2px solid var(--ink); font: 700 15px/16px 'Handjet', sans-serif; text-align: center; animation: badgePop .5s var(--ease-spring) both; }

    /* ======================= TV RETRO (màn hình chính) ======================= */
    .tv { position: relative; padding-top: 30px; margin: 0 2px 18px; }
    @media (min-width: 768px) { .tv { max-width: 600px; margin-inline: auto; } .tv-screen { height: 240px; } }
    .tv-antenna { position: absolute; left: 50%; top: 0; width: 120px; height: 38px; transform: translateX(-50%); z-index: 1; }
    .tv-antenna svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .tv-antenna .rod-l { transform-origin: 60px 36px; animation: antennaSway 5.5s var(--ease-soft) infinite; }
    .tv-antenna .rod-r { transform-origin: 60px 36px; animation: antennaSway 6.2s var(--ease-soft) infinite reverse; }
    .tv-body {
      position: relative; z-index: 2;
      background: var(--tv-body);
      border: 3px solid var(--ink); border-radius: 26px;
      padding: 12px 12px 14px;
      box-shadow: inset 0 5px 0 rgba(255,255,255,.35), inset 0 -8px 0 rgba(74,51,80,.16), inset 6px 0 0 rgba(255,255,255,.12), 0 6px 0 var(--ink), 0 12px 0 rgba(74,51,80,.22);
    }
    .tv-body::before { /* đường viền nổi trang trí */
      content: ""; position: absolute; inset: 5px; border-radius: 20px; border: 2px dashed rgba(255,255,255,.35); pointer-events: none;
    }
    .tv-top { display: grid; grid-template-columns: 1fr 56px; gap: 10px; }
    .tv-bezel { background: var(--tv-trim); border: 3px solid var(--ink); border-radius: 22px; padding: 8px; box-shadow: inset 0 -4px 0 rgba(74,51,80,.12), inset 0 3px 0 rgba(255,255,255,.7); }
    .tv-screen {
      position: relative; overflow: hidden; height: 226px;
      border: 3px solid var(--ink); border-radius: 26px / 22px;
      background: radial-gradient(120% 95% at 50% 42%, var(--screen2) 0%, var(--screen) 62%, #17111F 100%);
      color: #FFF2E2;
      box-shadow: inset 0 0 26px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.05);
      isolation: isolate;
      touch-action: pan-y;
    }
    .tv-screen::before { /* scanlines */
      content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(10,6,18,.32) 0 1px, transparent 1px 3px);
    }
    .tv-screen::after { /* kính cong phản sáng */
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: inherit;
      background:
        radial-gradient(90% 60% at 18% 6%, rgba(255,255,255,.16), transparent 55%),
        radial-gradient(140% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%);
    }

    /* ======================= DOCK (4 nút hình học pixel 2D giả 3D không viền đen + nút GHI) ======================= */
    .dock { background: transparent; padding-bottom: 0 !important; }
    .dock-inner {
      position: relative;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 4px;
      margin: 0; padding: 6px 8px calc(var(--safe-bottom) + 6px);
      background: var(--tv-body);
      border-top: 3px solid var(--ink);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(74,51,80,.24), 0 -3px 12px rgba(20,12,30,.28);
    }
    .dock-key {
      position: relative; flex: 1; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      background: transparent !important;
      border: 0 !important;
      padding: 2px 2px 1px;
      box-shadow: none !important;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
    }
    .dock-face {
      position: relative; width: 100%;
      padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      clip-path: none !important;
    }
    .dock-shape {
      position: relative;
      width: 52px; height: 52px;
      display: block;
      image-rendering: pixelated;
    }
    .dock-well, .dock-cap, .dock-cap-art {
      position: absolute; inset: 0;
      display: block; pointer-events: none;
    }
    .dock-shape svg {
      width: 100%; height: 100%;
      display: block; overflow: visible;
      shape-rendering: crispEdges;
    }
    .dock-cap {
      transform: translateY(0px);
      transition: transform .14s var(--ease-spring), filter .14s var(--ease-soft);
    }
    .dock-ico {
      position: absolute;
      left: 50%; top: 43%;
      width: 20px; height: 20px;
      transform: translate(-50%, -50%);
      display: block;
      pointer-events: none;
      color: #341D3E;
      opacity: .76;
      filter: drop-shadow(0 1px 0 rgba(255,255,255,.45));
      transition: color .16s var(--ease-soft), opacity .16s var(--ease-soft), filter .18s var(--ease-soft), transform .16s var(--ease-spring);
    }
    .dock-ico svg, .dock-ico img {
      width: 100%; height: 100%;
      display: block;
    }
    .dock-ico img.dock-custom-mono {
      filter: brightness(0) saturate(100%) invert(11%) sepia(31%) saturate(1658%) hue-rotate(248deg) brightness(92%) contrast(96%);
    }
    .dock-cap.shape-triangle { --dock-glow: #FFE27A; --dock-glow-2: #FF5E8E; }
    .dock-cap.shape-circle   { --dock-glow: #EAFF8A; --dock-glow-2: #4FD86B; }
    .dock-cap.shape-square   { --dock-glow: #F6D8FF; --dock-glow-2: #9E5CFF; }
    .dock-cap.shape-star     { --dock-glow: #C8F6FF; --dock-glow-2: #3A9BFF; }
    .dock-cap.shape-triangle .dock-ico {
      top: 50%;
      width: 18px; height: 18px;
    }
    .dock-cap.shape-star .dock-ico {
      top: 45%;
      width: 18px; height: 18px;
    }
    .dock-key.on .dock-cap {
      transform: translateY(4.2px);
      filter: brightness(1.03) saturate(1.06);
    }
    .dock-key.on .dock-ico,
    .dock-key:active .dock-ico {
      color: #FFFFFF;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.06);
      filter:
        drop-shadow(0 1px 0 rgba(34,23,43,.5))
        drop-shadow(0 0 2.5px var(--dock-glow, #FFE680))
        drop-shadow(0 0 6px var(--dock-glow-2, #FFA834));
    }
    .dock-key.on .dock-ico img.dock-custom-mono,
    .dock-key:active .dock-ico img.dock-custom-mono {
      filter: brightness(0) invert(1);
    }
    .dock-key:active .dock-cap {
      transform: translateY(5.6px) !important;
      filter: brightness(.96);
      transition-duration: .04s;
    }
    .dock-label {
      width: 100%;
      padding-top: 2px; margin-top: 1px;
      border-top: 0;
      font: 700 13px/1 'Handjet', sans-serif; letter-spacing: .04em;
      color: #35203C; text-align: center; text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,.45);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: transform .14s var(--ease-spring), color .15s var(--ease-soft);
    }
    .dock-key.on .dock-label {
      color: #FFF6E8;
      text-shadow: 0 1px 0 rgba(42,24,48,.85), 0 0 6px rgba(255,242,226,.35);
    }
    .dock-key:active .dock-label {
      transform: translateY(1px);
    }
    .arcade { position: relative; width: 68px; height: 70px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin: 0 1px; -webkit-user-select: none; user-select: none; }
    .arcade-ring { position: relative; width: 64px; height: 64px; border-radius: 999px; background: var(--hud); border: 3px solid var(--ink); box-shadow: inset 0 3px 0 rgba(255,255,255,.15), 0 4px 0 var(--ink); display: grid; place-items: center; margin-top: -18px; }
    .arcade-ring::before { content: ""; position: absolute; inset: -9px; border-radius: 999px; border: 3px solid rgb(var(--primary-rgb) / .9); opacity: 0; animation: arcadePing 3.2s var(--ease-out) infinite; }
    .arcade-dome {
      width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center;
      background: radial-gradient(circle at 34% 28%, #FFF6D8 0 14%, var(--key-add) 40%, #F1B24C 100%);
      border: 3px solid var(--ink); color: var(--ink);
      box-shadow: inset 0 -5px 0 rgba(164,92,30,.25), 0 5px 0 #2F1F33;
      transform: translateY(-4px);
      transition: transform .38s var(--ease-spring), box-shadow .38s var(--ease-spring);

    .arcade-dome .vi { width: 24px; height: 24px; }
    .arcade:active .arcade-dome { transform: translateY(1px) scale(.96); box-shadow: inset 0 -2px 0 rgba(164,92,30,.25), 0 0 0 #2F1F33; transition-duration: .06s; }
    .arcade .dock-label { width: auto; border-top: 0; padding-top: 0; margin-top: 2px; color: #FFF2E2; text-shadow: 1px 1px 0 var(--ink); font-size: 14px; }

    /* ======================= BIỂU MẪU ======================= */
    html[data-retro="1"] input:not(.border-0), html[data-retro="1"] select, html[data-retro="1"] textarea {
      border-color: rgb(var(--border-rgb));
      border-width: 2px;
      border-radius: 0;
      transition: border-color .2s var(--ease-soft), box-shadow .25s var(--ease-soft);
    }
    html[data-retro="1"] input:not(.border-0):focus, html[data-retro="1"] select:focus, html[data-retro="1"] textarea:focus {
      outline: none;
      border-color: var(--ink);
      box-shadow: 0 0 0 4px rgb(var(--primary-rgb) / .38);
    }
    html[data-retro="1"] h1, html[data-retro="1"] h2, html[data-retro="1"] h3 { font-family: 'Handjet', system-ui, sans-serif; font-weight: 700; letter-spacing: 0.015em; }

    /* Thanh HP ngân sách dạng ô */
    .hp-seg { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--hud); border: 2.5px solid var(--ink); border-radius: 8px; box-shadow: inset 0 2px 0 rgba(0,0,0,.2); }
    .hp-cell { height: 10px; border-radius: 2px; background: rgba(255,255,255,.12); box-shadow: inset 0 2px 0 rgba(255,255,255,.4); transition: background-color .4s var(--ease-soft); }

    /* Dải kẹo pastel */
    .retro-stripes { background: repeating-linear-gradient(180deg, var(--primary) 0 10px, var(--accent) 10px 20px, #9BE0AE 20px 30px, #A5D8F7 30px 40px); }
    .retro-stripes-h { background: repeating-linear-gradient(90deg, var(--primary) 0 10px, var(--accent) 10px 20px, #9BE0AE 20px 30px, #A5D8F7 30px 40px); opacity: .9; }
    .console-bezel > .retro-stripes-h { height: 4px !important; }
    .retro-sunburst {
      background-image: linear-gradient(45deg, rgb(255 255 255 / 0.18) 25%, transparent 25%), linear-gradient(-45deg, rgb(255 255 255 / 0.18) 25%, transparent 25%);
      background-size: 12px 12px;
    }
    .retro-arc { position: absolute; border-radius: 4px; border-style: solid; border-color: transparent; }
    .retro-dash { background-image: linear-gradient(90deg, rgb(var(--text-primary-rgb) / .3) 50%, transparent 50%); background-size: 8px 2px; background-repeat: repeat-x; height: 2px; }

    /* ======================= DANH SÁCH GIAO DỊCH ======================= */
    main.overflow-y-auto { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px); mask-image: linear-gradient(180deg, transparent 0, #000 10px); }
    .rep-bar { transform-origin: bottom; animation: barGrow .7s var(--ease-spring) both; }
    .tx-row { transition: background-color .2s var(--ease-soft), transform .3s var(--ease-spring); }
    .tx-row:active { transform: scale(.985); background: rgb(var(--variant-rgb)); }
    .tx-ico { width: 42px; height: 42px; border-radius: 10px; border: 2.5px solid var(--ink); display: grid; place-items: center; flex: none; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 2px 0 var(--ink); }
    .day-card { background: var(--surface); border: 2.5px solid var(--border); border-radius: 12px; overflow: hidden; }
    .day-card .panel-head { border-bottom-color: var(--border); }

    /* ======================= HỘP THOẠI ======================= */
    .modal-backdrop { background: rgba(46, 26, 48, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fadeIn .25s var(--ease-soft) both; }
    .modal-sheet { animation: sheetUp .5s var(--ease-out) both; }
    @media (min-width: 640px) { .modal-sheet { animation: modalPop .42s var(--ease-spring) both; } }
    [data-state="closed"] { pointer-events: none; }
    [data-state="closed"] .modal-backdrop { animation: fadeOut .24s var(--ease-soft) both; }
    [data-state="closed"] .modal-sheet { animation: sheetDown .26s var(--ease-soft) both; }
    .modal-pop { animation: modalPop .42s var(--ease-spring) both; }

    /* Toast */
    .toast-in { animation: toastIn .55s var(--ease-spring) both; }
    .toast-bar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 2px; background: currentColor; opacity: .35; transform-origin: left; animation: toastBar 4s linear both; }

    /* ======================= MOTION ======================= */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes sheetUp { from { opacity: 0; transform: translateY(70px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes sheetDown { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(60px) scale(.98); } }
    @keyframes modalPop { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes toastIn { 0% { transform: translate(-50%, -30px) scale(.9); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
    @keyframes toastBar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes tabEnter { from { opacity: 0; transform: translate3d(var(--dx), 10px, 0); } to { opacity: 1; transform: none; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes walletIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
    @keyframes walletSheen { 0%, 62% { transform: translateX(-120%) skewX(-18deg); } 100% { transform: translateX(260%) skewX(-18deg); } }
    @keyframes walletBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes walletRow { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes pxHop { 0%, 100% { transform: translateY(0) scale(1); } 35% { transform: translateY(-4px) scale(1.06, .96); } 65% { transform: translateY(0) scale(.96, 1.04); } }
    @keyframes pxWiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
    @keyframes pxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
    @keyframes pxSparkle { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.12) rotate(8deg); } }
    @keyframes pxScan { 0%, 100% { transform: translateY(-2px); opacity: .8; } 50% { transform: translateY(2px); opacity: 1; } }
    @keyframes pxLed { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes icoHop { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-6px) scale(1.08, .94); } 60% { transform: translateY(0) scale(.94, 1.06); } 100% { transform: none; } }
    @keyframes badgePop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    @keyframes ledBreath { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes ledBlink { 0% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes arcadePing { 0%, 55% { opacity: 0; transform: scale(.85); } 65% { opacity: .9; } 100% { opacity: 0; transform: scale(1.18); } }
    @keyframes antennaSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes crtRoll { from { transform: translateY(0); } to { transform: translateY(340px); } }
    @keyframes crtFlicker { 0%, 100% { opacity: 1; } 31% { opacity: .96; } 32% { opacity: 1; } 77% { opacity: .97; } 78% { opacity: 1; } }
    @keyframes crtPowerOn {
      0% { transform: scale(0, .006); filter: brightness(4); opacity: 1; }
      28% { transform: scale(1, .006); filter: brightness(3.5); }
      55% { transform: scale(1, 1); filter: brightness(1.6); }
      100% { transform: none; filter: none; }
    }
    @keyframes crtSwitch { 0% { opacity: 0; transform: translateY(6px) skewX(-4deg); filter: blur(1.5px) brightness(1.8); } 60% { opacity: 1; filter: none; } 100% { transform: none; } }
    @keyframes noiseBurst { 0% { opacity: .9; } 70% { opacity: .55; } 100% { opacity: 0; } }
    @keyframes noiseJitter { 0% { transform: translate(0, 0); } 33% { transform: translate(-13px, 7px); } 66% { transform: translate(9px, -11px); } 100% { transform: translate(-5px, 12px); } }
    @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes hpCell { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes mai-bloom { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.05); } }
    @keyframes mai-pulse { 0% { box-shadow: 0 0 0 0 rgb(var(--primary-rgb) / .7); } 100% { box-shadow: 0 0 0 16px rgb(var(--primary-rgb) / 0); } }
    @keyframes maiDot { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

    .tab-enter { animation: tabEnter .46s var(--ease-out) both; }
    .tab-enter > * { animation: riseIn .5s var(--ease-out) both; }
    .tab-enter > *:nth-child(1) { animation-delay: .02s; }
    .tab-enter > *:nth-child(2) { animation-delay: .07s; }
    .tab-enter > *:nth-child(3) { animation-delay: .12s; }
    .tab-enter > *:nth-child(4) { animation-delay: .17s; }
    .tab-enter > *:nth-child(5) { animation-delay: .22s; }
    .tab-enter > *:nth-child(n+6) { animation-delay: .26s; }
    .stagger > * { animation: riseIn .48s var(--ease-out) both; }

    /* ======================= DOCK CRT MỚI (nền tối, LED vàng, keycap pixel, đồng xu GHI) ======================= */
    .pxdock { height: calc(132px + var(--safe-bottom)); padding: 0 6px calc(var(--safe-bottom) + 22px) !important; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)) 88px repeat(2, minmax(0,1fr)); align-items: end; gap: 4px; background: transparent; }
    .pxdock .base { position: absolute; left: 0; right: 0; bottom: 0; top: 26px; z-index: -1; overflow: hidden;
      background: repeating-linear-gradient(180deg, rgba(10,6,18,.35) 0 3px, transparent 3px 6px),
        linear-gradient(135deg, transparent 0 30%, rgba(255,255,255,.05) 30% 36%, transparent 36% 40%, rgba(255,255,255,.035) 40% 43%, transparent 43%),
        radial-gradient(120% 90% at 50% 40%, #41325C 0%, #2A2140 62%, #17111F 100%);
      box-shadow: 0 -3px 0 #3B2A3F, 0 -6px 0 #FCE6D2, 0 -9px 0 #F2A3AC, 0 -12px 0 #3B2A3F, 0 -15px 0 rgba(59,42,63,.3); }
    .pxdock .base::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.35) 0 6px, transparent 6px calc(100% - 6px), rgba(0,0,0,.35) calc(100% - 6px)); animation: pxFlick 5s steps(1) infinite; }
    .pxdock .base::before { content: ""; position: absolute; left: 0; right: 0; height: 16px; top: -16px; background: repeating-linear-gradient(180deg, rgba(255,211,110,.07) 0 3px, transparent 3px 6px); animation: pxRoll 5s steps(40) infinite; pointer-events: none; }
    @keyframes pxFlick { 97% { opacity: .6; } }
    @keyframes pxRoll { to { top: 100%; } }
    .pxdock .leds { position: absolute; left: 12px; right: 12px; top: 9px; display: flex; justify-content: space-between; }
    .pxdock .leds i { width: 6px; height: 3px; background: #5A4632; box-shadow: 0 0 0 1px #17111F; animation: pxLed 1.68s steps(1) infinite; }

    .dk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 0 4px; min-width: 0; background: none; border: 0; -webkit-user-select: none; user-select: none; touch-action: manipulation; cursor: pointer; }

    .dk.on .cap { transform: translateY(-6px); }

    const darkenHex = (hex, f) => {
      const n = parseInt(String(hex).replace("#", "").slice(0, 6), 16);
      if (isNaN(n)) return hex;
      const c = (v) => Math.round(v * f).toString(16).padStart(2, "0");
      return "#" + c((n >> 16) & 255) + c((n >> 8) & 255) + c(n & 255);
    };
    const contrastInk = (hex) => {
      const n = parseInt(String(hex || "").replace("#", "").slice(0, 6), 16);
      if (isNaN(n)) return "#1A1423";
      const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;

    const IconGroupSelector = ({ iconGroups, selectedGroup, onSelectGroup }) => {

    const CategoryModal = ({ isOpen, onClose, editingCategory, newCategoryParent, parentCategories, categoryParentMap, onSave }) => {
      if (!isOpen) return null;

      const [name, setName] = React.useState(editingCategory?.name || "");
      const [selectedIcon, setSelectedIcon] = React.useState(editingCategory?.icon || "tag");
      const [selectedColorState] = React.useState(editingCategory?.color || null);
      const [isChild, setIsChild] = React.useState(() => {
        if (editingCategory) {
          return !editingCategory.isParent && !!(editingCategory.parent || categoryParentMap[editingCategory.name]);

      });
      const [parentName, setParentName] = React.useState(() => {
        if (editingCategory) {
          return editingCategory.parent || categoryParentMap[editingCategory.name] || parentCategories[0]?.name || "Khác";
        }
        return newCategoryParent || parentCategories[0]?.name || "Khác";

      const [iconGroup, setIconGroup] = React.useState("Tất cả");

      const filteredIcons = React.useMemo(() => {
        let baseList = [];
        if (iconGroup === "Tất cả") {
          baseList = ALL_AVAILABLE_ICONS;
        } else {
          const g = ICON_GROUPS.find(grp => grp.name === iconGroup);
          baseList = g ? g.icons : ALL_AVAILABLE_ICONS;
        }

        if (iconSearch.trim()) {
          const q = iconSearch.trim().toLowerCase();
          return ALL_AVAILABLE_ICONS.filter(ic => ic.toLowerCase().includes(q));

        return baseList;
      }, [iconGroup, iconSearch]);

      const selectedColor = React.useMemo(() => {
        if (selectedColorState) return selectedColorState;
        if (isChild) { const p = parentCategories.find(x => x.name === parentName); if (p && p.color) return p.color; }
        const n = (name || "x").split("").reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
        return CATEGORY_COLOR_PALETTE[n % CATEGORY_COLOR_PALETTE.length];

      const badgeInk = contrastInk(selectedColor || "#FF8674");

      const handleSubmit = (e) => {

            <div className="h-1 retro-stripes-h shrink-0" />

            <div className="p-4 overflow-y-auto no-scrollbar space-y-3">
              {/* LIVE PREVIEW HERO CARD */}
              <div className="console-lcd p-3 flex items-center gap-3" style={{ backgroundColor: `${selectedColor}22` }}>
                <div className="w-12 h-12 rounded-lg bg-theme-surface border-2 border-[var(--ink)] flex items-center justify-center shrink-0">

                    <span className="font-pixel text-[14px] px-2 py-0.5 rounded border border-[var(--ink)] shrink-0" style={{ backgroundColor: selectedColor, color: badgeInk }}>

              <form onSubmit={handleSubmit} className="space-y-3">
                <div>
                  <label className="text-xs font-bold text-theme-textSecondary mb-1 block uppercase tracking-wider">Tên hạng mục</label>
                  <input 
                    type="text"

                    onChange={(e) => setName(e.target.value)}
                    placeholder="Ví dụ: Ăn phở sáng, Quỹ nhà, Tiền thưởng..." 
                    required 
                    className="w-full bg-theme-background border-2 border-theme-border rounded-lg p-2.5 text-theme-textPrimary text-sm font-bold"

                </div>

                {/* Hierarchy Selector */}
                <div className="bg-theme-background border-2 border-theme-border p-2.5 rounded-lg space-y-2">
                  <label className="flex items-center gap-2 cursor-pointer select-none">
                    <input 
                      type="checkbox"

                  </label>

                  {isChild && (
                    <div className="pt-2 border-t border-dashed border-theme-border">
                      <label className="text-[13px] font-bold text-theme-textSecondary mb-1 block uppercase">Thuộc Danh mục Lớn</label>
                      <select 
                        value={parentName} 
                        onChange={(e) => setParentName(e.target.value)}
                        className="w-full bg-theme-surface border-2 border-theme-border rounded-lg p-2 text-xs font-bold text-theme-textPrimary appearance-none">
                        {parentCategories.map(p => (
                          <option key={p.id} value={p.name}>{p.name}</option>

                </div>

                {/* ICON SELECTION SECTION */}
                <div className="space-y-2">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-theme-textSecondary block uppercase tracking-wider">
                      Pixel Sprite ({filteredIcons.length})
                    </label>
                    <span className="text-xs font-semibold text-theme-textSecondary">Chọn: <b className="text-theme-textPrimary font-mono">{selectedIcon}</b></span>
                  </div>

                  <div className="relative">
                    <Icon name="btn-search" className="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-theme-textSecondary pointer-events-none" />
                    <input 
                      type="text" 
                      value={iconSearch}
                      onChange={(e) => setIconSearch(e.target.value)}
                      placeholder="Tìm icon (cafe, xe, nhà, tiền, gym, game...)"
                      className="w-full bg-theme-background border-2 border-theme-border rounded-lg pl-8 pr-8 py-1.5 text-xs font-semibold text-theme-textPrimary"
                    />
                    {iconSearch && (
                      <button type="button" onClick={() => setIconSearch("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-theme-textSecondary hover:text-theme-textPrimary text-xs font-bold">✕</button>
                    )}
                  </div>

                  {!iconSearch && (
                    <IconGroupSelector 
                      iconGroups={ICON_GROUPS}

                  )}

                  <div className="grid grid-cols-6 sm:grid-cols-8 gap-1.5 max-h-[180px] overflow-y-auto no-scrollbar p-2 border-2 border-theme-border rounded-lg bg-theme-background">
                    {filteredIcons.map(iconName => {
                      const isSelected = selectedIcon === iconName;
                      return (
                        <button
                          key={iconName}
                          type="button"
                          onClick={() => setSelectedIcon(iconName)}
                          title={iconName}
                          className={`p-1 rounded-lg flex items-center justify-center h-11 transition-all border-2 ${isSelected ? 'bg-[var(--accent)] border-[var(--ink)] scale-105 shadow-[inset_0_-3px_0_rgba(74,51,80,.22)]' : 'border-transparent hover:bg-theme-surface'}`}>
                          <Icon name={iconName} anim={isSelected ? "hop" : ""} className="w-8 h-8" />
                        </button>
                      );
                    })}
                    {filteredIcons.length === 0 && (
                      <div className="col-span-full py-4 text-center text-xs text-theme-textSecondary italic">
                        Không tìm thấy biểu tượng phù hợp.
                      </div>
                    )}
                  </div>
                </div>

                <div className="pt-1">
                  <button 
                    type="submit" 
                    className="game-btn w-full py-3 font-bold flex justify-center items-center gap-2 text-sm"
                    style={{ backgroundColor: selectedColor || 'var(--primary)', color: badgeInk }}>
                    <span className="console-key">A</span>
                    <Icon name={editingCategory ? "save" : "check"} className="w-4 h-4" /> 
                    <span>{editingCategory ? "LƯU THAY ĐỔI" : "TẠO HẠNG MỤC"}</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // ================= MOTION HELPERS =================
    const prefersReducedMotion = () => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
    // Rung nhẹ khi bấm nút điện tử (Android có quyền VIBRATE)
    const buzz = (ms = 8) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

    // Giữ nội dung lại thêm một nhịp khi đóng để chạy hiệu ứng thoát (backdrop mờ dần, sheet trượt xuống)
    const Presence = ({ show, children, ms = 260 }) => {
      const [mounted, setMounted] = useState(!!show);
      const lastRef = useRef(null);
      if (show) lastRef.current = children;
      useEffect(() => {
        if (show) { setMounted(true); return; }
        const t = setTimeout(() => setMounted(false), prefersReducedMotion() ? 0 : ms);
        return () => clearTimeout(t);
      }, [show]);
      if (!show && !mounted) return null;
      return <div style={{ display: "contents" }} data-state={show ? "open" : "closed"}>{show ? children : lastRef.current}</div>;
    };

    // Số chạy (ease-out) khi giá trị thay đổi; from0 = lần đầu đếm từ 0 lên
    const CountUp = ({ value, format = (n) => String(n), duration = 900, from0 = false }) => {
      const target = Number(value) || 0;
      const [disp, setDisp] = useState(from0 && !prefersReducedMotion() ? 0 : target);
      const curRef = useRef(from0 ? 0 : target);
      useEffect(() => {
        const from = curRef.current;
        if (from === target || prefersReducedMotion()) { curRef.current = target; setDisp(target); return; }
        let raf = 0, start = 0;
        const step = (t) => {
          if (!start) start = t;
          const p = Math.min(1, (t - start) / duration);
          const e = 1 - Math.pow(1 - p, 4);
          const v = from + (target - from) * e;
          curRef.current = v;
          setDisp(v);
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [target]);
      return <>{format(Math.round(disp))}</>;
    };

    // Ảnh nhiễu sóng TV (tạo 1 lần bằng canvas)
    let TV_NOISE_URL = null;
    const tvNoise = () => {
      if (TV_NOISE_URL !== null) return TV_NOISE_URL;
      try {
        const c = document.createElement("canvas"); c.width = c.height = 64;
        const x = c.getContext("2d"); const img = x.createImageData(64, 64);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = (Math.random() * 255) | 0, tint = Math.random() < 0.08;
          img.data[i] = tint ? 255 : v; img.data[i + 1] = tint ? 170 : v; img.data[i + 2] = tint ? 200 : v; img.data[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
        TV_NOISE_URL = c.toDataURL();
      } catch (e) { TV_NOISE_URL = ""; }
      return TV_NOISE_URL;
    };

    // Lưới ký tự -> SVG pixel (dùng cho mây, ăng-ten)
    const pixelSvg = (rows, pal) => {
      let out = "";
      rows.forEach((line, y) => {
        let x = 0;
        while (x < line.length) {
          const ch = line[x];
          if (!pal[ch]) { x++; continue; }
          const s0 = x; while (x < line.length && line[x] === ch) x++;
          out += `<rect x="${s0}" y="${y}" width="${x - s0}" height="1" fill="${pal[ch]}"/>`;
        }
      });
      return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" preserveAspectRatio="none">${out}</svg>`;
    };
    // Cho phép thay thế mọi UI Element (nút 2.5D, nút + Ghi, mây...) bằng ảnh vẽ tay từ Procreate / Studio
    const uiArt = (key, fallbackHtml, cls = "") => {
      const V = window.VinaIcons;
      const p = V && V.png32 ? V.png32(key) : null;
      return p ? `<img class="w-full h-full object-contain ${cls}" style="image-rendering:pixelated" src="data:image/png;base64,${p}" alt="" draggable="false">` : fallbackHtml;
    };
    const CLOUD_SVG = pixelSvg([
      "..........wwwwww............",
      "........wwhhhhhhww..........",
      ".......whhhhhhhhhhw...www...",
      "....wwwhhhhhhhhhhhhwwhhhww..",
      "..wwhhhhhhhhhhhhhhhhhhhhhhw.",
      ".whhhhhhhhhhhhhhhhhhhhhhhhhw",
      "whhhhhhhhhhhhhhhhhhhhhhhhhhw",
      "wwwwwwwwwwwwwwwwwwwwwwwwwwww",
      ".sssswwwwwwwwwwwwwwwwwsssss.",
      "...ssssssssssssssssssss....."
    ], { w: "#FFF1E8", h: "#FFFAF4", s: "#F6D8D2" });

    // Dock CRT mới: keycap pixel + icon màu vẽ tay (web/pixelkit.js)
    const PK = window.PixelKit;
    const DOCK_KEYCAPS = PK ? { overview: PK.keycap("#FBC2C8", "#E7798F"), report: PK.keycap("#BDEBC9", "#55B27F"), mai: PK.keycap("#E1CFF6", "#9C7BD3"), wallet_ai: PK.keycap("#C4E4FA", "#6E9FDE") } : {};
    const DOCK_ICONS = PK ? { overview: PK.icon("home"), report: PK.icon("chart"), mai: PK.icon("mai"), wallet_ai: PK.icon("wallet") } : {};
    // Nút GHI: đồng xu pixel có vệt sáng quét + lấp lánh
    // Nút dock kiểu nút arcade (mẫu anh Hoàng 11:19): mỗi mục một màu, mặt nút có icon đơn sắc vàng trắng phát sáng; mục đang chọn bị nhấn xuống
    const ARC_UP = ["............................", ".........oooooooooo.........", ".......ooTTTTTTTTTToo.......", "......oTTTLLLLLLTTTTTo......", ".....oTTLWWLLLLLTTTTTTo.....", "....oTTTWWLLLLLLTTTTTTTo....", "....oTTLLLLLLLLLTTTTTTTo....", "....oTTLLLLLLLLLTTTTTTTo....", "...oTTTTLLLLLLLLTTTTTTTTo...", "...osTTTTLLLLLLLTTTTTTTSo...", "...osTTTTTTLLLLLTTTTTTTSo...", "...osTTTTTTTTTTTTTTTTTTSo...", "...ossTTTTTTTTTTTTTTTTSSo...", "..oosssTTTTTTTTTTTTTTSSSoo..", ".oBosssssTTTTTTTTTTSSSSSoBo.", "oBBosssssssSSSSSSSSSSSSSoBBo", "oBBosssssssSSSSSSSSSSSSSoBBo", "oBBBossssssSSSSSSSSSSSSoBBBo", "oBBBossssssSSSSSSSSSSSSoBBBo", "obBBBosssssSSSSSSSSSSSoBBBbo", "obbBBBooossSSSSSSSSoooBBBbbo", ".obbBBBBBooooooooooBBBBBbbo.", ".obbbbBBBBBBBBBBBBBBBBbbbbo.", "..obbbbbbbBBBBBBBBbbbbbbbo..", "...oobbbbbbbbbbbbbbbbbboo...", ".....ooobbbbbbbbbbbbooo....."];
    const ARC_DN = ["............................", "............................", "............................", "............................", "............................", "...........oooooo...........", "........oooTTTTTTooo........", ".......oTTTTLLLLTTTTo.......", "......oTTLLLLLLLTTTTTo......", ".....oTTLWWLLLLLTTTTTTo.....", "....oTTLWWLLLLLLTTTTTTTo....", "....oTTLLLLLLLLLTTTTTTTo....", "...oTTTLLLLLLLLLTTTTTTTTo...", "..ooTTTTLLLLLLLLTTTTTTTToo..", ".oBosTTTTTLLLLLLTTTTTTTSoBo.", "oBBosTTTTTTTTTTTTTTTTTTSoBBo", "oBBossTTTTTTTTTTTTTTTTSSoBBo", "oBBBossTTTTTTTTTTTTTTSSoBBBo", "oBBBosssTTTTTTTTTTTTSSSoBBBo", "obBBBosssssTTTTTTSSSSSoBBBbo", "obbBBBooossSSSSSSSSoooBBBbbo", ".obbBBBBBooooooooooBBBBBbbo.", ".obbbbBBBBBBBBBBBBBBBBbbbbo.", "..obbbbbbbBBBBBBBBbbbbbbbo..", "...oobbbbbbbbbbbbbbbbbboo...", ".....ooobbbbbbbbbbbbooo....."];
    const ARC_GLYPH = {"home": [".....Y.....", "....YYY....", "...YYYYY...", "..YYYYYYY..", ".YYYYYYYYY.", "YYYYYYYYYYY", ".YYYYYYYYY.", ".YYY...YYY.", ".YYY...YYY.", ".YYY...YYY.", ".YYY...YYY."], "chart": [".........YY", ".........YY", ".....YY..YY", ".....YY..YY", ".YY..YY..YY", ".YY..YY..YY", ".YY..YY..YY", ".YY..YY..YY", ".YY..YY..YY", "...........", "YYYYYYYYYYY"], "tv": ["..Y.....Y..", "...Y...Y...", "....Y.Y....", "YYYYYYYYYYY", "Y.........Y", "Y..Y...Y..Y", "Y..Y...Y..Y", "Y.........Y", "Y...YYY...Y", "Y.........Y", "YYYYYYYYYYY"], "wallet": ["..YYYYYYY..", ".Y.......Y.", "YYYYYYYYYYY", "Y.........Y", "Y.........Y", "Y......YYYY", "Y......Y.YY", "Y......YYYY", "Y.........Y", "Y.........Y", "YYYYYYYYYYY"], "plus": ["....YYY....", "....YYY....", "....YYY....", "YYYYYYYYYYY", "YYYYYYYYYYY", "YYYYYYYYYYY", "....YYY....", "....YYY....", "....YYY...."]};
    const ARC_COL = {
      overview: { T: "#F26D8F", L: "#FF9DB4", S: "#B83A5E", s: "#D9506F", G: "#9E2C4E" },
      report: { T: "#4FC07F", L: "#8BE3AE", S: "#2A8255", s: "#38A068", G: "#1F6B45" },
      mai: { T: "#9A78EE", L: "#C4ADFF", S: "#5E43B5", s: "#7A5CD6", G: "#4A3399" },
      wallet_ai: { T: "#4C9EEB", L: "#8CC6FF", S: "#2A62B0", s: "#3A80CF", G: "#1F4F94" },
      add: { T: "#FFC22E", L: "#FFE07A", S: "#C47F12", s: "#E0A01C", G: "#A0630A" },
    };
    const ARC_GLYPH_OF = { overview: "home", report: "chart", mai: "tv", wallet_ai: "wallet", add: "plus" };
    const arcSvgCache = {};
    const arcSvg = (id, down) => {
      const k = id + (down ? "_d" : "_u");
      if (!arcSvgCache[k]) arcSvgCache[k] = pixelSvg(down ? ARC_DN : ARC_UP, { ...ARC_COL[id], W: "#FFFFFF", o: "#1B1430", B: "#E4E4EE", b: "#9A9AB5", h: "#2A2440" });
      return arcSvgCache[k];
    };
    const ArcadeButton = ({ id, down }) => (
      <span className={`arc ${down ? "is-down" : ""}`}>
        <span className="arc-art" dangerouslySetInnerHTML={{ __html: arcSvg(id, down) }} />
        <span className="arc-glyph" dangerouslySetInnerHTML={{ __html: pixelSvg(ARC_GLYPH[ARC_GLYPH_OF[id]], { Y: ARC_COL[id].G }) }} />
      </span>
    );
    const PixelCoin = React.memo(() => {
      const coin = useRef(null), spk = useRef(null);
      useEffect(() => {
        if (!PK) return;
        const c = coin.current.getContext("2d"), s = spk.current.getContext("2d");
        let f = 0; const draw = () => { PK.drawCoin(c, f); PK.drawSpark(s, f); f++; };
        draw();
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const iv = setInterval(draw, 110); return () => clearInterval(iv);
      }, []);
      return (<><canvas ref={coin} className="coin" width="28" height="28" /><canvas ref={spk} className="spk" width="28" height="28" /></>);
    });
    // Bầu trời pixel động vẽ trên canvas (dải màu dithering, mặt trời, đồi, mây, sao, sao băng, chim)
    const PixelSky = React.memo(() => {
      const ref = useRef(null);
      useEffect(() => (PK ? PK.sky(ref.current) : undefined), []);
      return <canvas ref={ref} className="pxsky" aria-hidden="true" style={{ zIndex: -1 }} />;
    });

    // Thân TV pastel bọc màn CRT: khung pixel 9-slice nhiều lớp bóng + hàng nút dưới
    const PixelTV = ({ color = "tvRose", brand = "SPENDY", children }) => {
      if (!PK) return children;
      return (
        <div className="pxtv" style={{ borderImageSource: `url("${PK.frame(color)}")` }}>
          {children}
          <div className="pxtv-ctrl" aria-hidden="true"><i className="led" /><span className="brand">{brand}</span><span className="grille" /><i className="knob" /><i className="knob" /></div>
        </div>

    // Hình tròn pixel nhiều lớp (thân, viền sáng, viền tối, nét mực) cho nút arcade & núm xoay
    const pixelDisc = (d, col, extra = "") => {
      const r = d / 2, inside = (x, y) => Math.hypot(x + 0.5 - r, y + 0.5 - r) <= r - 0.15;
      let base = "", hl = "", sh = "", ink = "";
      for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
        if (!inside(x, y)) continue;
        const px = `<rect x="${x}" y="${y}" width="1" height="1"/>`;
        if (!inside(x + 1, y) || !inside(x - 1, y) || !inside(x, y + 1) || !inside(x, y - 1)) { ink += px; continue; }
        base += px;
        const dx = x + 0.5 - r, dy = y + 0.5 - r, rim = Math.hypot(dx, dy) > r - 2.6;
        if (rim && dx + dy < -r * 0.45) hl += px; else if (rim && dx + dy > r * 0.45) sh += px;
      }
      return `<svg viewBox="0 0 ${d} ${d}" shape-rendering="crispEdges"><g fill="${col.body}">${base}</g><g fill="${col.hl}">${hl}</g><g fill="${col.sh}">${sh}</g><g fill="${col.ink}">${ink}</g>${extra}</svg>`;

    const TV_KNOB_SVG = pixelDisc(12, { body: "var(--tv-trim)", hl: "#FFFFFF", sh: "rgba(74,51,80,.22)", ink: "var(--ink)" }, `<rect x="5" y="2" width="2" height="4" fill="var(--ink)"/>`);

    // 4 nút điều hướng hình học (Tam giác · Tròn · Vuông · Ngôi sao) dạng 2.5D shape đơn giản có border line màu đen ôm theo khối + icon bên trong
    const pixel25dBtnSvg = (rows, pal) => {
      const H0 = rows.length, W0 = rows[0].length, DEPTH = 3;
      const INK = pal.ink || "#22172B";
      // Pad 1px trống quanh lưới để viền 1px pixel-perfect không bao giờ bị cắt ở mép
      const P = [".".repeat(W0 + 2), ...rows.map(r => "." + r + "."), ".".repeat(W0 + 2)];
      const H = P.length, W = W0 + 2;
      const at = (x, y) => x >= 0 && x < W && y >= 0 && y < H && P[y][x] === "#";
      const runs = (grid, h) => {
        let out = "";
        for (let y = 0; y < h; y++) {
          let x = 0;
          while (x < W) {
            const c = grid[y][x];
            if (!c) { x++; continue; }
            const x0 = x;
            while (x < W && grid[y][x] === c) x++;
            out += `<rect x="${x0}" y="${y}" width="${x - x0}" height="1" fill="${c}"/>`;
          }
        }
        return out;
      };
      const addAsepriteOutline = (grid, vh, fillMask, defaultFill) => {
        const isOut = Array.from({ length: vh }, () => Array(W).fill(false));
        const hasF = (x, y) => x >= 0 && x < W && y >= 0 && y < vh && fillMask[y][x];
        for (let y = 0; y < vh; y++) for (let x = 0; x < W; x++) {
          if (hasF(x, y)) continue;
          if (hasF(x + 1, y) || hasF(x - 1, y) || hasF(x, y + 1) || hasF(x, y - 1)) {
            grid[y][x] = INK;
            isOut[y][x] = true;
          }
        }
        // Khử góc chữ L bậc thang ở mặt trong của viền (Aseprite IntertwineAsPixelPerfect)
        const hasO = (x, y) => x >= 0 && x < W && y >= 0 && y < vh && isOut[y][x];
        for (let y = 1; y < vh - 1; y++) for (let x = 1; x < W - 1; x++) {
          if (!isOut[y][x]) continue;
          for (const [dx, dy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
            if (hasO(x - dx, y) && hasO(x, y - dy) && hasF(x + dx, y) && hasF(x, y + dy) && !hasF(x - dx, y - dy)) {
              grid[y][x] = grid[y][x + dx] || defaultFill;
              isOut[y][x] = false;
              fillMask[y][x] = true;
              break;
            }
          }
        }
      };

      const VH = H + DEPTH + 1;
      const baseGrid = Array.from({ length: VH }, () => Array(W).fill(null));
      const baseMask = Array.from({ length: VH }, () => Array(W).fill(false));
      const capGrid = Array.from({ length: VH }, () => Array(W).fill(null));
      const capMask = Array.from({ length: VH }, () => Array(W).fill(false));

      // 1) Đế 2.5D đơn giản + viền đen 1px pixel-perfect ôm quanh chân đế
      for (let d = DEPTH; d >= 1; d--) {
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          if (!at(x, y)) continue;
          baseGrid[y + d][x] = pal.side;
          baseMask[y + d][x] = true;
        }
      }
      addAsepriteOutline(baseGrid, VH, baseMask, pal.side);

      // 2) Mặt trên 2.5D phẳng đơn giản + viền đen 1px pixel-perfect ôm quanh mặt nút
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (!at(x, y)) continue;
        capGrid[y][x] = !at(x, y - 1) ? pal.hi : pal.base;
        capMask[y][x] = true;
      }
      addAsepriteOutline(capGrid, VH, capMask, pal.base);

      return {
        well: `<svg viewBox="0 0 ${W} ${VH}" shape-rendering="crispEdges" aria-hidden="true">${runs(baseGrid, VH)}</svg>`,
        cap: `<svg viewBox="0 0 ${W} ${VH}" shape-rendering="crispEdges" aria-hidden="true">${runs(capGrid, VH)}</svg>`

          localStorage.setItem("vina_theme_v6", "1"); localStorage.setItem("vina_theme_v5", "1");
          return /night|plum/.test(saved || "") ? "plum_night" : "pastel_day";
