        return normalizeThemeKey(saved);
      });

      // UI States
      const [activeTab, setActiveTab] = useState("overview"); 
      const [subTab, setSubTab] = useState("wallet"); // wallet, debts
      const [isAddTxModalOpen, setIsAddTxModalOpen] = useState(false);
      const [addTxType, setAddTxType] = useState("EXPENSE");
      const [tvChannel, setTvChannelRaw] = useState(() => { try { return Number(localStorage.getItem("vina_tv_ch")) || 0; } catch (e) { return 0; } });
      const setTvChannel = (v) => { setTvChannelRaw(v); try { localStorage.setItem("vina_tv_ch", String(v)); } catch (e) {} };
      const [editingTx, setEditingTx] = useState(null);
      const [isOcrScanning, setIsOcrScanning] = useState(false);
      const ocrFileInputRef = React.useRef(null);
      const [isOwnedAssetsExpanded, setIsOwnedAssetsExpanded] = useState(false);
      const [isAddBankModalOpen, setIsAddBankModalOpen] = useState(false);
      const [editingBank, setEditingBank] = useState(null);
      const [bankNameType, setBankNameType] = useState("preset"); // "preset" or "custom"
      const [bankKind, setBankKind] = useState("account"); // "account" | "credit"
      useEffect(() => { if (isAddBankModalOpen) setBankKind(editingBank && editingBank.kind === "credit" ? "credit" : "account"); }, [isAddBankModalOpen, editingBank]);
      const [txParentFilter, setTxParentFilter] = useState("Tất cả");

      // Reports State
      const [reportType, setReportType] = useState(() => localStorage.getItem("vina_report_type") || "Chi tiêu"); // "Chi tiêu" | "Thu nhập"
      const [reportPeriod, setReportPeriod] = useState(() => { const v = localStorage.getItem("vina_report_period"); return v === "Tháng" || v === "Năm" ? v : (v ? "Ngày" : "Tháng"); }); // "Ngày", "Tháng", "Năm"
      const [reportAccount, setReportAccount] = useState("Tất cả");
      const pad2 = (n) => String(n).padStart(2, "0");
      const todayKey = () => { const n = new Date(); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`; };
      const [reportDay, setReportDay] = useState(todayKey());
      const [reportMonth, setReportMonth] = useState(todayKey().slice(0, 7));
      const [reportYear, setReportYear] = useState(new Date().getFullYear());
      const [reportFrom, setReportFrom] = useState(todayKey().slice(0, 8) + "01");
      const [reportTo, setReportTo] = useState(todayKey());
      const [reportSearch, setReportSearch] = useState("");
      const [reportHierarchyView, setReportHierarchyView] = useState(() => localStorage.getItem("vina_report_hview") || "parent"); // "parent" | "child"
      const [drillDownParent, setDrillDownParent] = useState(null); // string or null

      const [showSettingsDialog, setShowSettingsDialog] = useState(false);
      
      const [googleUser, setGoogleUser] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem("vina_google_user"));
          if (stored && stored.email) return stored;
          return null;
        } catch(e) { 
          return null; 
        }
      });
      const [autoCloudSync, setAutoCloudSync] = useState(() => localStorage.getItem("vina_auto_cloud_sync") !== "false");
      const [lastSyncTime, setLastSyncTime] = useState(() => localStorage.getItem("vina_last_google_sync") || null);
      const [lastBackupTime, setLastBackupTime] = useState(() => localStorage.getItem("vina_last_backup_time") || null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isRealtimeLive, setIsRealtimeLive] = useState(false);
      const [syncMessage, setSyncMessage] = useState(null);
      const [syncStatusDetail, setSyncStatusDetail] = useState("");
      const [restoreTrigger, setRestoreTrigger] = useState(0);
      const lastLocalEditTime = React.useRef(0);
      const isApplyingRemoteUpdate = React.useRef(false);
      // Chỉ cho phép đẩy dữ liệu lên Firebase SAU khi đã kéo bản cloud về ít nhất 1 lần,
      // để máy mới/máy cũ không ghi đè bản mới hơn của máy khác bằng dữ liệu lỗi thời.
      const isFirstAutoPushRun = React.useRef(true);
      // Danh sách id giao dịch đã xoá (tombstone) để lệnh xoá trên 1 máy không bị máy khác "hồi sinh".
      const deletedTxIdsRef = React.useRef((() => { try { return JSON.parse(localStorage.getItem("vina_deleted_tx_ids") || "[]"); } catch(e) { return []; } })());
      const addDeletedTxIds = (ids) => {
        const set = new Set([...deletedTxIdsRef.current, ...ids]);
        deletedTxIdsRef.current = Array.from(set).slice(-5000);
        try { localStorage.setItem("vina_deleted_tx_ids", JSON.stringify(deletedTxIdsRef.current)); } catch(e) {}
      };
      const googleUserRef = React.useRef(null);


      // ==========================================
      // MAI – TRỢ LÝ ĐỌC THÔNG BÁO GIAO DỊCH (OFFLINE)
      // ==========================================
      const isAndroidApp = typeof window !== "undefined" && !!window.MaiBridge;
      const canListen = isAndroidApp && (() => { try { return window.MaiBridge.canListen ? !!window.MaiBridge.canListen() : true; } catch(e) { return true; } })();
      const [maiSettings, setMaiSettings] = useState(() => ({ autoSave: true, speak: false, syncBalance: true, cloudLearn: true, community: false, ...safeJsonParse("vina_mai_settings", {}) }));
      const [maiInbox, setMaiInbox] = useState(() => safeJsonParse("vina_mai_inbox", []));
      const [maiMemory, setMaiMemory] = useState(() => safeJsonParse("vina_mai_memory", {}));
      // Không còn "bộ não" riêng: Gemini phân tích; những lần anh sửa được gửi kèm cho Gemini làm ví dụ
      const maiBrain = null;
      const [gemExamples, setGemExamples] = useState(() => safeJsonParse("vina_gem_examples", []));
      const [gemQueue, setGemQueue] = useState(() => safeJsonParse("vina_gem_queue", []));
      const [gemStatus, setGemStatus] = useState({ busy: false, at: 0, error: null, lastOk: 0 });
      const [gemKeyInput, setGemKeyInput] = useState("");
      const [gemPaste, setGemPaste] = useState("");
      const [maiLog, setMaiLog] = useState(() => safeJsonParse("vina_mai_log", []));
      const [maiDraft, setMaiDraft] = useState(null);
      const [maiAccess, setMaiAccess] = useState(() => { try { return !!(window.MaiBridge && window.MaiBridge.hasNotificationAccess()); } catch(e) { return false; } });
      const maiSeenRef = React.useRef(safeJsonParse("vina_mai_seen", []));
      const stateRef = React.useRef({});
      const maiCommunity = null;
      stateRef.current = { accounts, categories, maiMemory, maiSettings, transactions, gemExamples };
      const maiOpts = () => ({});

      useEffect(() => { localStorage.setItem("vina_mai_settings", JSON.stringify(maiSettings)); }, [maiSettings]);
      useEffect(() => { localStorage.setItem("vina_mai_inbox", JSON.stringify(maiInbox.slice(0, 100))); }, [maiInbox]);
      useEffect(() => { localStorage.setItem("vina_mai_memory", JSON.stringify(maiMemory)); }, [maiMemory]);
      useEffect(() => { try { localStorage.setItem("vina_gem_examples", JSON.stringify(gemExamples.slice(0, 60))); } catch(e) {} }, [gemExamples]);
      useEffect(() => { try { localStorage.setItem("vina_gem_queue", JSON.stringify(gemQueue.slice(0, 200))); } catch(e) {} }, [gemQueue]);
      // Ghi nhớ lần anh sửa -> gửi kèm cho Gemini làm ví dụ ở những lần sau.
      // examples = [{ text, category, type, weight }]: chỉ lưu khi anh SỬA (weight >= 3); ignoreText = tin anh bấm bỏ qua
      const maiTeach = (examples, ignoreText) => {
        const add = [];
        (examples || []).forEach(ex => {
          const text = String(ex && ex.text || "").replace(/\s+/g, " ").trim().slice(0, 160);
          if (!ex || (ex.weight || 1) < 3 || !text || !(ex.category || ex.typeFix)) return;
          add.push({ text, category: ex.category || (ex.typeFix === "INCOME" ? "khoản thu" : "khoản chi"), type: ex.typeFix || ex.type, at: Date.now() });
        });
        if (ignoreText) add.push({ text: String(ignoreText).replace(/\s+/g, " ").trim().slice(0, 160), ignore: true, at: Date.now() });
        if (!add.length) return;
        setGemExamples(prev => [...add, ...prev.filter(p => !add.some(a => a.text === p.text))].slice(0, 60));
      };
      useEffect(() => { localStorage.setItem("vina_mai_log", JSON.stringify(maiLog.slice(0, 60))); }, [maiLog]);
      const maiSpeak = (text) => {
        if (!stateRef.current.maiSettings.speak) return;
        try {
          if (window.MaiBridge && window.MaiBridge.speak) window.MaiBridge.speak(text);
          else if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(text); u.lang = "vi-VN"; window.speechSynthesis.speak(u); }
        } catch(e) {}
      };

      const foldName = (s) => (window.MaiAgent ? window.MaiAgent.fold(String(s || "")) : String(s || "").toLowerCase()).replace(/[^a-z0-9]/g, "");
      const parseBankSelection = (val) => {
        const s = String(val || "");
        if (s.startsWith("legacy:")) return { bankId: null, bankName: s.slice(7), account: null };
        const accs = stateRef.current.accounts || [];
        const acc = accs.find(a => String(a.id) === s) || accs.find(a => a.name === s) || null;
        return { bankId: acc ? acc.id : null, bankName: acc ? acc.name : s, account: acc };
      };
      // Tìm ví khớp với ngân hàng / 4 số cuối tài khoản / loại thẻ tín dụng trong thông báo
      const maiMatchAccount = (r, accs) => {
        if (!accs || !accs.length || !r) return null;
        const bankKey = r.bank ? foldName(r.bank).replace(/^vi/, "") : "";
        const cleanTail = r.accountTail ? String(r.accountTail).replace(/\D/g, "") : "";
        const nameMatches = (a) => {
          if (!bankKey) return false;
          const n = foldName(a.name);
          if (n && (n.includes(bankKey) || bankKey.includes(n.replace(/^vi/, "")))) return true;
          const lg = getBankLogo(a.name);
          return !!(lg && lg === getBankLogo(r.bank));
        };
        if (cleanTail) {
          const tailMatches = accs.filter(a => a.accountNo && String(a.accountNo).replace(/\D/g, "").endsWith(cleanTail));
          if (tailMatches.length === 1) return tailMatches[0];
          if (tailMatches.length > 1) {
            return tailMatches.find(nameMatches)
              || tailMatches.find(a => typeof r.isCredit === "boolean" && isCreditAcc(a) === r.isCredit)
              || tailMatches[0];
          }
        }
        if (r.bank) {
          const nm = accs.filter(nameMatches);
          if (nm.length) {
            if (typeof r.isCredit === "boolean") {
              const byKind = nm.find(a => isCreditAcc(a) === r.isCredit);
              if (byKind) return byKind;
            }
            return nm[0];
          }
          if (/tienmat|cash/i.test(foldName(r.bank))) {
            const c = accs.find(isCashAcc);
            if (c) return c;
          }
        }
        return null;
      };
      // Hạng mục gợi ý phải tồn tại trong cây hạng mục hiện tại của người dùng
      const maiResolveCategory = (name, type, cats) => {
        const has = (n) => cats.some(c => c && c.name === n);
        if (name && has(name)) return name;
        const parent = name && DEFAULT_CATEGORY_PARENT_MAP[name];
        if (parent && has(parent)) return parent;
        const fallback = type === "INCOME" ? "Lương & Thu nhập" : "Khác";
        return has(fallback) ? fallback : (cats.find(c => c && c.isParent)?.name || name || "Khác");
      };

      // Ghi 1 kết quả của Mai vào sổ. Dùng setState dạng hàm để nhiều thông báo đến cùng lúc không đè nhau.
      const maiCommit = (draft, opts = {}) => {
        const { accounts: accs, categories: cats } = stateRef.current;
        const amount = Math.round(Number(draft.amount) || 0);
        if (!(amount > 0)) { showToast("Số tiền chưa hợp lệ", "error"); return null; }
        const type = draft.type === "INCOME" ? "INCOME" : "EXPENSE";
        const category = maiResolveCategory(draft.category, type, cats);
        let targetAcc = resolveAccount(accs, draft) || (!draft.bankName ? maiMatchAccount(draft, accs) : null);
        let bankName = targetAcc ? targetAcc.name : draft.bankName;
        let bankId = targetAcc ? targetAcc.id : null;
        let createdAccount = null;
        if (!targetAcc) {
          if (draft.bank && !draft.bankName) {
            const eff = type === "INCOME" ? amount : -amount;
            const creditCard = !!draft.isCredit;
            let initBal = 0;
            if (draft.balance != null) {
              initBal = draft.balanceKind === "debt"
                ? -Math.abs(draft.balance) - eff
                : draft.balanceKind === "available"
                  ? 0
                  : draft.balance - eff;
            }
            createdAccount = {
              id: Date.now() + Math.floor(Math.random() * 1000),
              name: draft.bank,
              accountNo: draft.accountTail ? `xxxx${draft.accountTail}` : "N/A",
              kind: creditCard ? "credit" : "account",
              balance: initBal
            };
            bankId = createdAccount.id;
            bankName = createdAccount.name;
            targetAcc = createdAccount;
          } else if (!bankName) {
            targetAcc = accs[0] || null;
            bankId = targetAcc ? targetAcc.id : null;
            bankName = (targetAcc && targetAcc.name) || "Tiền mặt";
          }
        }
        const tx = {
          id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
          type, amount, category, bankName,
          ...(bankId != null ? { bankId } : {}),
          note: (draft.note || "").slice(0, 140),
          date: draft.date || new Date().toISOString(),
          updatedAt: Date.now(),
          source: "mai",
          maiKey: draft.memoryKey || null,
          maiText: draft.learnText != null ? draft.learnText : null,
          maiConfidence: draft.confidence || null
        };
        const eff = type === "INCOME" ? amount : -amount;
        lastLocalEditTime.current = Date.now();
        setAccounts(prev => {
          const exists = targetAcc && prev.some(a => a.id === targetAcc.id);
          const list = createdAccount && !exists ? [...prev, createdAccount] : prev;
          const matchAcc = (a) => targetAcc ? a.id === targetAcc.id : a.name === bankName;
          let matchedOnce = false;
          return list.map(a => {
            if (matchedOnce || !matchAcc(a)) return a;
            matchedOnce = true;
            // Số dư trong thông báo là số liệu thật của ngân hàng -> khớp theo, nếu được bật
            if (stateRef.current.maiSettings.syncBalance && draft.balance != null && !draft.edited) {
              if (isCreditAcc(a)) {
                if (draft.balanceKind === "debt") return { ...a, balance: -Math.abs(draft.balance) };
                return Number(a.limit) > 0 ? { ...a, balance: Math.min(0, draft.balance - Number(a.limit)) } : { ...a, balance: (Number(a.balance) || 0) + eff };
              }
              if (draft.balanceKind === "debt" || draft.balanceKind === "available") {
                return { ...a, balance: (Number(a.balance) || 0) + eff };
              }
              return { ...a, balance: draft.balance };
            }
            return { ...a, balance: (Number(a.balance) || 0) + eff };
          });
        });
        setTransactions(prev => [tx, ...prev]);
        // Học: anh sửa (chấn chỉnh) -> nhớ mạnh; anh duyệt nguyên -> củng cố nhẹ. Mai tự ghi thì không tự học (tránh tự tin sai).
        if (!opts.auto) maiTeach([{ text: draft.learnText != null && !draft.noteEdited ? draft.learnText : [draft.rawNote, draft.counterparty, draft.note].filter(Boolean).join(" "), key: draft.memoryKey, label: maiKeyLabel(draft), category, type,
          weight: (draft.categoryEdited || draft.typeEdited) ? 3 : 1, typeFix: draft.typeEdited ? type : null }]);
        setMaiLog(prev => [{ id: tx.id, at: Date.now(), amount, type, category, bankName, bankId, note: tx.note, auto: !!opts.auto }, ...prev].slice(0, 60));
        if (!opts.silent) showToast(`Đã tự ghi ${type === "INCOME" ? "+" : "-"}${formatVND(amount)} · ${category}`);
        maiSpeak(`${type === "INCOME" ? "Nhận" : "Chi"} ${new Intl.NumberFormat('vi-VN').format(amount)} đồng, ${category}`);
        return tx;
      };

      // Ghi hàng loạt nhiều giao dịch cùng lúc (từ chọn nhiều ảnh / duyệt nhanh tất cả) — cộng dồn số dư chính xác trong 1 lần lưu
      const maiCommitBatch = (draftList, opts = {}) => {
        const list = (draftList || []).filter(d => d && Math.round(Number(d.amount) || 0) > 0);
        if (!list.length) { showToast("Chưa có giao dịch hợp lệ để ghi", "error"); return []; }
        const { accounts: curAccs, transactions: curTxs, categories: cats } = stateRef.current;
        let nextAccs = curAccs.map(a => ({ ...a }));
        const createdTxs = [];
        const logEntries = [];
        const teachItems = [];
        const nowBase = Date.now();
        list.forEach((draft, idx) => {
          const amount = Math.round(Number(draft.amount) || 0);
          const type = draft.type === "INCOME" ? "INCOME" : "EXPENSE";
          const category = maiResolveCategory(draft.category, type, cats);
          let targetAcc = resolveAccount(nextAccs, draft) || (!draft.bankName ? maiMatchAccount(draft, nextAccs) : null);
          let bankName = targetAcc ? targetAcc.name : draft.bankName;
          let bankId = targetAcc ? targetAcc.id : null;
          if (!targetAcc) {
            if (draft.bank && !draft.bankName) {
              const createdAccount = {
                id: nowBase + idx * 17 + Math.floor(Math.random() * 10),
                name: draft.bank,
                accountNo: draft.accountTail ? `xxxx${draft.accountTail}` : "N/A",
                kind: draft.isCredit ? "credit" : "account",
                balance: 0
              };
              nextAccs.push(createdAccount);
              targetAcc = createdAccount;
              bankId = createdAccount.id;
              bankName = createdAccount.name;
            } else if (!bankName) {
              targetAcc = nextAccs[0] || null;
              bankId = targetAcc ? targetAcc.id : null;
              bankName = (targetAcc && targetAcc.name) || "Tiền mặt";
            }
          }
          const eff = type === "INCOME" ? amount : -amount;
          let matchedOnce = false;
          nextAccs = nextAccs.map(a => {
            if (matchedOnce) return a;
            const hit = targetAcc ? a.id === targetAcc.id : a.name === bankName;
            if (!hit) return a;
            matchedOnce = true;
            return { ...a, balance: (Number(a.balance) || 0) + eff };
          });
          const tx = {
            id: nowBase * 1000 + idx * 10 + Math.floor(Math.random() * 10),
            type, amount, category, bankName,
            ...(bankId != null ? { bankId } : {}),
            note: (draft.note || "").slice(0, 140),
            date: draft.date || new Date(nowBase + idx).toISOString(),
            updatedAt: nowBase,
            source: "mai",
            maiKey: draft.memoryKey || null,
            maiText: draft.learnText != null ? draft.learnText : null,
            maiConfidence: draft.confidence || null
          };
          createdTxs.push(tx);
          logEntries.push({ id: tx.id, at: nowBase, amount, type, category, bankName, bankId, note: tx.note, auto: !!opts.auto });
          if (!opts.auto) {
            const txt = draft.learnText != null && !draft.noteEdited ? draft.learnText : [draft.rawNote, draft.counterparty, draft.note].filter(Boolean).join(" ");
            if (txt) teachItems.push({ text: txt, key: draft.memoryKey, label: maiKeyLabel(draft), category, type, weight: (draft.categoryEdited || draft.typeEdited) ? 3 : 1, typeFix: draft.typeEdited ? type : null });
          }
        });
        updateData(nextAccs, [...createdTxs, ...curTxs], null, null);
        if (teachItems.length) maiTeach(teachItems);
        setMaiLog(prev => [...logEntries, ...prev].slice(0, 60));
        if (!opts.silent) showToast(`Đã ghi thành công ${createdTxs.length} giao dịch vào sổ!`);
        return createdTxs;
      };

      // Nhận 1 thông báo thô (từ Android hoặc dán tay) -> phân tích -> chống trùng -> ghi / chờ duyệt
      // Tên dễ hiểu cho điều Mai học (khoản không có nội dung thì nhớ theo ngân hàng + số tiền)
      const maiKeyLabel = (d) => {
        const k = d.memoryKey || d.maiKey || "";
        if (k.indexOf("amt:") === 0) return `${d.bank || d.bankName || "Ngân hàng"} ${new Intl.NumberFormat("vi-VN").format(d.amount)}đ`;
        return d.note || d.rawNote || k;
      };
      // Anh sửa 1 giao dịch đã ghi -> Mai nhớ mạnh để lần sau đúng ngay
      const maiLearnFix = (tx, category, typeFix) => {
        if (!window.MaiAgent) return;
        const key = tx.maiKey || window.MaiAgent.memoryKey(null, tx.note);
        if (!key) return;
        maiTeach([{ text: tx.maiText != null ? tx.maiText : tx.note, key, label: maiKeyLabel(tx), category: category || null,
          type: typeFix || tx.type, weight: 3, typeFix: typeFix || null }]);
      };
      // Nhận 1 thông báo thô (từ Android hoặc dán tay) -> Bước 1 lọc nguồn app tài chính + Bước 2 lọc nội dung không phải tiền -> xếp hàng phân tích
      const GEM_SKIP = { empty: 1, no_amount: 1, otp: 1, not_bank_source: 1, promo: 1, account_notice: 1, failed_or_pending: 1, reminder: 1, not_transfer: 1 };
      const maiIngest = (raw, source = "notification") => {
        if (!window.MaiAgent) return { status: "error" };
        const { maiSettings: st, maiMemory: mem, maiBrain: br, maiCommunity: com, accounts: accs } = stateRef.current;
        const n = typeof raw === "string" ? { packageName: null, title: "", text: raw, postTime: Date.now() } : { packageName: raw.packageName || null, title: raw.title || "", text: raw.text || raw.body || "", postTime: raw.postTime || Date.now() };
        // Phân tích 2 bước trên máy: vừa lọc chuẩn app tài chính/nội dung vừa chuẩn bị kết quả dự phòng khi mất mạng hoặc hết lượt Gemini
        const r = window.MaiAgent.parse(n, { loose: source !== "notification", memory: mem, brain: br, community: st.community ? com : null });
        const fxPass = r.reason === "no_amount" && r.hasForeignMoney && (source !== "notification" || window.MaiAgent.isFinancialSource(n)) && window.VinaGemini && window.VinaGemini.hasKey();
        if (!r.ok && !fxPass && GEM_SKIP[r.reason]) {
          return { status: "ignored", reason: r.reason };
        }
        if (window.MaiAgent.isBlocked(r.raw, n.packageName, st.blockWords)) return { status: "ignored", reason: "user_block" };
        if (r.ok && br && window.MaiAgent.shouldIgnore(br, r.signature)) return { status: "ignored", reason: "user_ignored_pattern" };
        const now = Date.now();

      const lockVoiceOn = () => { try { return !!(window.MaiBridge && window.MaiBridge.isLockVoice && window.MaiBridge.isLockVoice()); } catch (e) { return false; } };
      const [lockVoice, setLockVoice] = useState(lockVoiceOn);
      useEffect(() => { window.onMaiVoiceService = (on) => setLockVoice(!!on); return () => { window.onMaiVoiceService = null; }; }, []);
      // bật lại dịch vụ khi mở app (nếu anh đã bật mà Android tắt nó đi)
      useEffect(() => { if (maiSettings.voiceLock && window.MaiBridge && window.MaiBridge.startLockVoice && !lockVoiceOn()) { try { window.MaiBridge.startLockVoice(); } catch (e) {} } }, []);
      const [lockPerm, setLockPerm] = useState({ battery: true, full: true });
      const refreshLockPerm = () => { try { setLockPerm({ battery: !window.MaiBridge.batteryUnrestricted || !!window.MaiBridge.batteryUnrestricted(), full: !window.MaiBridge.canFullScreen || !!window.MaiBridge.canFullScreen() }); } catch (e) {} };
      useEffect(() => { if (!window.MaiBridge) return; refreshLockPerm(); const on = () => { if (document.visibilityState === "visible") refreshLockPerm(); }; document.addEventListener("visibilitychange", on); return () => document.removeEventListener("visibilitychange", on); }, []);
      const setVoiceLock = (on) => {
        setMaiSettings(prev => ({ ...prev, voiceLock: on, ...(on ? { voiceWake: false } : {}) }));
        try { on ? window.MaiBridge.startLockVoice() : window.MaiBridge.stopLockVoice(); } catch (e) {}
        if (on) { voiceStop(); showToast("Mai sẽ nghe “Mai ơi” cả khi khoá màn hình. Có thông báo “Mai đang nghe” để anh tắt nhanh.", "info"); }
      };
      const voiceUndo = () => {
        // huỷ cùng lúc mọi khoản vừa ghi bằng giọng nói (gọi maiUndo từng khoản sẽ ghi đè lẫn nhau)
        const ids = new Set((voice.result || []).map(t => t.id));
        const { transactions: txs, accounts: accs } = stateRef.current;
        const gone = txs.filter(t => ids.has(t.id));
        if (gone.length) {
          addDeletedTxIds(gone.map(t => t.id));
          const delta = {};
          gone.forEach(t => {
            const target = resolveAccount(accs, t);
            const key = target ? `id:${target.id}` : `name:${t.bankName}`;
            delta[key] = (delta[key] || 0) + (t.type === "INCOME" ? -t.amount : t.amount);
          });
          const touchedNames = new Set();
          updateData(accs.map(a => {
            const byId = delta[`id:${a.id}`] || 0;
            const byName = !touchedNames.has(a.name) && delta[`name:${a.name}`] ? (touchedNames.add(a.name), delta[`name:${a.name}`]) : 0;
            const d = byId + byName;
            return d ? { ...a, balance: (Number(a.balance) || 0) + d } : a;
          }), txs.filter(t => !ids.has(t.id)), null, null);
          setMaiLog(prev => prev.filter(x => !ids.has(x.id)));
        }
        setVoice(v => ({ ...v, state: "idle", result: null }));
        sayNow("Dạ, Mai bỏ rồi ạ");
      };

      // Ảnh chụp màn hình (biên lai, lịch sử giao dịch, hoá đơn) -> Gemini đọc 1 hoặc nhiều ảnh -> phiếu xác nhận / ghi hàng loạt
      const [gemImgBusy, setGemImgBusy] = useState(false);
      const [batchImageDrafts, setBatchImageDrafts] = useState(null);
      const [batchPicker, setBatchPicker] = useState(null);
      const gemImgInputRef = React.useRef(null);
      const prepareBatchDrafts = (rawList) => {
        const { accounts: accs, categories: cats } = stateRef.current;
        const fallbackAcc = accs[0] || null;
        return (rawList || []).map((d, idx) => {
          const acc = resolveAccount(accs, d) || maiMatchAccount(d, accs) || (!d.bank ? fallbackAcc : null);
          return {
            ...d,
            _bid: d._bid || `bd_${Date.now().toString(36)}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            selected: d.selected !== false,
            type: d.type === "INCOME" ? "INCOME" : "EXPENSE",
            amount: Math.round(Number(d.amount) || 0),
            category: maiResolveCategory(d.category, d.type, cats),
            bankId: acc ? acc.id : (d.bankId != null ? d.bankId : null),
            bankName: acc ? acc.name : (d.bankName || d.bank || (fallbackAcc ? fallbackAcc.name : "Tiền mặt")),
            isCredit: acc ? isCreditAcc(acc) : !!d.isCredit,
            date: d.date || new Date().toISOString(),
            note: d.note || ""
          };
        });
      };
      const gemAnalyzeImages = async (files) => {
        const list = Array.from(files || []).filter(f => f && /^image\//.test(f.type || "image/"));
        if (!list.length) return 0;
        if (!window.VinaGemini || !window.VinaGemini.hasKey()) throw Object.assign(new Error("no key"), { code: "no_key" });
        setGemImgBusy(true);
        try {
          const drafts = []; let dup = 0; let failed = 0; let lastErr = null;
          for (let i = 0; i < list.length; i++) {
            showToast(list.length > 1 ? `Gemini đang đọc ảnh ${i + 1}/${list.length}…` : "Gemini đang đọc ảnh…", "info");
            try {
              const img = await window.VinaGemini.prepareImage(list[i]);
              const res = await window.VinaGemini.analyzeImage(img, gemContext());
              const now = Date.now();
              res.forEach((g, k) => {
                const d = gemDraft({ id: `img${now.toString(36)}_${i}_${k}`, title: "", text: "", source: "image", at: now, postTime: now, local: null }, g);
                if (!d) return;
                // số dư trong ảnh cũ có thể đã lỗi thời -> không dùng để chỉnh số dư ví
                d.balance = null;
                d.imgLabel = list.length > 1 ? `Ảnh ${i + 1}/${list.length}` : (list[i].name || "Ảnh chụp");
                d.raw = `Ảnh chụp (${d.imgLabel}): ${list[i].name || "ảnh"}${g.note ? ` · ${g.note}` : ""}`;
                d.learnText = [g.note, g.account].filter(Boolean).join(" ");
                const t0 = new Date(d.date).getTime();
                // Chống trùng với lịch sử đã ghi VÀ trùng giữa các ảnh chụp màn hình chồng lên nhau trong cùng đợt
                const dupExisting = stateRef.current.transactions.some(t => t.type === d.type && Math.round(t.amount) === d.amount && Math.abs(new Date(t.date).getTime() - t0) < 10 * 60000);
                const dupInBatch = drafts.some(x => x.type === d.type && Math.round(x.amount) === d.amount && Math.abs(new Date(x.date).getTime() - t0) < 5 * 60000 && (x.note || "") === (d.note || ""));
                if (dupExisting || dupInBatch) { dup++; return; }
                drafts.push(d);
              });
            } catch (err) {
              failed++;
              lastErr = err;
              if (err && (err.code === "bad_key" || err.code === "offline" || err.code === "no_key")) throw err;
            }
          }
          if (!drafts.length && failed === list.length && lastErr) throw lastErr;
          if (drafts.length === 1 && list.length === 1) {
            setMaiDraft({ ...drafts[0], inboxId: null });
            showToast("Gemini đã đọc xong ảnh, anh kiểm tra lại rồi lưu nhé", "info");
          } else if (drafts.length) {
            setBatchImageDrafts(prepareBatchDrafts(drafts));
            showToast(`Tìm thấy ${drafts.length} giao dịch từ ${list.length - failed}/${list.length} ảnh${dup ? ` (bỏ ${dup} khoản trùng)` : ""} – bấm Ghi tất cả để lưu!`, "success");
          } else {
            showToast(dup ? `Các giao dịch trong ảnh đã được ghi rồi (${dup} khoản)` : "Gemini không thấy giao dịch nào trong ảnh", "info");
          }
          return drafts.length;
        } finally { setGemImgBusy(false); }
      };

      // Chuyển sang xử lý cục bộ trên máy khi chưa có Gemini key, mất mạng lâu, hết lượt hoặc lỗi
      const localApply = (jobs, reasonTag) => {
        const { maiSettings: st, categories: cats, accounts: accs } = stateRef.current;
        let saved = 0, inbox = 0, skip = 0;
        const doneIds = new Set(jobs.map(j => j.id));
        jobs.forEach(job => {
          const l = job.local;
          if (!l || !(l.amount > 0)) { skip++; return; }
          const acc = resolveAccount(accs, l) || maiMatchAccount(l, accs);
          const draft = {
            ok: true,
            amount: l.amount,
            type: l.type,
            bank: l.bank,
            bankName: acc ? acc.name : (l.bankName || null),
            bankId: acc ? acc.id : (l.bankId || null),
            accountTail: l.accountTail,
            isCredit: acc ? isCreditAcc(acc) : !!l.isCredit,
            balance: l.balance,
            balanceKind: l.balanceKind,
            date: l.date || new Date(job.postTime || Date.now()).toISOString(),
            note: l.note,
            rawNote: l.rawNote,
            counterparty: l.counterparty,
            category: maiResolveCategory(l.category, l.type, cats),
            categorySource: reasonTag,
            memoryKey: l.memoryKey,
            learnText: l.learnText,
            confidence: l.confidence || 0.7,
            certain: !!l.certain,
            raw: [job.title, job.text].filter(Boolean).join("\n"),
            source: job.source,
            receivedAt: job.at,
            inboxId: `mi_${job.id}`,
          };
          const thresh = (window.MaiAgent && window.MaiAgent.AUTO_SAVE_THRESHOLD) || 0.75;
          const canAuto = st.autoSave && (job.source === "notification" || job.source === "share") &&
            (draft.certain || (draft.confidence >= thresh && l.directionSource !== "default" && (!l.genericNote || l.balance != null)));
          if (canAuto) {
            maiCommit(draft, { auto: true, silent: true });
            saved++;
          } else {
            setMaiInbox(prev => [draft, ...prev.filter(x => x.inboxId !== draft.inboxId)].slice(0, 100));
            inbox++;
          }
        });
        setGemQueue(prev => prev.filter(j => !doneIds.has(j.id)));
        if (saved > 0) showToast(`Đã tự ghi ${saved} giao dịch trên máy${inbox ? ` · ${inbox} chờ duyệt` : ""}`);
        else if (inbox > 0) showToast(`Có ${inbox} giao dịch chờ anh duyệt`, "info");
        return { saved, inbox, skip };
      };

      useEffect(() => {
        if (gemBusyRef.current || !window.VinaGemini) return;
        const now = Date.now();
        const ready = gemQueue.filter(j => (j.nextAt || 0) <= now);
        if (!ready.length) return;
        // Gom tin nhanh 2.5 giây sau tin đầu tiên (trừ tin anh dán tay/chia sẻ)
        const oldest = Math.min(...ready.map(j => j.at || 0));
        if (!ready.some(j => j.source !== "notification") && now - oldest < 2500 && ready.length < 8) {
          const t = setTimeout(() => setGemTick(x => x + 1), 2500 - (now - oldest) + 150);
          return () => clearTimeout(t);
        }
        if (!window.VinaGemini.hasKey()) {
          const hasLoc = ready.filter(j => j.local);
          if (hasLoc.length) localApply(hasLoc, "local");
          const noLoc = new Set(ready.filter(j => !j.local).map(j => j.id));
          if (noLoc.size) setGemQueue(prev => prev.filter(j => !noLoc.has(j.id)));
          setGemStatus(s => ({ ...s, error: hasLoc.length ? null : "Chưa có Gemini API key — app đang dùng bộ phân tích trên máy." }));
          return;
        }
        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          if (ready.some(j => j.source === "notification") && now - oldest < 8000) {
            setGemStatus(s => ({ ...s, error: "Đang mất mạng – chờ chút rồi chuyển sang phân tích trên máy." }));
            const t = setTimeout(() => setGemTick(x => x + 1), 8000 - (now - oldest) + 200);
            return () => clearTimeout(t);
          }
          const hasLoc = ready.filter(j => j.local);
          if (hasLoc.length) localApply(hasLoc, "offline");
          const noLoc = new Set(ready.filter(j => !j.local).map(j => j.id));
          if (noLoc.size) setGemQueue(prev => prev.map(j => noLoc.has(j.id) ? { ...j, nextAt: now + 30000 } : j));
          setGemStatus(s => ({ ...s, error: "Đang mất mạng — đã phân tích thông báo trên máy." }));
          return;
        }
        const batch = ready.slice(0, 10);
        gemBusyRef.current = true;
        setGemStatus(s => ({ ...s, busy: true, at: Date.now(), count: batch.length, error: null }));
        window.VinaGemini.analyze(batch, gemContext()).then(results => {
          let saved = 0, inbox = 0, skip = 0;
          batch.forEach(job => {
            const g = results.find(x => x && x.id === job.id) || (batch.length === 1 ? results[0] : null);
            const r = gemApply(job, g);
            if (r === "saved") saved++; else if (r === "inbox") inbox++; else skip++;
          });
          const done = new Set(batch.map(j => j.id));
          setGemQueue(prev => prev.filter(j => !done.has(j.id)));
          setGemStatus(s => ({ ...s, busy: false, error: null, lastOk: Date.now() }));
          if (saved + inbox > 1) showToast(`Gemini xử lý ${batch.length} thông báo: ghi ${saved}, chờ duyệt ${inbox}${skip ? `, bỏ qua ${skip}` : ""}`);
          else if (inbox) showToast("Có 1 giao dịch chờ anh duyệt", "info");
        }).catch(err => {
          const msg = window.VinaGemini.explain(err);
          const waits = [10000, 25000];
          const immediateFallback = (err.code === "no_key" || err.code === "bad_key" || ((err.code === "quota" || err.allModels) && (err.retryMs || 0) > 120000));
          const dropSet = new Set();
          const retryMap = new Map();
          const failed = [];
          batch.forEach(j => {
            const tries = (j.tries || 0) + 1;
            if ((immediateFallback && j.local) || tries > waits.length) {
              dropSet.add(j.id);
              if (j.local) failed.push(j);
            } else if ((err.code === "quota" || err.allModels) && err.retryMs && err.code !== "network" && err.code !== "server") {
              retryMap.set(j.id, { tries, nextAt: Date.now() + err.retryMs + 5000 });
            } else {
              retryMap.set(j.id, { tries, nextAt: Date.now() + waits[Math.min(tries - 1, waits.length - 1)] });
            }
          });
          if (dropSet.size || retryMap.size) {
            setGemQueue(prev => prev.filter(j => !dropSet.has(j.id)).map(j => retryMap.has(j.id) ? { ...j, ...retryMap.get(j.id) } : j));
          }
          if (failed.length) localApply(failed, immediateFallback ? "local" : "failed");
          setGemStatus(s => ({ ...s, busy: false, error: msg }));
        }).finally(() => { gemBusyRef.current = false; setGemTick(x => x + 1); });
      }, [gemQueue, gemTick]);

      // Cầu nối Android: lấy hàng đợi thông báo, đăng nhập Google & nhận trực tiếp khi đang mở
      const applyNativeGoogleAuthRef = React.useRef(null);
      useEffect(() => {
        window.onMaiGoogleToken = (data) => {
          try {
            const parsed = typeof data === "string" ? JSON.parse(data) : data;
            if (applyNativeGoogleAuthRef.current) applyNativeGoogleAuthRef.current(parsed);
          } catch (e) { console.warn("Mai Google auth parse error", e); }
        };
        if (!window.MaiBridge) return () => { window.onMaiGoogleToken = null; };
        const drain = () => {
          try {
            if (window.MaiBridge.consumePendingGoogleAuth) {
              const gRaw = window.MaiBridge.consumePendingGoogleAuth();
              if (gRaw && window.onMaiGoogleToken) window.onMaiGoogleToken(gRaw);
            }
          } catch (e) { console.warn("Mai consume Google auth err", e); }
          try {
            const raw = window.MaiBridge.drainQueue();
            const list = raw ? JSON.parse(raw) : [];
            // câu nói nhận được khi khoá màn hình ("Mai ơi, ...") -> Gemini hiểu rồi ghi; còn lại là thông báo ngân hàng
            list.forEach(n => { if (n && n.packageName === "voice") { if (voiceRef.current.enqueue) voiceRef.current.enqueue(n.text, n.alts); } else maiIngest(n, "notification"); });
          } catch(e) { console.warn("Mai drain error", e); }
          try { setMaiAccess(!!window.MaiBridge.hasNotificationAccess()); } catch(e) {}
        };
        window.onMaiNotification = (json) => { try { maiIngest(typeof json === "string" ? JSON.parse(json) : json, "notification"); } catch(e) { console.warn(e); } };
        window.onMaiResume = drain;
        drain();
        const onVis = () => { if (document.visibilityState === "visible") drain(); };
        document.addEventListener("visibilitychange", onVis);
        return () => { document.removeEventListener("visibilitychange", onVis); window.onMaiNotification = null; window.onMaiResume = null; window.onMaiGoogleToken = null; };
      }, []);

      const maiCatType = (name) => (name === "Lương & Thu nhập" || DEFAULT_CATEGORY_PARENT_MAP[name] === "Lương & Thu nhập" || categories.some(c => c.name === name && c.parent === "Lương & Thu nhập")) ? "INCOME" : "EXPENSE";
      // Hạng mục hay dùng nhất của anh (theo chiều tiền) để chọn nhanh trong hộp chờ duyệt
      const maiQuickCats = (type, current) => {
        const ok = categories.filter(c => c && c.name && maiCatType(c.name) === (type === "INCOME" ? "INCOME" : "EXPENSE") && !categories.some(x => x && x.parent === c.name)).map(c => c.name);
        const freq = {};
        transactions.slice(0, 400).forEach(t => { if (ok.includes(t.category)) freq[t.category] = (freq[t.category] || 0) + 1; });
        // mục anh hay dùng trước; còn lại lấy xen kẽ mỗi nhóm lớn một mục cho đa dạng
        const used = ok.filter(c => freq[c] && c !== "Khác").sort((a, b) => freq[b] - freq[a]);
        const groups = {};
        ok.filter(c => !freq[c] && c !== "Khác").forEach(c => { const g = categoryParentMap[c] || categories.find(x => x.name === c)?.parent || c; (groups[g] = groups[g] || []).push(c); });
        const rr = []; const gl = Object.values(groups);
        for (let i = 0; rr.length < 12 && gl.some(g => g[i]); i++) gl.forEach(g => { if (g[i]) rr.push(g[i]); });
        const top = used.concat(rr).slice(0, 7);
        if (current && ok.includes(current) && current !== "Khác" && !top.includes(current)) top.unshift(current);
        return top.slice(0, 8);
      };
      const maiPickInbox = (item, category) => {
        const tx = maiCommit({ ...item, category, categoryEdited: category !== item.category || !item.certain });
        if (tx) setMaiInbox(prev => prev.filter(x => x.inboxId !== item.inboxId));
      };
      const maiApproveInbox = (item) => {
        const tx = maiCommit(item);
        if (tx) setMaiInbox(prev => prev.filter(x => x.inboxId !== item.inboxId));
      };
      const maiDismissInbox = (item) => {
        setMaiInbox(prev => prev.filter(x => x.inboxId !== item.inboxId));
        if (item.raw) { maiTeach(null, item.raw); showToast("Đã bỏ qua. Lần sau gặp tin giống vậy Gemini sẽ không ghi.", "info"); }
      };
      const maiUndo = (logItem) => {
        const tx = transactions.find(t => t.id === logItem.id);
        if (!tx) { setMaiLog(prev => prev.filter(x => x.id !== logItem.id)); return; }
        addDeletedTxIds([tx.id]);
        const eff = tx.type === "INCOME" ? -tx.amount : tx.amount;
        const target = resolveAccount(accounts, tx);
        let matchedOnce = false;
        updateData(accounts.map(a => {
          if (matchedOnce) return a;
          const hit = target ? a.id === target.id : a.name === tx.bankName;
          if (!hit) return a;
          matchedOnce = true;
          return { ...a, balance: (Number(a.balance) || 0) + eff };
        }), transactions.filter(t => t.id !== tx.id), null, null);
        setMaiLog(prev => prev.filter(x => x.id !== logItem.id));
        showToast("Đã hoàn tác giao dịch tự ghi", "info");
      };

      const parentCategories = React.useMemo(() => {
        const seen = new Set();
        return categories.filter(c => {
          if (!c || !c.name) return false;
          const isP = c.isParent || (!c.parent && !categoryParentMap[c.name]);
          if (!isP) return false;
          const key = c.name.trim().toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }, [categories, categoryParentMap]);

      const subCategories = React.useMemo(() => {
        const seen = new Set();
        return categories.filter(c => {
          if (!c || !c.name) return false;
          const isP = c.isParent || (!c.parent && !categoryParentMap[c.name]);
          if (isP) return false;
          const key = c.name.trim().toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }, [categories, categoryParentMap]);

      // Tổng hợp sổ nợ theo từng người: mỗi người có thể có nhiều khoản vay/cho vay rải rác
      // theo thời gian — gộp lại để biết ròng rã đang nợ ai bao nhiêu, hoặc ai đang nợ mình.
      const debtsByPerson = React.useMemo(() => {
        const map = {};
        debts.forEach(d => {
          const key = (d.title || "").trim() || "Không rõ tên";
          if (!map[key]) {
            map[key] = { name: key, oweThemUnpaid: 0, theyOweMeUnpaid: 0, owePaidTotal: 0, theyOwePaidTotal: 0, entries: [] };
          }
          const bucket = map[key];
          bucket.entries.push(d);
          if (d.type === "VAY") {
            if (d.isPaid) bucket.owePaidTotal += d.amount; else bucket.oweThemUnpaid += d.amount;
          } else {
            if (d.isPaid) bucket.theyOwePaidTotal += d.amount; else bucket.theyOweMeUnpaid += d.amount;
          }
        });
        return Object.values(map)
          .map(p => ({
            ...p,
            net: p.theyOweMeUnpaid - p.oweThemUnpaid,
            entries: p.entries.slice().sort((a, b) => new Date(b.date) - new Date(a.date))
          }))
          .sort((a, b) => Math.abs(b.net) - Math.abs(a.net) || b.entries.length - a.entries.length);
      }, [debts]);

      const getIconForCategoryName = (catName) => {
          const cat = categories.find(c => c.name === catName);
          if (cat && cat.icon) return cat.icon;
          const parentName = categoryParentMap[catName];
          if (parentName) {
            const parentCat = categories.find(c => c.name === parentName);
            if (parentCat && parentCat.icon) return parentCat.icon;
          }
          return getCategoryIcon(catName) || "tag";
      };

      // ===== Điều hướng & Trợ năng "Vuốt để quay lại" toàn app =====

      const mainScrollRef = React.useRef(null);

      const handleBack = () => {

      useEffect(() => {
        window.onAndroidBack = () => { try { return !!handleBackRef.current(); } catch (e) { return true; } };
        let sx = 0, sy = 0, lx = 0, ly = 0, tracking = false, fromLeft = true;
        const EDGE = 40;
        const THRESH = 56;
        const hasHorizontalScrollAncestor = (el) => {

          while (cur && cur !== document.body && cur !== document.documentElement) {

              const ox = window.getComputedStyle(cur).overflowX;
              if (ox === "auto" || ox === "scroll") return true;
            }
            cur = cur.parentElement;
          }
          return false;
        };
        const hidePill = () => {
          const p = swipePillRef.current;
          if (!p) return;
          p.style.opacity = "0";
          p.style.transform = "translateY(-50%) scale(0.8)";
        };
        const updatePill = (inward) => {
          const p = swipePillRef.current;
          if (!p) return;
          const progress = Math.max(0, Math.min(1, inward / THRESH));
          const ready = inward >= THRESH;
          p.style.left = fromLeft ? "10px" : "auto";
          p.style.right = fromLeft ? "auto" : "10px";
          p.style.opacity = String(progress > 0.15 ? 0.98 : 0);
          const shift = fromLeft ? (progress * 10 - 8) : (-progress * 10 + 8);
          p.style.transform = `translate(${shift}px, -50%) scale(${0.86 + progress * 0.14})`;
          p.style.background = ready ? "var(--income)" : "var(--accent)";
          p.style.color = ready ? "#FFFFFF" : "#1A1423";
          p.textContent = fromLeft ? "◀ LÙI" : "LÙI ▶";
        };
        const onStart = (e) => {
          if (!e.touches || e.touches.length !== 1) { tracking = false; return; }
          const t = e.touches[0];
          sx = lx = t.clientX; sy = ly = t.clientY;
          const w = window.innerWidth;
          const outerEdge = sx <= 18 || sx >= w - 18;
          fromLeft = sx <= EDGE;
          const inEdgeZone = sx <= EDGE || sx >= w - EDGE;
          if (!inEdgeZone) { tracking = false; return; }
          const tag = e.target && e.target.tagName;
          const onField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target.closest && e.target.closest("[data-no-swipe]"));
          if (!outerEdge && (onField || hasHorizontalScrollAncestor(e.target))) { tracking = false; return; }
          tracking = true;
        };
        const onMove = (e) => {
          if (!tracking || !e.touches || !e.touches[0]) return;
          const t = e.touches[0];

          tracking = false;
          if (cancelled) return;

      // Gộp dữ liệu 2 thiết bị thay vì ghi đè nhau. `base` là bên có thay đổi mới hơn (nguồn
      // chính cho ví, danh mục, ngân sách...), `other` là bên cũ hơn. Giao dịch được gộp theo id,
      // lệnh xoá (tombstone) luôn thắng, số dư ví được hiệu chỉnh theo phần giao dịch chênh lệch.
      const mergeFinancialData = (base, other) => {
        const eff = (t) => (t.type === "INCOME" ? t.amount : -t.amount) || 0;
        const deleted = new Set([...(base.deletedTxIds || []), ...(other.deletedTxIds || [])]);
        const baseTx = (base.transactions || []).filter(t => !deleted.has(t.id));
        const otherTx = (other.transactions || []).filter(t => !deleted.has(t.id));
        const baseAllIds = new Set((base.transactions || []).map(t => t.id));
        const otherById = new Map((other.transactions || []).map(t => [t.id, t]));
        const baseAccs = base.accounts || [];
        const delta = {}; // "id:<id>" hoặc "name:<tên>" -> chênh lệch số dư cần cộng vào ví của bên `base`
        const keyOf = (tx) => {
          const acc = resolveAccount(baseAccs, tx);
          return acc ? `id:${acc.id}` : `name:${tx.bankName}`;
        };
        const bump = (tx, v) => { const k = keyOf(tx); delta[k] = (delta[k] || 0) + v; };

        // Giao dịch bên base đã bị xoá ở bên kia -> trừ ảnh hưởng khỏi số dư
        (base.transactions || []).forEach(t => { if (deleted.has(t.id)) bump(t, -eff(t)); });
        // Giao dịch chỉ có bên kia -> thêm vào + cộng ảnh hưởng. Trùng id -> bản nào sửa sau thì thắng.
        const mergedTx = baseTx.map(t => {
          const o = otherById.get(t.id);
          if (o && (o.updatedAt || 0) > (t.updatedAt || 0)) {
            bump(t, -eff(t)); bump(o, eff(o));
            return o;
          }
          return t;
        });
        otherTx.forEach(t => { if (!baseAllIds.has(t.id)) { mergedTx.push(t); bump(t, eff(t)); } });
        mergedTx.sort((a, b) => new Date(b.date) - new Date(a.date));

        const touchedNames = new Set();
        const accounts = baseAccs.map(a => {
          const byId = delta[`id:${a.id}`] || 0;
          const byName = !touchedNames.has(a.name) && delta[`name:${a.name}`] ? (touchedNames.add(a.name), delta[`name:${a.name}`]) : 0;
          const d = byId + byName;
          return d ? { ...a, balance: (Number(a.balance) || 0) + d } : a;
        });
        return { ...base, accounts, transactions: mergedTx, deletedTxIds: Array.from(deleted) };
      };

      // Tài liệu Firestore lưu bản sao lưu của tài khoản Firebase đang đăng nhập.
