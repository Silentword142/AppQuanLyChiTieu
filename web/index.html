  <script>
    // Trong app Android, WebView không tải được link blob: -> chuyển sang hộp thoại "Lưu tệp" của Android
    (function () {
      if (!window.MaiBridge || !window.MaiBridge.saveFile) return;
      var orig = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function () {
        var href = this.href || "", name = this.getAttribute("download");
        if (name !== null && /^(blob:|data:)/.test(href)) {
          fetch(href).then(function (r) { return r.text(); }).then(function (t) {
            window.MaiBridge.saveFile(name || "vinaspends.json", "application/json", t);
          });
          return;
        }
        return orig.apply(this, arguments);
      };
    })();

                  className="w-full bg-theme-background border border-theme-border rounded-xl p-3.5 text-theme-textPrimary focus:border-theme-primary text-sm font-semibold shadow-inner transition-all" 
                />
              </div>

              {/* Hierarchy Selector */}
              <div className="bg-theme-background border border-theme-border p-3.5 rounded-2xl space-y-3 shadow-inner">
                <label className="flex items-center gap-2.5 cursor-pointer select-none">
                  <input 
                    type="checkbox" 
                    checked={isChild}
                    onChange={(e) => setIsChild(e.target.checked)}
                    className="w-4 h-4 accent-theme-primary rounded cursor-pointer" 
                  />
                  <span className="text-xs font-bold text-theme-textPrimary">Là Danh mục Nhỏ (Khoản chi tiêu con)</span>
                </label>

                {isChild && (
                  <div className="pt-2 border-t border-theme-border/60">
                    <label className="text-[11px] font-bold text-theme-textSecondary mb-1.5 block uppercase">Chọn Danh mục Lớn trực thuộc</label>
                    <select 
                      value={parentName} 
                      onChange={(e) => setParentName(e.target.value)}
                      className="w-full bg-theme-surface border border-theme-border rounded-xl p-2.5 text-xs font-bold text-theme-textPrimary focus:border-theme-primary transition-colors appearance-none">
                      {parentCategories.map(p => (
                        <option key={p.id} value={p.name}>{p.name}</option>
                      ))}
                    </select>
                  </div>
                )}
              </div>

              {/* COLOR SELECTION SECTION */}
              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-bold text-theme-textSecondary block uppercase tracking-wider">Chọn màu sắc biểu tượng</label>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-mono font-bold" style={{ color: selectedColor }}>{selectedColor}</span>
                    {/* Native Color Picker button */}
                    <label className="relative cursor-pointer flex items-center gap-1 text-[11px] font-bold text-theme-primary bg-theme-background hover:bg-theme-variant px-2 py-1 rounded-lg border border-theme-border transition-all">
                      <Icon name="palette" className="w-3.5 h-3.5" style={{ color: selectedColor }} />
                      <span>Tự pha màu</span>
                      <input 
                        type="color" 
                        value={selectedColor.startsWith("#") ? selectedColor : "#2F6F6A"}
                        onChange={(e) => setSelectedColor(e.target.value)}
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                    </label>
                  </div>
                </div>

                {/* Preset Color Swatches */}
                <div className="flex flex-wrap gap-2 p-2.5 bg-theme-background border border-theme-border rounded-2xl max-h-[110px] overflow-y-auto no-scrollbar shadow-inner">
                  {CATEGORY_COLOR_PALETTE.map(hex => {
                    const isSelected = selectedColor.toLowerCase() === hex.toLowerCase();
                    return (
                      <button
                        key={hex}
                        type="button"
                        onClick={() => setSelectedColor(hex)}
                        title={hex}
                        className={`w-7 h-7 rounded-xl transition-all flex items-center justify-center ${isSelected ? 'scale-110 shadow-md ring-2 ring-offset-2 ring-offset-theme-surface ring-theme-textPrimary' : 'hover:scale-105 opacity-90 hover:opacity-100'}`}
                        style={{ backgroundColor: hex }}>
                        {isSelected && <Icon name="check" className="w-3.5 h-3.5 text-white drop-shadow" />}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ICON SELECTION SECTION */}
              <div className="space-y-2">
                <div className="flex justify-between items-center">
                  <label className="text-xs font-bold text-theme-textSecondary block uppercase tracking-wider">
                    Chọn biểu tượng ({filteredIcons.length})
                  </label>
                  <span className="text-[11px] font-semibold text-theme-textSecondary">Đang chọn: <b className="text-theme-textPrimary font-mono">{selectedIcon}</b></span>
                </div>

                {/* Icon Search Box */}
                <div className="relative">
                  <Icon name="search" className="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-theme-textSecondary pointer-events-none" />
                  <input 
                    type="text" 
                    value={iconSearch}
                    onChange={(e) => setIconSearch(e.target.value)}
                    placeholder="Tìm nhanh icon (cafe, xe, nhà, tiền, gym, game...)"
                    className="w-full bg-theme-background border border-theme-border rounded-xl pl-8 pr-3 py-2 text-xs font-medium text-theme-textPrimary placeholder:text-theme-textSecondary focus:border-theme-primary transition-all"
                  />
                  {iconSearch && (
                    <button type="button" onClick={() => setIconSearch("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-theme-textSecondary hover:text-theme-textPrimary text-xs font-bold">
                      ✕
                    </button>
                  )}
                </div>

                {/* Icon Category Pills with Left / Right Navigation */}
                {!iconSearch && (
                  <IconGroupSelector 
                    iconGroups={ICON_GROUPS} 
                    selectedGroup={iconGroup} 
                    onSelectGroup={setIconGroup} 
                  />
                )}

                {/* Icon Grid */}
                <div className="grid grid-cols-6 sm:grid-cols-8 gap-2 max-h-[220px] overflow-y-auto no-scrollbar p-2 border border-theme-border rounded-2xl bg-theme-background shadow-inner">
                  {filteredIcons.map(iconName => {
                    const isSelected = selectedIcon === iconName;
                    return (
                      <button
                        key={iconName}
                        type="button"
                        onClick={() => setSelectedIcon(iconName)}
                        title={iconName}
                        className={`p-1 rounded-xl flex items-center justify-center h-12 transition-all border-2 ${isSelected ? 'scale-105' : 'border-transparent'}`}
                        style={{
                          backgroundColor: 'transparent',
                          borderColor: isSelected ? selectedColor : 'transparent'
                        }}>
                        <Icon 
                          name={iconName} 
                          className="w-9 h-9 transition-transform" 
                        />
                      </button>
                    );
                  })}
                  {filteredIcons.length === 0 && (
                    <div className="col-span-full py-4 text-center text-xs text-theme-textSecondary italic">
                      Không tìm thấy biểu tượng phù hợp.
                    </div>
                  )}
                </div>
              </div>

              {/* Submit Buttons */}
              <div className="pt-2">
                <button 
                  type="submit" 
                  className="w-full py-3.5 text-theme-background font-bold rounded-2xl flex justify-center items-center gap-2 hover:brightness-110 active:scale-95 transition-all shadow-lg text-sm"
                  style={{ backgroundColor: selectedColor || 'var(--primary)' }}>
                  <Icon name={editingCategory ? "save" : "check"} className="w-4 h-4 text-white" /> 
                  <span className="text-white">{editingCategory ? "Lưu thay đổi" : "Tạo danh mục mới"}</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    function App() {
      // Data States
      const [accounts, setAccounts] = useState(() => safeJsonParse("vina_accounts", [{ id: 1, name: "Tiền mặt", accountNo: "CASH", balance: 0 }]));
      const [transactions, setTransactions] = useState(() => safeJsonParse("vina_transactions", []));
      
      const [categoryParentMap, setCategoryParentMap] = useState(() => {
        return safeJsonParse("vina_category_parent_map", DEFAULT_CATEGORY_PARENT_MAP);
      });

      const [categories, setCategories] = useState(() => {
          const stored = safeJsonParse("vina_categories", null);
          if (!stored || !Array.isArray(stored) || stored.length === 0) {
              return [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES];
          }
          if (stored.length > 0 && typeof stored[0] === 'string') {
              return [...DEFAULT_PARENT_CATEGORIES, ...DEFAULT_SUBCATEGORIES];
          }
          // If stored categories are old flat ones, merge default parents
          const hasParents = stored.some(c => c && c.isParent);
          const raw = !hasParents ? [...DEFAULT_PARENT_CATEGORIES, ...stored] : stored;
          // Chuyển màu hạng mục mặc định kiểu cũ sang bảng màu vintage
          return deduplicateCategories(raw).map(c => (c && c.color && LEGACY_COLOR_MAP[String(c.color).toUpperCase()]) ? { ...c, color: LEGACY_COLOR_MAP[String(c.color).toUpperCase()] } : c);
      });

      const [categoryBudgets, setCategoryBudgets] = useState(() => safeJsonParse("vina_category_budgets", {}));
      const [monthlyBudget, setMonthlyBudget] = useState(() => safeJsonParse("vina_monthly_budget", 0));
      const [isBudgetModalOpen, setIsBudgetModalOpen] = useState(false);
      const [editingBudgetCat, setEditingBudgetCat] = useState(null);

      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [editingCategory, setEditingCategory] = useState(null);
      const [newCategoryParent, setNewCategoryParent] = useState("");
      const [categoryFilterTab, setCategoryFilterTab] = useState("all"); // "all", "parent", "child"
      
      const [debts, setDebts] = useState(() => safeJsonParse("vina_debts", []));
      const [debtViewMode, setDebtViewMode] = useState("byPerson"); // "byPerson", "all"
      const [expandedDebtPerson, setExpandedDebtPerson] = useState(null);
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem("vina_theme");
        // Lần đầu lên bản mới: chuyển giao diện mặc định cũ ("light") sang Vintage 70s
        if (!localStorage.getItem("vina_theme_v2")) {
          localStorage.setItem("vina_theme_v2", "1");
          if (!saved || saved === "light") return "retro70";
        }
        return (saved && saved in THEMES) ? saved : "retro70";
      });

      // UI States
      const [activeTab, setActiveTab] = useState("overview"); 
      const [subTab, setSubTab] = useState("wallet"); // wallet, debts
      const [isAddTxModalOpen, setIsAddTxModalOpen] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [isOcrScanning, setIsOcrScanning] = useState(false);
      const ocrFileInputRef = React.useRef(null);
      const [isOwnedAssetsExpanded, setIsOwnedAssetsExpanded] = useState(false);
      const [isAddBankModalOpen, setIsAddBankModalOpen] = useState(false);
      const [editingBank, setEditingBank] = useState(null);
      const [bankNameType, setBankNameType] = useState("preset"); // "preset" or "custom"
      const [txParentFilter, setTxParentFilter] = useState("Tất cả");

      // Reports State
      const [reportType, setReportType] = useState(() => localStorage.getItem("vina_report_type") || "Chi tiêu"); // "Chi tiêu" | "Thu nhập"
      const [reportPeriod, setReportPeriod] = useState(() => { const v = localStorage.getItem("vina_report_period"); return v === "Tháng" || v === "Năm" ? v : (v ? "Ngày" : "Tháng"); }); // "Ngày", "Tháng", "Năm"
      const [reportAccount, setReportAccount] = useState("Tất cả");
      const pad2 = (n) => String(n).padStart(2, "0");
      const todayKey = () => { const n = new Date(); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`; };
      const [reportDay, setReportDay] = useState(todayKey());
      const [reportMonth, setReportMonth] = useState(todayKey().slice(0, 7));
      const [reportYear, setReportYear] = useState(new Date().getFullYear());
      const [reportFrom, setReportFrom] = useState(todayKey().slice(0, 8) + "01");
      const [reportTo, setReportTo] = useState(todayKey());
      const [reportSearch, setReportSearch] = useState("");
      const [reportHierarchyView, setReportHierarchyView] = useState(() => localStorage.getItem("vina_report_hview") || "parent"); // "parent" | "child"
      const [drillDownParent, setDrillDownParent] = useState(null); // string or null

      const [showSettingsDialog, setShowSettingsDialog] = useState(false);
      
      const [googleUser, setGoogleUser] = useState(() => {
        try {
          const stored = JSON.parse(localStorage.getItem("vina_google_user"));
          if (stored && stored.email) return stored;
          return null;
        } catch(e) { 
          return null; 
        }
      });
      const [autoCloudSync, setAutoCloudSync] = useState(() => localStorage.getItem("vina_auto_cloud_sync") !== "false");
      const [lastSyncTime, setLastSyncTime] = useState(() => localStorage.getItem("vina_last_google_sync") || null);
      const [lastBackupTime, setLastBackupTime] = useState(() => localStorage.getItem("vina_last_backup_time") || null);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isRealtimeLive, setIsRealtimeLive] = useState(false);
      const [syncMessage, setSyncMessage] = useState(null);
      const [syncStatusDetail, setSyncStatusDetail] = useState("");
      const [restoreTrigger, setRestoreTrigger] = useState(0);
      const lastLocalEditTime = React.useRef(0);
      const isApplyingRemoteUpdate = React.useRef(false);
      // Chỉ cho phép đẩy dữ liệu lên Firebase SAU khi đã kéo bản cloud về ít nhất 1 lần,
      // để máy mới/máy cũ không ghi đè bản mới hơn của máy khác bằng dữ liệu lỗi thời.
      const isFirstAutoPushRun = React.useRef(true);
      // Danh sách id giao dịch đã xoá (tombstone) để lệnh xoá trên 1 máy không bị máy khác "hồi sinh".
      const deletedTxIdsRef = React.useRef((() => { try { return JSON.parse(localStorage.getItem("vina_deleted_tx_ids") || "[]"); } catch(e) { return []; } })());
      const addDeletedTxIds = (ids) => {
        const set = new Set([...deletedTxIdsRef.current, ...ids]);
        deletedTxIdsRef.current = Array.from(set).slice(-5000);
        try { localStorage.setItem("vina_deleted_tx_ids", JSON.stringify(deletedTxIdsRef.current)); } catch(e) {}
      };
      const googleUserRef = React.useRef(null);


      // ==========================================
      // MAI – TRỢ LÝ ĐỌC THÔNG BÁO GIAO DỊCH (OFFLINE)
      // ==========================================
      const isAndroidApp = typeof window !== "undefined" && !!window.MaiBridge;
      const canListen = isAndroidApp && (() => { try { return window.MaiBridge.canListen ? !!window.MaiBridge.canListen() : true; } catch(e) { return true; } })();
      const [maiSettings, setMaiSettings] = useState(() => ({ autoSave: true, speak: false, syncBalance: true, cloudLearn: true, community: false, ...safeJsonParse("vina_mai_settings", {}) }));
      const [maiInbox, setMaiInbox] = useState(() => safeJsonParse("vina_mai_inbox", []));
      const [maiMemory, setMaiMemory] = useState(() => safeJsonParse("vina_mai_memory", {}));
      // Bộ não học hỏi của Mai (web/mai.js): học từ mọi lần anh sửa hạng mục / thu-chi / bỏ qua
      const [maiBrain, setMaiBrain] = useState(() => { const b = safeJsonParse("vina_mai_brain", null); return b && b.keys ? b : (window.MaiAgent ? window.MaiAgent.newBrain() : null); });
      const [maiLog, setMaiLog] = useState(() => safeJsonParse("vina_mai_log", []));
      const [maiDraft, setMaiDraft] = useState(null);
      const [maiInput, setMaiInput] = useState("");
      const [maiAccess, setMaiAccess] = useState(() => { try { return !!(window.MaiBridge && window.MaiBridge.hasNotificationAccess()); } catch(e) { return false; } });
      const maiSeenRef = React.useRef(safeJsonParse("vina_mai_seen", []));
      const stateRef = React.useRef({});
      const [maiCommunity, setMaiCommunity] = useState(() => safeJsonParse("vina_mai_community", null));
      const [maiCloud, setMaiCloud] = useState({ state: "idle" }); // idle | syncing | synced | denied | error
      stateRef.current = { accounts, categories, maiMemory, maiSettings, transactions, maiBrain, maiCommunity };
      const maiOpts = () => ({ brain: stateRef.current.maiBrain, community: stateRef.current.maiSettings.community ? stateRef.current.maiCommunity : null });

      useEffect(() => { localStorage.setItem("vina_mai_settings", JSON.stringify(maiSettings)); }, [maiSettings]);
      useEffect(() => { localStorage.setItem("vina_mai_inbox", JSON.stringify(maiInbox.slice(0, 100))); }, [maiInbox]);
      useEffect(() => { localStorage.setItem("vina_mai_memory", JSON.stringify(maiMemory)); }, [maiMemory]);
      useEffect(() => { try { if (maiBrain) localStorage.setItem("vina_mai_brain", JSON.stringify(maiBrain)); } catch(e) {} }, [maiBrain]);
      // Dạy Mai: examples = [{ text, key, category, type, weight, typeFix }]; ignoreSig = khuôn tin bị bỏ qua
      const maiTeach = (examples, ignoreSig) => {
        if (!window.MaiAgent) return;
        setMaiBrain(prev => {
          const b = JSON.parse(JSON.stringify(prev && prev.keys ? prev : window.MaiAgent.newBrain()));
          (examples || []).forEach(ex => { if (ex && (ex.category || ex.typeFix) && (ex.text || ex.key)) window.MaiAgent.learn(b, ex); });
          if (ignoreSig) window.MaiAgent.learnIgnore(b, ignoreSig);
          return b;
        });
      };
      // Lần đầu: Mai tự học từ lịch sử giao dịch đã có + những gì đã nhớ ở bản cũ
      useEffect(() => {
        if (!window.MaiAgent || localStorage.getItem("vina_mai_brain_trained") === "1" || !transactions.length) return;
        const ex = transactions.filter(t => t && t.note && t.category).slice(0, 3000)
          .map(t => ({ text: t.note, key: t.maiKey || window.MaiAgent.memoryKey(null, t.note), category: t.category, type: t.type, weight: 1 }));
        Object.entries(maiMemory || {}).forEach(([k, c]) => ex.push({ text: k, key: k, category: c, type: "EXPENSE", weight: 3 }));
        maiTeach(ex);
        localStorage.setItem("vina_mai_brain_trained", "1");
      }, [transactions.length]);
      useEffect(() => { localStorage.setItem("vina_mai_log", JSON.stringify(maiLog.slice(0, 60))); }, [maiLog]);

      const maiSpeak = (text) => {
        if (!stateRef.current.maiSettings.speak) return;
        try {
          if (window.MaiBridge && window.MaiBridge.speak) window.MaiBridge.speak(text);
          else if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(text); u.lang = "vi-VN"; window.speechSynthesis.speak(u); }
        } catch(e) {}
      };

      const foldName = (s) => (window.MaiAgent ? window.MaiAgent.fold(String(s || "")) : String(s || "").toLowerCase()).replace(/[^a-z0-9]/g, "");
      // Tìm ví khớp với ngân hàng / 4 số cuối tài khoản trong thông báo
      const maiMatchAccount = (r, accs) => {
        if (r.accountTail) {
          const byNo = accs.find(a => a.accountNo && String(a.accountNo).replace(/\D/g, "").endsWith(r.accountTail));
          if (byNo) return byNo;
        }
        if (!r.bank) return null;
        const key = foldName(r.bank).replace(/^vi/, "");
        return accs.find(a => { const n = foldName(a.name); return n && (n.includes(key) || key.includes(n.replace(/^vi/, ""))); })
          || accs.find(a => getBankLogo(a.name) && getBankLogo(a.name) === getBankLogo(r.bank)) || null;
      };
      // Hạng mục gợi ý phải tồn tại trong cây hạng mục hiện tại của người dùng
      const maiResolveCategory = (name, type, cats) => {
        const has = (n) => cats.some(c => c && c.name === n);
        if (name && has(name)) return name;
        const parent = name && DEFAULT_CATEGORY_PARENT_MAP[name];
        if (parent && has(parent)) return parent;
        const fallback = type === "INCOME" ? "Lương & Thu nhập" : "Khác";
        return has(fallback) ? fallback : (cats.find(c => c && c.isParent)?.name || name || "Khác");
      };

      // Ghi 1 kết quả của Mai vào sổ. Dùng setState dạng hàm để nhiều thông báo đến cùng lúc không đè nhau.
      const maiCommit = (draft, opts = {}) => {
        const { accounts: accs, categories: cats } = stateRef.current;
        const amount = Math.round(Number(draft.amount) || 0);
        if (!(amount > 0)) { showToast("Số tiền chưa hợp lệ", "error"); return null; }
        const type = draft.type === "INCOME" ? "INCOME" : "EXPENSE";
        const category = maiResolveCategory(draft.category, type, cats);
        let bankName = draft.bankName;
        let createdAccount = null;
        if (!bankName || !accs.some(a => a.name === bankName)) {
          const m = maiMatchAccount(draft, accs);
          if (m) bankName = m.name;
          else if (draft.bank) {
            const eff = type === "INCOME" ? amount : -amount;
            createdAccount = { id: Date.now() + Math.floor(Math.random() * 1000), name: draft.bank, accountNo: draft.accountTail ? `xxxx${draft.accountTail}` : "N/A", balance: draft.balance != null ? draft.balance - eff : 0 };
            bankName = draft.bank;
          } else bankName = accs[0]?.name || "Tiền mặt";
        }
        const tx = {
          id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
          type, amount, category, bankName,
          note: (draft.note || "").slice(0, 140),
          date: draft.date || new Date().toISOString(),
          updatedAt: Date.now(),
          source: "mai",
          maiKey: draft.memoryKey || null,
          maiConfidence: draft.confidence || null
        };
        const eff = type === "INCOME" ? amount : -amount;
        lastLocalEditTime.current = Date.now();
        setAccounts(prev => {
          let list = createdAccount && !prev.some(a => a.name === createdAccount.name) ? [...prev, createdAccount] : prev;
          return list.map(a => {
            if (a.name !== bankName) return a;
            // Số dư trong thông báo là số liệu thật của ngân hàng -> khớp theo, nếu được bật
            if (stateRef.current.maiSettings.syncBalance && draft.balance != null && !draft.edited) return { ...a, balance: draft.balance };
            return { ...a, balance: (Number(a.balance) || 0) + eff };
          });
        });
        setTransactions(prev => [tx, ...prev]);
        // Học: anh sửa (chấn chỉnh) -> nhớ mạnh; anh duyệt nguyên -> củng cố nhẹ. Mai tự ghi thì không tự học (tránh tự tin sai).
        if (!opts.auto) maiTeach([{ text: [draft.rawNote, draft.counterparty, draft.note].filter(Boolean).join(" "), key: draft.memoryKey, label: draft.note || draft.rawNote, category, type,
          weight: (draft.categoryEdited || draft.typeEdited) ? 3 : 1, typeFix: draft.typeEdited ? type : null }]);
        setMaiLog(prev => [{ id: tx.id, at: Date.now(), amount, type, category, bankName, note: tx.note, auto: !!opts.auto }, ...prev].slice(0, 60));
        if (!opts.silent) showToast(`Mai đã ghi ${type === "INCOME" ? "+" : "-"}${formatVND(amount)} · ${category}`);
        maiSpeak(`${type === "INCOME" ? "Nhận" : "Chi"} ${new Intl.NumberFormat('vi-VN').format(amount)} đồng, ${category}`);
        return tx;
      };

      // Nhận 1 thông báo thô (từ Android hoặc dán tay) -> phân tích -> chống trùng -> ghi / chờ duyệt
      const maiIngest = (raw, source = "notification") => {
        if (!window.MaiAgent) return { status: "error" };
        const { maiSettings: st, maiBrain: brain } = stateRef.current;
        const r = window.MaiAgent.parse(raw, maiOpts());
        if (!r.ok) return { status: "ignored", reason: r.reason };
        if (window.MaiAgent.shouldIgnore(brain, r.signature)) return { status: "ignored", reason: "learned_ignore", result: r };
        const recent = maiSeenRef.current;
        const now = Date.now();
        if (recent.some(x => window.MaiAgent.isDuplicate(x, r, 5 * 60000) && now - (x.seenAt || 0) < 30 * 60000)) return { status: "duplicate", result: r };
        maiSeenRef.current = [{ amount: r.amount, type: r.type, bank: r.bank, balance: r.balance, date: r.date, seenAt: now }, ...recent].slice(0, 200);

      const communityBusyRef = React.useRef(false);
      const syncMaiCommunity = async (opts = {}) => {
        if (!fbReady() || !window.MaiAgent || communityBusyRef.current) return;
        const st = stateRef.current.maiSettings;
        const uid = window.firebase.auth().currentUser.uid;
        const db = window.firebase.firestore();
        const col = db.collection("mai_community");
        const FV = window.firebase.firestore.FieldValue;
        const sentKey = `vina_mai_community_sent_${uid}`;
        communityBusyRef.current = true;
        try {
          // Đóng góp / rút lại phần của mình
          const sent = safeJsonParse(sentKey, {});

          const batch = db.batch(); let ops = 0;
          Object.keys(want).forEach(id => { if (ops < 400 && sent[id] !== want[id]) { batch.set(col.doc(id), { t: id, u: { [uid]: want[id] }, at: FV.serverTimestamp() }, { merge: true }); ops++; } });
          Object.keys(sent).forEach(id => { if (ops < 450 && !(id in want)) { batch.update(col.doc(id), { [`u.${uid}`]: FV.delete(), at: FV.serverTimestamp() }); ops++; } });
          if (ops) { await batch.commit(); localStorage.setItem(sentKey, JSON.stringify(want)); }

      // ===== Điều hướng "quay lại" (vuốt cạnh màn hình / nút Back Android) =====
      // Thứ tự: đóng cửa sổ đang mở -> về mục trước -> về Tổng quan. Không bao giờ thoát app bằng vuốt.
