<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F0A3A2" />
  <title>Mai · Đăng nhập Google</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;700;800&family=Tiny5&family=VT323&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    :root {
      --sky1: #F0A3A2; --sky2: #F8D3C6; --bg: #F5C4BC;
      --surface: #FCEEDD; --ink: #4A3350; --muted: #85586A;
      --primary: #F49CA6; --accent: #FFD87E; --mint: #A8E6BF;
      --hud: #4E3651; --on-hud: #FFF2E2; --wood: #B76E7B; --danger: #D4506A;
      --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 22px;
      font-family: 'Handjet', system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(180deg, var(--sky1) 0, var(--sky2) 60%, var(--bg) 100%) fixed;
    }
    .console {
      width: 100%; max-width: 400px; background: var(--surface);
      border: 3px solid var(--ink); border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 4px var(--wood), 0 0 0 7px var(--ink), 0 12px 0 4px rgba(74, 51, 80, .22);
      animation: pop .55s var(--spring) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } to { opacity: 1; transform: none; } }
    .topbar {
      background: var(--hud); color: var(--on-hud); text-shadow: 1px 1px 0 rgba(0,0,0,.35);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.2);
      padding: 9px 14px; display: flex; align-items: center; justify-content: space-between;
      font-family: 'Tiny5', monospace; font-size: 11px; letter-spacing: 0.08em; border-bottom: 3px solid var(--ink);
    }
    .led-row { display: flex; align-items: center; gap: 6px; }
    .led { width: 9px; height: 9px; border-radius: 2px; background: #7DFFB0; box-shadow: 0 0 6px #7DFFB0; display: inline-block; animation: blink 2.2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .stripes { height: 4px; background: repeating-linear-gradient(90deg, #F49CA6 0 10px, #FFD87E 10px 20px, #9BE0AE 20px 30px, #A5D8F7 30px 40px); }
    .body { padding: 22px 18px 24px; text-align: center; }
    .sprite-box {
      width: 72px; height: 72px; margin: 0 auto 14px; background: var(--accent);
      border: 3px solid var(--ink); border-radius: 14px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(74,51,80,.16), 0 4px 0 var(--ink);
      display: flex; align-items: center; justify-content: center; animation: float 2.8s ease-in-out infinite;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    h1 { margin: 0; font-family: 'VT323', monospace; font-size: 32px; line-height: 1.05; letter-spacing: 0.02em; }
    .sub { margin: 8px 0 18px; font-size: 17px; line-height: 1.35; color: var(--muted); font-weight: 600; }
    .lcd { background: #2A2140; color: #FFF2E2; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 16px; text-align: left; box-shadow: inset 0 0 18px rgba(0,0,0,.5); position: relative; overflow: hidden; }
    .lcd::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(180deg, rgba(10,6,18,.3) 0 1px, transparent 1px 3px); pointer-events: none; }
    .lcd-label { font-family: 'Tiny5', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9DF5C2; margin: 0 0 4px; }
    .lcd-val { font-family: 'VT323', monospace; font-size: 22px; margin: 0; word-break: break-all; color: #FFE7A8; text-shadow: 0 0 6px rgba(255,231,168,.6); }
    .btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 16px;
      font-family: 'Handjet', sans-serif; font-size: 20px; font-weight: 800; text-decoration: none; color: var(--ink);
      background: var(--primary); border: 3px solid var(--ink); border-radius: 12px; cursor: pointer;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -4px 0 rgba(74,51,80,.16), 0 4px 0 var(--ink);
      transition: transform .32s var(--spring), box-shadow .32s var(--spring);
    }
    .btn:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 var(--ink); transition-duration: .06s; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-mint { background: var(--mint); }
    .btn-ghost { margin-top: 12px; background: var(--surface); font-size: 16px; padding: 10px 14px; }
    .key-badge { font-family: 'Tiny5', monospace; font-size: 11px; padding: 2px 6px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 2px 0 var(--ink); }
    .err { margin-top: 12px; padding: 10px 12px; border: 3px solid var(--ink); background: #FDE1E3; color: var(--danger); border-radius: 12px; font-size: 15px; font-weight: 700; display: none; }
    .hide { display: none !important; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="console">
    <div class="topbar">
      <div class="led-row"><span class="led"></span><span>MAI SYNC LINK</span></div>
      <span>FIREBASE OAUTH</span>
    </div>
    <div class="stripes"></div>
    <div class="body">
      <div class="sprite-box">
        <svg viewBox="0 0 24 24" width="44" height="44" shape-rendering="crispEdges">
          <rect x="7" y="2" width="10" height="3" fill="#EA4335"/>
          <rect x="4" y="5" width="4" height="3" fill="#EA4335"/>
          <rect x="2" y="8" width="4" height="8" fill="#FBBC05"/>
          <rect x="4" y="16" width="4" height="3" fill="#34A853"/>
          <rect x="7" y="19" width="10" height="3" fill="#34A853"/>
          <rect x="17" y="15" width="4" height="4" fill="#4285F4"/>
          <rect x="13" y="11" width="9" height="4" fill="#4285F4"/>
          <rect x="7" y="2" width="10" height="1" fill="#1A1423" opacity="0.25"/>
        </svg>
      </div>
      <h1>ĐĂNG NHẬP GOOGLE</h1>
      <p id="statusSub" class="sub">Kết nối tài khoản Google để sao lưu và đồng bộ sổ chi tiêu VinaSpends giữa điện thoại & máy tính.</p>

      <div id="doneBox" class="hide">
        <div class="lcd">
          <p class="lcd-label">Tài khoản đã xác thực</p>
          <p id="doneEmail" class="lcd-val">...</p>
        </div>
        <a id="returnIntentBtn" href="#" class="btn btn-mint">
          <span class="key-badge">A</span>
          <span>QUAY LẠI APP MAI</span>
        </a>
        <a id="returnDirectBtn" href="#" class="btn btn-ghost">
          Mở bằng liên kết trực tiếp
        </a>
      </div>

      <div id="loginBox">
        <button id="loginBtn" type="button" class="btn">
          <span class="key-badge">A</span>
          <span>CHỌN TÀI KHOẢN GOOGLE</span>
        </button>
      </div>

      <div id="errBox" class="err"></div>
    </div>
  </div>

  <script>
    (function () {
      var FIREBASE_CONFIG = {
        apiKey: "AIzaSyAU13uf9At6vCAaoaAJcn5vt93E3g1QJBc",
        authDomain: "gen-lang-client-0391542892.firebaseapp.com",
        projectId: "gen-lang-client-0391542892",
        storageBucket: "gen-lang-client-0391542892.firebasestorage.app",
        messagingSenderId: "495772766237",
        appId: "1:495772766237:web:96f3fc28071f286747f6f4"
      };

      try {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      } catch (e) {}

      var qs = new URLSearchParams(location.search);
      var ctx = {};
      try { ctx = JSON.parse(sessionStorage.getItem("vina_gauth_ctx") || "{}"); } catch (e) {}
      var port = qs.get("port") || ctx.port || "";
      var state = qs.get("state") || ctx.state || "";
      if (port || state) {
        try { sessionStorage.setItem("vina_gauth_ctx", JSON.stringify({ port: port, state: state })); } catch (e) {}
      }

      var loginBtn = document.getElementById("loginBtn");
      var loginBox = document.getElementById("loginBox");
      var doneBox = document.getElementById("doneBox");
      var doneEmail = document.getElementById("doneEmail");
      var statusSub = document.getElementById("statusSub");
      var errBox = document.getElementById("errBox");
      var returnIntentBtn = document.getElementById("returnIntentBtn");
      var returnDirectBtn = document.getElementById("returnDirectBtn");

      function showErr(msg) {
        errBox.textContent = msg;
        errBox.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span class="key-badge">A</span><span>THỬ ĐĂNG NHẬP LẠI</span>';
      }

      function pingLoopback(queryStr) {
        if (!port || !/^\d+$/.test(String(port))) return;
        var url = "http://127.0.0.1:" + port + "/cb?" + queryStr;
        try { var img = new Image(); img.src = url; } catch (e) {}
        try {
          var fr = document.createElement("iframe");
          fr.style.display = "none";
          fr.src = url;
          document.body.appendChild(fr);
        } catch (e) {}
      }

      function deliverResult(res) {
        var cred = null;
        try {
          cred = firebase.auth.GoogleAuthProvider.credentialFromResult(res) || res.credential;
        } catch (e) {}
        var idToken = (cred && cred.idToken) || "";
        var accessToken = (cred && cred.accessToken) || "";
        var email = (res && res.user && res.user.email) || "";
        if (!idToken && !accessToken) {
          showErr("Không nhận được mã xác thực Google. Anh vui lòng thử lại.");
          return;
        }
        var payload = "idToken=" + encodeURIComponent(idToken)
          + "&accessToken=" + encodeURIComponent(accessToken)
          + "&state=" + encodeURIComponent(state)
          + "&email=" + encodeURIComponent(email);

        try { sessionStorage.removeItem("vina_gauth_ctx"); } catch (e) {}
        try { firebase.auth().signOut(); } catch (e) {}

        var directUrl = "vinaspends://auth?" + payload;
        var intentUrl = "intent://auth?" + payload + "#Intent;scheme=vinaspends;package=com.vinaspends.mai;end";
        returnDirectBtn.href = directUrl;
        returnIntentBtn.href = intentUrl;

        doneEmail.textContent = email || "Tài khoản Google";
        statusSub.textContent = "Xác thực xong! Bấm nút bên dưới nếu app Mai chưa tự mở lại.";
        loginBox.classList.add("hide");
        doneBox.classList.remove("hide");
        errBox.style.display = "none";

        pingLoopback(payload);
        setTimeout(function () {
          try { window.location.href = directUrl; } catch (e) {}
        }, 160);
      }

      // Kiểm tra kết quả redirect nếu vừa quay lại từ trang Google OAuth
      firebase.auth().getRedirectResult().then(function (res) {
        if (res && res.user) deliverResult(res);
      }).catch(function (err) {
        if (err && err.code && err.code !== "auth/null-user") {
          showErr("Lỗi đăng nhập Google: " + (err.message || err.code));
        }
      });

      loginBtn.addEventListener("click", function () {
        errBox.style.display = "none";
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="key-badge">...</span><span>ĐANG MỞ GOOGLE...</span>';
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        firebase.auth().signInWithPopup(provider).then(function (res) {
          if (res && res.user) deliverResult(res);
          else showErr("Chưa nhận được thông tin tài khoản Google.");
        }).catch(function (err) {
          if (err && err.code === "auth/popup-blocked") {
            statusSub.textContent = "Đang chuyển hướng sang trang đăng nhập Google…";
            firebase.auth().signInWithRedirect(provider);
            return;
          }
          if (err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request")) {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span class="key-badge">A</span><span>CHỌN TÀI KHOẢN GOOGLE</span>';
            return;
          }
          showErr("Đăng nhập thất bại: " + (err && err.message ? err.message : "Vui lòng thử lại."));
        });
      });
    })();
  </script>
</body>
</html>
