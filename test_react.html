<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const CurrencyInput = ({ name, defaultValue, placeholder, required, className }) => {
        const [val, setVal] = useState(() => {
            if (defaultValue === undefined || defaultValue === null || defaultValue === "") return "";
            return new Intl.NumberFormat('en-US').format(defaultValue);
        });

        const handleChange = (e) => {
            const numericStr = e.target.value.replace(/[^0-9]/g, '');
            if (!numericStr) {
                setVal('');
                return;
            }
            setVal(new Intl.NumberFormat('en-US').format(parseInt(numericStr, 10)));
        };

        return (
            <React.Fragment>
                <input type="hidden" name={name} value={val.replace(/,/g, '')} />
                <input 
                    type="text" 
                    inputMode="numeric"
                    placeholder={placeholder} 
                    required={required} 
                    className={className}
                    value={val}
                    onChange={handleChange}
                />
            </React.Fragment>
        );
    };

    function App() {
      return (
        <form onSubmit={e => { e.preventDefault(); console.log(e.target.amount.value); }}>
          <CurrencyInput name="amount" placeholder="Amount" />
          <button type="submit">Submit</button>
        </form>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
