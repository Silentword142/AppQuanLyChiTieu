<style>

.ico{width:calc(var(--S)*12);height:calc(var(--S)*12);image-rendering:pixelated;flex:none}

.hud{display:flex;gap:8px}

/* cửa sổ */
.win .bar{display:flex;align-items:center;justify-content:space-between;background:var(--plum);color:var(--cream);margin:-2px -2px 10px;padding:4px 10px;font-weight:700;letter-spacing:.12em;font-size:16px;box-shadow:0 var(--S) 0 var(--ink)}
.dots{display:flex;gap:var(--S)}.dots i{width:calc(var(--S)*2);height:calc(var(--S)*2);background:var(--pink)}.dots i:nth-child(2){background:var(--gold)}.dots i:nth-child(3){background:var(--mint)}
.big{font-size:48px;font-weight:800;line-height:1;letter-spacing:.01em}
.lbl{font-size:16px;letter-spacing:.14em;font-weight:700;color:var(--plumL)}
.meter{height:calc(var(--S)*6);display:flex;gap:var(--S);padding:var(--S);background:var(--ink);margin-top:6px}
.meter i{flex:1;background:#6B5670}.meter i.on{background:var(--gold)}.meter i.on.w{background:var(--exp)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.stat{padding:4px 8px}.stat b{font-size:26px;display:block;line-height:1.1}
/* phím */
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.key{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 2px;font-weight:800;font-size:19px;letter-spacing:.04em;white-space:nowrap}
/* nhật ký */
.item{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:var(--S) dashed var(--shade)}
.item:last-child{border:0}
.item .t{flex:1;line-height:1.15}.item .t small{display:block;color:var(--plumL);font-size:16px}
.item .m{font-weight:800;font-size:22px}
.tile{width:42px;height:42px;display:grid;place-items:center;padding:0}
/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:2;height:118px;padding:0 8px 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 92px repeat(2,minmax(0,1fr));align-items:end;gap:6px}
.dock .base{position:absolute;inset:30px 0 0;z-index:-1}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:16px;letter-spacing:.04em;color:var(--cream);white-space:nowrap}
.dk .cap{width:54px;height:50px;display:grid;place-items:center;padding:0}
.dk.on .lab{color:var(--gold)}
.ghi{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gold);font-weight:800;font-size:16px;letter-spacing:.1em;margin-bottom:-2px}
.ghi canvas{width:84px;height:84px;image-rendering:pixelated}

.tv{position:relative;padding-top:36px}.tv.noant{padding-top:0}.tv.wide{margin:0 -14px}.tv.wide .cnt{padding:14px 12px}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:8px}.ctrl .mini{width:auto;padding:0 6px}.ctrl .brand{flex:1;font-weight:800;letter-spacing:.2em;font-size:14px;color:#3B2A3F;opacity:.7}
.tvlist .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:3px dashed rgba(255,242,226,.14)}.tvlist .it:last-child{border:0}.tvlist .tile{width:46px;height:46px}.tvlist .tile .ico.sm{width:30px;height:30px}.tvlist .t{flex:1;line-height:1.1;font-size:22px}.tvlist .t small{display:block;font-size:16px;opacity:.65}.tvlist .m{font-weight:800;font-size:24px}
.it.new{animation:slidein .5s steps(5) both}@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.ant{position:absolute;left:50%;top:0;width:120px;height:42px;transform:translateX(-50%);image-rendering:pixelated}
.tvbody{position:relative}
.tvtop{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px}
.bezel{padding:0}
.scr{position:relative;height:var(--h,200px);overflow:hidden;background:#2A2140;color:#FFF2E2;
 clip-path:polygon(0 9px,3px 9px,3px 6px,6px 6px,6px 3px,9px 3px,9px 0,calc(100% - 9px) 0,calc(100% - 9px) 3px,calc(100% - 6px) 3px,calc(100% - 6px) 6px,calc(100% - 3px) 6px,calc(100% - 3px) 9px,100% 9px,100% calc(100% - 9px),calc(100% - 3px) calc(100% - 9px),calc(100% - 3px) calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) calc(100% - 3px),calc(100% - 9px) calc(100% - 3px),calc(100% - 9px) 100%,9px 100%,9px calc(100% - 3px),6px calc(100% - 3px),6px calc(100% - 6px),3px calc(100% - 6px),3px calc(100% - 9px),0 calc(100% - 9px))}
/* nền màn: ô lưới phosphor + vignette bậc thang */
.scr::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
 background:repeating-linear-gradient(180deg,rgba(12,6,22,.26) 0 3px,transparent 3px 6px)}
.scr::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
 background:
  linear-gradient(135deg,transparent 0 14%,rgba(255,255,255,.10) 14% 20%,transparent 20% 23%,rgba(255,255,255,.07) 23% 26%,transparent 26%),
  linear-gradient(90deg,rgba(0,0,0,.28) 0 6px,transparent 6px calc(100% - 6px),rgba(0,0,0,.28) calc(100% - 6px)),
  linear-gradient(180deg,rgba(0,0,0,.28) 0 6px,transparent 6px calc(100% - 6px),rgba(0,0,0,.28) calc(100% - 6px))}
.cnt{position:absolute;inset:0;z-index:2;padding:14px 16px;display:flex;flex-direction:column;gap:4px;
 text-shadow:2px 0 0 rgba(255,90,140,.45),-2px 0 0 rgba(90,210,255,.35),0 0 8px rgba(157,245,194,.35)}
.cnt.glitch{animation:glitch .36s steps(6) both}
.osd{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.1em;font-size:17px;color:#9DF5C2}
.tvlbl{font-size:16px;letter-spacing:.12em;opacity:.8;margin-top:6px}
.tvbig{font-size:46px;font-weight:800;line-height:1}
.cur{display:inline-block;width:12px;height:30px;background:#9DF5C2;margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-2px}
.hp{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}.hp i{height:12px;background:rgba(255,242,226,.14)}.hp i.on{background:#FFD36E}.hp i.on.r{background:#FF7D95}
.cbar{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:4px}.cbar i{flex:1;background:#FFA5BC;animation:grow .5s steps(5) both}.cbar i.t{background:#FFD36E}
.chdots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}.chdots i{width:12px;height:6px;background:rgba(255,242,226,.22)}.chdots i.on{width:24px;background:#9DF5C2}
.noise{position:absolute;inset:0;width:100%;height:100%;z-index:3;image-rendering:pixelated;opacity:0}
.noise.on{opacity:1}
.bars{position:absolute;inset:0;z-index:3;display:flex;opacity:0}.bars.on{opacity:1}
.bars i{flex:1}.bars i:nth-child(1){background:#FFF6E9}.bars i:nth-child(2){background:#FFD36E}.bars i:nth-child(3){background:#7DD3C6}.bars i:nth-child(4){background:#9BE0AE}.bars i:nth-child(5){background:#F49CA6}.bars i:nth-child(6){background:#EE6B6E}.bars i:nth-child(7){background:#6E9FDE}
.roll{position:absolute;left:0;right:0;height:18px;top:-18px;z-index:4;background:repeating-linear-gradient(180deg,rgba(157,245,194,.10) 0 3px,transparent 3px 6px);animation:roll 6s steps(60) infinite}
.pwr{position:absolute;inset:0;z-index:7;background:#2A2140;pointer-events:none}
.pwr.go{animation:pwrOff .9s steps(9) forwards}
.pwr::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:#FFF6E9;box-shadow:0 0 0 3px rgba(157,245,194,.5)}
.pwr.go::before{animation:pwrLine .9s steps(9) forwards}
.side{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.knob{width:48px;height:48px;image-rendering:pixelated;animation:knob 6s steps(1) infinite}
.mini{width:48px;text-align:center;font-weight:800;font-size:15px;padding:0;line-height:16px}
.grille{width:42px;height:30px;background:repeating-linear-gradient(180deg,#3B2A3F 0 3px,transparent 3px 6px);opacity:.55}
.led{width:9px;height:9px;background:#7DFFB0;box-shadow:0 0 0 3px #3B2A3F;animation:led 2.4s steps(4) infinite}
.feet{display:flex;justify-content:space-between;padding:0 40px;margin-top:-6px}.feet span{width:36px;height:12px;background:#5A3D62;box-shadow:0 3px 0 #3B2A3F,3px 0 0 #3B2A3F,-3px 0 0 #3B2A3F}
@keyframes blink{50%{opacity:0}}
@keyframes roll{to{top:100%}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cbar i{transform-origin:bottom}

@keyframes pwrOff{0%,40%{clip-path:inset(0)}100%{clip-path:inset(50% 0 50% 0)}}
@keyframes pwrLine{0%{transform:scaleX(0)}40%{transform:scaleX(1);opacity:1}100%{opacity:0}}
@keyframes led{50%{background:#C9FFE0}}
@keyframes knob{0%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
.f-tv{}

.mbar{height:9px;background:rgba(255,242,226,.12);margin-top:4px}.mbar i{display:block;height:100%;animation:mgrow .6s steps(6) both;transform-origin:left}

.pie{display:flex;gap:14px;align-items:center;margin-top:6px}.pie canvas{width:120px;height:120px;image-rendering:pixelated;animation:spinin .6s steps(6) both}
@keyframes spinin{from{transform:rotate(-90deg) scale(.4);opacity:0}}
.leg{display:flex;flex-direction:column;gap:6px;font-size:17px}.leg i{display:inline-block;width:12px;height:12px;margin-right:6px;box-shadow:0 0 0 2px #FFF2E2}
.sw{width:46px;height:24px;background:rgba(255,242,226,.18);position:relative;flex:none;box-shadow:0 0 0 3px #FFF2E2}.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#FFF2E2;transition:left .25s steps(4)}.sw.on{background:#55B27F}.sw.on i{left:25px}
.mai{display:flex;gap:12px;align-items:center;margin-top:6px}.mai canvas{width:96px;height:64px;image-rendering:pixelated}
.say{font-size:20px;line-height:1.15;color:#FFF2E2}.cur.sm{width:8px;height:16px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;text-align:center;font-size:14px;letter-spacing:.08em;border-top:3px dashed rgba(255,242,226,.18);padding-top:6px}.stat3 b{display:block;font-size:30px;line-height:1}
.wcard{margin-top:4px}.chipt{color:#2A2140;font-weight:800;padding:0 8px;font-size:15px;letter-spacing:.1em;text-shadow:none}
.key{justify-content:center;min-height:84px}.key.on{transform:translateY(3px);filter:brightness(.95)}
.dk{cursor:pointer}
.tile.px,.mini.px,.chdots .px,.tvlist .px,.dk .cap.px,.sq.px{--S:2px}
.dk .cap{width:58px!important;height:56px!important}.dk .cap .ico{width:40px;height:40px}.sq .ico{width:40px;height:40px}.leg{font-size:15px!important;gap:4px!important}
.key,.dk .cap,.sq,.mini{cursor:pointer;transition:transform .08s steps(2)}
.key:active,.dk .cap:active,.mini:active{transform:translate(0,4px)}

/* ---------- Dock tràn đáy, chi tiết + hiệu ứng ---------- */
.dock{height:150px!important;padding:0 6px 32px!important}
.dock .base{position:absolute;left:0;right:0;bottom:0;top:36px!important;z-index:-1;background:
  radial-gradient(circle at 1.5px 1.5px,rgba(255,255,255,.07) 1.5px,transparent 1.6px) 0 0/9px 9px,

<body>
<canvas id="sky" width="100" height="215"></canvas>
<div class="app" id="app"></div>

<div class="dock">
  <div class="base"><div class="leds"></div><i class="rv l"></i><i class="rv r"></i><div class="grl l"></div><div class="grl r"></div></div>
  <div class="dk on"><div class="cap px" data-f="pink"><img class="ico" data-i="homec"></div><span class="lab">NHÀ</span></div>
  <div class="dk"><div class="cap px" data-f="mint"><img class="ico" data-i="chartc"></div><span class="lab">BÁO CÁO</span></div>
  <div class="ghi"><canvas id="coin" width="28" height="28"></canvas><canvas class="spk" id="spk" width="28" height="28"></canvas><span class="lb">GHI</span></div>
  <div class="dk"><div class="cap px" data-f="lilac"><img class="ico" data-i="maic"></div><span class="lab">TỰ ĐỘNG</span></div>
  <div class="dk"><div class="cap px" data-f="sky"><img class="ico" data-i="walletc"></div><span class="lab">VÍ & NỢ</span></div>
</div>

<script>
// ---------- Khung pixel 9-slice (vẽ mới) ----------
const FRAME = ["..kkkkkk....",".kHHHHHHk...","kHHHHHHHhk..","kHhbbbbbskd.","kHhbbbbbskde","kHhbbbbbskde","kHhbbbbbskde","kmmmmmmmmkde","kSSSSSSSSkde",".kSSSSSSkdde","..kkkkkkddee","...ddddddee.","....eeeeee.."];
function mix(a,b,k){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,"0")).join("")}
function fcols(f){return {k:"#3B2A3F",d:"rgba(59,42,63,.42)",e:"rgba(59,42,63,.18)",H:mix(f.b,"#FFFFFF",.55),h:f.h,b:f.b,s:f.s,m:mix(f.b,"#3B2A3F",.55),S:mix(f.b,"#3B2A3F",.28)}}
// cột/hàng giữa (chỉ số 4) được kéo giãn
const FR = {
  paper:{b:"#FFF6E9",h:"#FFFFFF",s:"#EED6C2"},
  hud:{b:"#5A3D62",h:"#7A5784",s:"#4A3150"},
  plum:{b:"#6A4872",h:"#8A6694",s:"#523858"},
  pink:{b:"#FBC2C8",h:"#FFE3E6",s:"#EE96A4"},

function card(tag,name,bal,col){return `<div class="wcard"><div class="row" style="justify-content:space-between"><span class="chipt" style="background:${col}">${tag}</span><span class="tvlbl">SỐ DƯ</span></div><div class="tvlbl" style="margin-top:8px">${name}</div><div class="tvbig" style="color:${col}">${bal}<span class="cur"></span></div><div class="hp">${Array.from({length:14},(_,i)=>`<i class="${i<10?'on':''}" style="${i<10?'background:'+col:''}"></i>`).join("")}</div></div>`}
function debt(n,s,v,pct,col){return `<div class="it new"><div class="t">${n}<small>${s}</small><div class="mbar"><i style="width:${pct}%;background:${col}"></i></div></div><div class="m" style="color:${col}">${v}</div></div>`}
function maiFace(id){const c=document.getElementById(id);if(!c)return;const g=c.getContext("2d");let t=0;
  const draw=()=>{g.clearRect(0,0,24,16);g.fillStyle="#3B2A3F";g.fillRect(0,0,24,16);g.fillStyle="#D3B9F2";g.fillRect(1,1,22,14);g.fillStyle="#2A2140";g.fillRect(3,3,18,10);
    g.fillStyle="#9DF5C2";const blink=t%8==0;if(blink){g.fillRect(6,7,3,1);g.fillRect(15,7,3,1)}else{g.fillRect(6,5,3,3);g.fillRect(15,5,3,3)}
    const talk=t%2;g.fillRect(9,10,6,1);if(talk)g.fillRect(10,11,4,1);g.fillStyle="#FFA5BC";g.fillRect(4,9,2,1);g.fillRect(18,9,2,1);t++};
  draw();setInterval(draw,300)}

const NAMES=["home","report","auto","wallet"];
function go(name){
  TIMERS.splice(0).forEach(clearInterval);TVS.length=0;
  const app=document.getElementById("app");app.innerHTML=SCREENS[name].html;decorate(app);
  const els=app.querySelectorAll("[data-tv]");
  SCREENS[name].tvs.forEach((cfg,i)=>{buildTV(els[i],cfg);if(cfg.after)cfg.after()});
  document.querySelectorAll(".dk").forEach((d,i)=>d.classList.toggle("on",NAMES[i]===name));
  if(!location.hash.includes("still")){setInterval(()=>TVS[0]&&TVS[0](1),3200);setTimeout(()=>setInterval(()=>TVS[1]&&TVS[1](1),3200),1600)}
}
// buildTV vẽ lại kênh -> chạy lại hàm after (bánh/mặt Mai) sau mỗi lần đổi kênh
const _build=buildTV;
buildTV=function(el,cfg){if(cfg.after){cfg.ch=cfg.ch.map(f=>()=>{setTimeout(cfg.after,20);return f()})}return _build(el,cfg)};
document.querySelectorAll(".dk").forEach((d,i)=>d.onclick=()=>go(NAMES[i]));
go((location.hash.match(/s=(\w+)/)||[])[1]||"home");
// ---------- Bầu trời: dải màu dithering, mặt trời, đồi nhiều lớp, mây trôi nhiều tầng, sao lấp lánh, sao băng, chim (vẽ mới) ----------
(function(){const cv=document.getElementById("sky"),W=100,H=Math.ceil(document.body.scrollHeight/4)||325;cv.width=W;cv.height=H;
 cv.style.width=W*4+"px";cv.style.height=H*4+"px";const g=cv.getContext("2d");
 const base=document.createElement("canvas");base.width=W;base.height=H;const b=base.getContext("2d");
 const P=(c,x,y,col)=>{c.fillStyle=col;c.fillRect(x,y,1,1)};
 const bands=["#E99AAE","#F1A4AE","#F7AFAD","#F9BCB2","#FAC9B9","#FBD5C1","#FCDFC9"];const bh=Math.ceil(H/bands.length);
 for(let y=0;y<H;y++){const i=Math.min(bands.length-1,Math.floor(y/bh)),t=y%bh;for(let x=0;x<W;x++){let c=bands[i];
   if(i<bands.length-1&&t>=bh-5){const k=bh-t;if((k<=2&&(x+y)%2===0)||(k>2&&(x%2===0&&y%2===0)))c=bands[i+1]}P(b,x,y,c)}}
 // mặt trời hoàng hôn sau đồi, có viền sáng
 const sx=72,sy=H-30;for(let y=-14;y<=14;y++)for(let x=-14;x<=14;x++){const d=Math.hypot(x,y);
   if(d<=11)P(b,sx+x,sy+y,(y>3&&y%3===0)?"#FBD5C1":"#FFE7B0");else if(d<=13&&(x+y)%2===0)P(b,sx+x,sy+y,"#FFE2C2")}
 // đồi 3 lớp
 [[26,"#E7A3B0","#D98FA0",5,2,.07],[19,"#E39A9E","#CE8390",4,1,.11],[11,"#D58A8F","#BE7380",3,1,.15]].forEach(([off,c1,c2,a1,a2,f])=>{
   for(let x=0;x<W;x++){const h=Math.round(off+a1*Math.sin(x*f+off)+a2*Math.sin(x*f*2.7));for(let y=H-h;y<H;y++)P(b,x,y,y===H-h?c2:c1)}});
 // mây
 const CL={big:["......wwww..............","....wwhhhhww....wwww....","...whhhhhhhhw..whhhhw...",".wwhhhhhhhhhhwwhhhhhhww.","whhhhhhhhhhhhhhhhhhhhhhw","whhhhhhhhhhhhhhhhhhhhhhw","wsssssssssssssssssssssss",".ssssssssssssssssssssss.","...ssssss......ssssss..."],
   mid:["....wwww........","..wwhhhhww.www..",".whhhhhhhhwhhhw.","whhhhhhhhhhhhhhw","wsssssssssssssss",".ssssssssssssss."],
   sm:["..www....",".whhhwww.","whhhhhhhw","sssssssss"]};
 const CC={w:"#FFE9E3",h:"#FFF8F3",s:"#F6CFC8"};
 const clouds=[];const add=(t,x,y,sp)=>clouds.push({t,x,y,sp});
 add("big",4,14,.05);add("mid",60,34,.09);add("sm",30,6,.14);add("big",70,74,.05);add("sm",12,58,.14);add("mid",26,104,.09);add("sm",80,128,.14);add("mid",-4,150,.09);add("big",50,180,.05);add("sm",36,214,.14);add("mid",76,240,.09);
 const stars=[];for(let i=0;i<60;i++)stars.push({x:(i*37+11)%W,y:(i*53+7)%Math.floor(H*.75),p:i%7,big:i%3===0});
 const birds=[{x:20,y:46,sp:.25},{x:28,y:50,sp:.25},{x:24,y:43,sp:.25}];
 let tick=0,shoot=null;
 function draw(){g.drawImage(base,0,0);
  stars.forEach(s=>{const ph=(tick+s.p*3)%21;if(ph>15)return;const c=ph<5?"#FFFFFF":"#FFEFD8";P(g,s.x,s.y,c);
    if(s.big&&ph<8){[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>P(g,s.x+dx,s.y+dy,"#FFE9C8"));if(ph<3)[[2,0],[-2,0],[0,2],[0,-2]].forEach(([dx,dy])=>P(g,s.x+dx,s.y+dy,"rgba(255,255,255,.6)"))}});
  if(!shoot&&tick%90===40)shoot={x:90,y:8,l:0};
  if(shoot){for(let i=0;i<6;i++)P(g,shoot.x+i,shoot.y-Math.floor(i/2),i===0?"#FFFFFF":"rgba(255,246,233,"+(1-i/6)+")");shoot.x-=2;shoot.y+=1;if(shoot.x<-6)shoot=null}
  clouds.forEach(c=>{const s=CL[c.t];const w=s[0].length;let x=Math.round(c.x)%(W+w);if(x<-w)x+=W+w;x=x>W?x-(W+w):x;
    s.forEach((r,y)=>[...r].forEach((ch,i)=>{if(CC[ch])P(g,x+i,c.y+y,CC[ch])}));c.x+=c.sp});
  birds.forEach(bd=>{const f=Math.floor(tick/3)%2,x=Math.round(bd.x)%(W+10)-5;
    if(f){P(g,x,bd.y,"#8C5A70");P(g,x+1,bd.y+1,"#8C5A70");P(g,x+2,bd.y,"#8C5A70")}else{P(g,x,bd.y+1,"#8C5A70");P(g,x+1,bd.y,"#8C5A70");P(g,x+2,bd.y+1,"#8C5A70")}bd.x+=bd.sp});
  tick++}
 draw();if(!location.hash.includes("still"))_si?_si(draw,160):setInterval(draw,160);
})();
</script>
