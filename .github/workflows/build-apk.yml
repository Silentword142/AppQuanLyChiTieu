name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build:web

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner dalvik-exchange

      - name: Build Android APK
        env:
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-34/android.jar
        run: |
          bash android/build-apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VinaSpends-Mai-APK
          path: android/build/VinaSpends-Mai.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/VinaSpends-Mai.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
