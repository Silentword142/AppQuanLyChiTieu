name: Deploy Web App to GitHub Pages

on:
  # Chạy tự động khi có code mới đẩy lên nhánh main hoặc master
  push:
    branches: ["main", "master"]
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

# Cấp quyền cho GITHUB_TOKEN để cho phép triển khai lên Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ cho phép một quá trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Chỉ lấy thư mục web để đưa lên hosting
          path: './web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
